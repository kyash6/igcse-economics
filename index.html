 EX('Exam-style: evaluate structure','Evaluate the use of fines to reduce pollution by businesses.',['For: fines raise the cost of polluting → firms have an incentive to clean up.','For: “the polluter pays” — fair; revenue can fund clean-up.','Against: firms may pass the cost on to consumers through higher prices.','Against: enforcement is costly; small fines are ignored by large firms.','Judgement: effective if fines are large relative to profits AND enforcement is strong.'],'Balance + “depends on size and enforcement”'),
 Q('A weakness of regulation is that…',['It is costly to monitor and enforce','It raises tax revenue','It changes prices','It always increases pollution'],0,'Inspectors and legal systems cost money.'),
 S('Regulation/legislation: direct, clear — but enforcement costs, no revenue.','Fines: deter and raise revenue — but must be large and enforced.','Permits: cap and trade — but hard to set the cap.')],5);

LS('po:4','2.1.3','⇔','The government can’t always hit every target at once. These four trade-offs are favourite 12-mark questions.',[
 C('Four key trade-offs',[
  ['Unemployment v inflation','Boosting demand to cut unemployment → more people earn incomes → consumption ↑ → AD ↑ → demand-pull inflation (not cost-push).'],
  ['Growth v inflation','Fast growth can push demand beyond capacity → inflation. Raising interest rates to cut inflation slows growth.'],
  ['Growth v environment','More production → more pollution, waste and resource depletion.'],
  ['Inflation v current account','Higher inflation makes exports less competitive → current account deficit. Higher incomes from growth also suck in imports.']]),
 VS('Example: cutting unemployment can raise inflation',chain(['Tax cuts &|spending ↑','Demand ↑','Unemployment ↓','Wages & prices ↑','Inflation ↑'],{steps:1}),`<ul class="blist"><li>Expansionary policy reduces cyclical unemployment…</li><li>…but as the economy nears full capacity, extra demand mostly raises prices.</li></ul>`),
 I('How to evaluate a trade-off',[
  `${B('Spare capacity')}: if the economy is in recession, more demand raises output with little inflation.`,
  `${B('Supply-side policies')} can avoid the trade-off by increasing capacity.`,
  `${B('Time period')}: some conflicts are short-term only.`,
  `${B('Green technology')} can allow growth with less environmental damage.`]),
 EX('Exam-style: evaluate (12 marks) outline','Evaluate whether a government can achieve both low unemployment and low inflation.',['Conflict: expansionary fiscal/monetary policy cuts unemployment but risks demand-pull inflation.','Conflict: low unemployment gives workers bargaining power → wage rises → cost-push inflation.','No conflict: if there is spare capacity (recession), output can rise without much inflation.','No conflict: supply-side policies (training, infrastructure) raise capacity → both objectives.','Judgement: achievable in the long run with supply-side policies; in the short run there is usually a trade-off, depending on spare capacity.'],'Use “depends on spare capacity”'),
 Q('Which policy is LEAST likely to create a trade-off between objectives?',['Supply-side policy that raises productivity','Cutting interest rates in a boom','Raising government spending at full capacity','Raising taxes in a recession'],0,'Raising capacity helps several objectives at once.'),
 S('Unemployment v inflation · growth v inflation · growth v environment · inflation v current account.','Trade-offs are strongest near full capacity.','Supply-side policies can reduce conflicts.','Evaluate with spare capacity, time period and technology.')],7);

/* ════════════ 10 · THE GLOBAL ECONOMY ════════════ */
LS('gl:0','2.2.1','🌐','The world’s economies are more connected than ever. Globalisation brings cheaper goods and growth — but also winners and losers.',[
 FM('Globalisation','Globalisation = the increased integration and interdependence of economies',[['Integration','trade, investment, people and ideas move more freely between countries'],['Interdependence','countries rely on each other for goods, jobs and investment']],'Your phone: designed in the USA, chips from Taiwan, assembled in China, sold worldwide.'),
 C('Reasons for globalisation',[
  ['Fewer tariffs and quotas','Trade agreements and the WTO have reduced trade barriers.'],
  ['Reduced cost of transport','Container ships and cheaper air freight cut the cost of moving goods.'],
  ['Reduced cost of communication','The internet, video calls and email make global business easy.'],
  ['Growth of MNCs','Large firms operate in many countries, spreading production and brands.']]),
 C('Impacts of globalisation',[
  ['✔ Rising living standards','Trade and investment boost growth and incomes (e.g. China, Vietnam).'],
  ['✔ Greater choice','Consumers can buy products from all over the world.'],
  ['✔ Lower prices','Production moves to low-cost countries; more competition.'],
  ['✔ Cheaper communication','Firms reach global markets easily.'],
  ['✘ Closing of traditional industries','Domestic firms that can’t compete close → structural unemployment.'],
  ['✘ Environmental impact','More transport emissions; production moves to countries with weaker environmental rules.']]),
 I('Who wins and who loses?',[
  `${B('Consumers')}: lower prices and more choice.`,
  `${B('Producers')}: bigger markets and cheaper inputs — but more foreign competition.`,
  `${B('Workers')}: new jobs in growing industries; job losses in declining ones; pressure on wages.`,
  `${B('Governments')}: more tax revenue from growth — but less control (e.g. MNCs moving profits).`]),
 Q('Which is a reason for the growth of globalisation?',['Lower costs of transport and communication','Higher tariffs','More quotas','Higher transport costs'],0,'Cheaper movement of goods and information.'),
 S('Globalisation = increased integration and interdependence.','Causes: fewer tariffs & quotas, cheaper transport & communication, MNCs.','Impacts: living standards, choice, prices v closures and environment.','Analyse impacts for each stakeholder.')],6);

LS('gl:1','2.2.1','🏢','Multinational corporations operate across the world. Do they help or harm the countries they invest in?',[
 C('Definitions',[
  ['Multinational corporation (MNC)','A business with its headquarters in one country and operations in other countries — e.g. Toyota, Unilever, Apple, Nestlé.'],
  ['Foreign direct investment (FDI)','Investment by a firm in one country in productive assets (factories, offices, mines) in another country.']]),
 C('Why do MNCs/FDI emerge?',[
  ['Economies of scale','Producing for a global market lowers average costs.'],
  ['Natural resources & cheap materials','Access to oil, minerals or cheap labour (e.g. mining in Africa, factories in Bangladesh).'],
  ['Lower transport & communication costs','Producing close to customers or using cheap global logistics.'],
  ['Access to customers in different regions','Avoid trade barriers and sell to large markets (e.g. Japanese car plants in the UK and USA).']]),
 C('Advantages for the host country',[['Creating jobs','Direct jobs and jobs at local suppliers.'],['Investing in infrastructure','Roads, ports and power built to support the plant.'],['Developing skills','Training raises human capital.'],['Developing capital','New technology and machinery.'],['Contributing taxes','Corporation tax and income tax from workers.']]),
 C('Disadvantages for the host country',[['Avoiding paying taxes','Profits shifted to low-tax countries.'],['Environmental damage','Pollution, deforestation, weak regulation.'],['Moving profits abroad','Profits return to the home country rather than being reinvested.'],['Other','Local firms may be forced out; low wages and poor conditions; the MNC may leave suddenly.']]),
 EX('Exam-style: assess (9 marks)','Assess the benefits of FDI by a car manufacturer to a developing country.',['For: <b>jobs</b> in the factory and local suppliers → incomes rise → lower poverty.','For: <b>skills and technology</b> transfer → productivity rises → long-term growth.','Against: profits are <b>sent abroad</b> to the MNC’s home country, so less money circulates locally.','Against: tax breaks offered to attract the MNC reduce government revenue.','Judgement: depends on whether local workers are trained for skilled jobs and on the taxes the MNC actually pays.'],'Both sides + depends on skills and taxes'),
 Q('FDI is…',['Investment by a firm in productive assets in another country','Buying foreign shares for a short time','Exporting goods','Government aid'],0,'Factories, offices or mines abroad.'),
 S('MNC: operates in many countries. FDI: investing in productive assets abroad.','Reasons: economies of scale, resources, lower costs, customers.','Pros: jobs, infrastructure, skills, capital, taxes.','Cons: tax avoidance, environment, profits abroad.')],7);

LS('gl:2','2.2.2','⇆','Free trade means no barriers between countries. It lowers prices — but it can cost jobs.',[
 FM('Free trade','Free trade = international trade without barriers such as tariffs, quotas or subsidies',[['Specialisation','countries produce what they are best at and trade for the rest']],'More trade → more competition → more efficiency.'),
 C('Advantages of free trade',[
  ['Lower prices & more choice for consumers','Cheaper imports and a wider range of goods.'],
  ['Lower input costs','Firms can buy cheaper raw materials and components from abroad.'],
  ['Wider markets for businesses','Exporters sell to millions more customers → economies of scale.'],
  ['Efficiency','Foreign competition forces domestic firms to improve.']]),
 C('Disadvantages of free trade',[
  ['Foreign competition harms domestic businesses','Firms that can’t compete close (e.g. UK steel, textiles).'],
  ['Increasing unemployment','Structural unemployment in declining industries.'],
  ['Dependence','Relying on imports for essentials (food, energy) is risky.'],
  ['Infant industries','New industries can’t grow up against established foreign giants.']]),
 VS('Free trade in a diagram',tradeDiagram('free'),`<ul class="blist"><li>With free trade, the price is the <b>world price</b> (Pw), below the domestic equilibrium.</li><li>Domestic firms supply Q1; consumers buy Q2.</li><li>The gap Q1 → Q2 is filled by <b>imports</b>.</li></ul>`),
 Q('Which is a benefit of free trade to businesses?',['Wider markets for their exports','Protection from foreign competition','Higher input costs','Tariff revenue'],0,'They can sell to more customers abroad.'),
 S('Free trade = no tariffs, quotas or subsidies.','✔ lower prices, choice, cheaper inputs, wider markets.','✘ domestic firms harmed, unemployment.','Diagram: world price below domestic price → imports.')],6);

LS('gl:3','2.2.2','⛔','Governments sometimes protect domestic firms from foreign competition. Learn the seven reasons, three methods and their diagrams.',[
 C('Seven reasons for protection',[
  ['Prevent dumping','Stop foreign firms selling below cost to drive out domestic firms.'],
  ['Protect employment','Save jobs in industries facing cheap imports.'],
  ['Protect infant industries','Give new industries time to grow and gain economies of scale.'],
  ['Gain tariff revenue','Tariffs raise money for the government.'],
  ['Protect consumers from unsafe products','Ban imports that do not meet safety standards.'],
  ['Reduce a current account deficit','Fewer imports → better balance.'],
  ['Retaliation','Respond to another country’s barriers.']]),
 VS('A tariff',tradeDiagram('tariff'),`<ul class="blist"><li>A <b>tariff</b> is a tax on imports → the price rises from Pw to Pt.</li><li>Domestic production rises (Q1 → Q3); consumption falls (Q2 → Q4).</li><li>Imports shrink to Q3–Q4; the shaded area is <b>tariff revenue</b>.</li></ul>`),
 VS('A quota',tradeDiagram('quota'),`<ul class="blist"><li>A <b>quota</b> is a physical limit on imports.</li><li>The limited supply raises the domestic price; domestic firms produce more.</li><li>No tariff revenue for the government — foreign firms may gain from the higher price.</li></ul>`),
 VS('A subsidy to domestic producers',tradeDiagram('subsidy'),`<ul class="blist"><li>A subsidy lowers domestic firms’ costs → domestic supply shifts right.</li><li>Domestic output rises (Q1 → Q3); imports fall; the price stays at Pw.</li><li>Costs the government money (opportunity cost).</li></ul>`),
 C('Evaluating the methods',[
  ['Tariffs','✔ revenue, protect jobs ✘ higher prices for consumers, risk of retaliation, inefficiency.'],
  ['Quotas','✔ certain limit on imports ✘ higher prices, no revenue, shortages.'],
  ['Subsidies','✔ consumers keep low prices, domestic output rises ✘ cost to taxpayers, firms may become inefficient, breaks WTO rules if export subsidies.']]),
 Q('Which method of protection raises revenue for the government?',['A tariff','A quota','A subsidy','An embargo'],0,'A tariff is a tax on imports.'),
 Q('Protecting a new solar panel industry until it can compete is the… argument',['Infant industry','Dumping','Retaliation','Tariff revenue'],0,'New industries need time to grow.'),
 S('Reasons: dumping, jobs, infant industries, revenue, safety, current account, retaliation.','Methods: tariffs, quotas, subsidies.','Diagrams: tariff (price ↑, imports ↓, revenue), quota, subsidy.','Evaluate: prices, retaliation, efficiency, cost.')],8);

LS('gl:4','2.2.2','◎','Countries form trading blocs and follow WTO rules. And developed and developing countries trade very different things.',[
 C('Trading blocs',[
  ['Definition','A group of countries that reduce or remove trade barriers between themselves.'],
  ['Examples','EU (customs union + single market), USMCA (USA, Mexico, Canada), ASEAN (Southeast Asia), Mercosur (South America), AfCFTA (Africa).'],
  ['Free trade area','No tariffs between members; each sets its own tariffs on non-members.'],
  ['Customs union','Free trade between members + a common external tariff.']]),
 C('Impact of trading blocs',[
  ['Members ✔','Bigger market, more trade, economies of scale, lower prices, more FDI.'],
  ['Members ✘','Less independence on trade policy; uncompetitive firms close.'],
  ['Non-members ✘','Face tariffs → lose exports to the bloc; trade diversion away from them.'],
  ['Non-members ✔','May set up factories inside the bloc (FDI) to avoid tariffs.']]),
 C('The World Trade Organization (WTO)',[
  ['Promotes free trade','Negotiates reductions in tariffs and quotas.'],
  ['Sets rules','All members must follow agreed trade rules, e.g. no unfair export subsidies.'],
  ['Settles disputes','Rules on trade disputes between countries; can allow retaliation.'],
  ['Monitors','Reviews members’ trade policies; helps developing countries.']]),
 C('Trade patterns',[
  ['Developed countries','Export high-value manufactured goods and services (finance, technology, cars); import raw materials and cheap manufactures.'],
  ['Developing countries','Often export primary products (cocoa, coffee, oil, minerals) and low-cost manufactures; import capital goods and technology.'],
  ['Why it matters','Primary products have inelastic supply and volatile prices → unstable export earnings. Many developing countries (China, Vietnam) have moved into manufacturing.']]),
 Q('A key role of the WTO is to…',['Settle trade disputes between countries','Set interest rates','Lend money to governments','Run a single currency'],0,'The WTO promotes free trade and resolves disputes.'),
 S('Trading blocs: free trade between members (EU, USMCA, ASEAN…).','Members gain markets; non-members face barriers.','WTO: promotes free trade, sets rules, settles disputes.','Developed export high-value goods and services; developing often export primary products.')],6);

LS('gl:5','2.2.3','$£','An exchange rate is just a price — the price of one currency in another. It is set by supply and demand.',[
 FM('Exchange rate','Exchange rate = the price of one currency in terms of another',[['Example','£1 = $1.25 means one pound buys one dollar twenty-five'],['Floating','set by demand and supply in the foreign exchange market']],'Convert: foreign price = home price × rate; home price = foreign price ÷ rate.'),
 VS('Demand and supply for a currency',fxDiagram({}),`<ul class="blist"><li><b>Demand for £</b> comes from foreigners buying UK exports, visiting the UK, investing in UK assets or saving in UK banks.</li><li><b>Supply of £</b> comes from UK residents buying imports, holidaying abroad or investing abroad (they sell £ to buy other currencies).</li><li>The exchange rate is where demand = supply.</li></ul>`),
 C('Factors affecting demand and supply of a currency',[
  ['Interest rates','Higher UK interest rates → foreign savers buy £ to save in the UK → demand for £ ↑ → £ appreciates.'],
  ['Currency speculators','If traders expect the £ to rise, they buy now → demand ↑ → it rises.'],
  ['Exports','More UK exports → foreigners need £ → demand for £ ↑.'],
  ['Imports','More UK imports → UK buyers sell £ for foreign currency → supply of £ ↑ → £ depreciates.']]),
 VS('Higher interest rates → appreciation',fxDiagram({d:2}),`<ul class="blist"><li>The Bank of England raises interest rates.</li><li>“Hot money” flows in to earn higher returns → demand for £ shifts right.</li><li>The exchange rate rises — the £ appreciates.</li></ul>`),
 EX('Converting currencies','£1 = $1.25. (a) A UK jacket costs £80. What is its price in $? (b) A US laptop costs $1,000. What is its price in £?',['(a) $ price = £80 × 1.25 = <b>$100</b>','(b) £ price = $1,000 ÷ 1.25 = <b>£800</b>'],'$100 and £800'),
 W('Currency market lab','fx','Change interest rates, exports, imports and speculation and see what happens to the exchange rate.'),
 N('€1 = ¥160. A Japanese camera costs ¥48,000. Calculate its price in euros (€).',300,'48,000 ÷ 160 = €300.',null,'€'),
 S('Exchange rate = price of one currency in another.','Demand for £: exports, inflows, higher interest rates, speculation.','Supply of £: imports, outflows.','Convert by multiplying or dividing by the rate.')],8);

LS('gl:6','2.2.3','⇵','A stronger or weaker currency changes import and export prices — and the current account. Remember SPICED.',[
 C('Definitions',[
  ['Appreciation','A rise in the value of a currency in a floating exchange rate system.'],
  ['Depreciation','A fall in the value of a currency in a floating system.'],
  ['Revaluation','A deliberate rise in the value of a currency in a FIXED system.'],
  ['Devaluation','A deliberate fall in the value of a currency in a fixed system.']]),
 FM('SPICED','Strong Pound → Imports Cheaper, Exports Dearer',[['Appreciation','imports cheaper, exports dearer → demand for imports ↑, exports ↓ → current account worsens'],['Depreciation (WPIDEC)','imports dearer, exports cheaper → demand for exports ↑, imports ↓ → current account improves']],'Works for any currency, not just the pound.'),
 EX('Appreciation in numbers','The £ rises from £1 = $1.20 to £1 = $1.50. A UK car exporter sells a car for £20,000. What happens to its US price?',['Before: £20,000 × 1.20 = <b>$24,000</b>','After: £20,000 × 1.50 = <b>$30,000</b>','The car is now $6,000 dearer in the USA → demand for UK car exports falls.'],'Export price rises from $24,000 to $30,000'),
 C('Impact of appreciation',[['Import prices','Fall — UK buyers get more foreign currency per £.'],['Export prices','Rise in foreign currencies.'],['Demand','Imports ↑, exports ↓ (if demand is price elastic).'],['Current account','Worsens (deficit grows).'],['Other','Lower inflation (cheaper imported goods and raw materials); exporters may cut jobs.']]),
 C('Impact of depreciation',[['Import prices','Rise — imported goods and raw materials cost more.'],['Export prices','Fall in foreign currencies.'],['Demand','Exports ↑, imports ↓.'],['Current account','Improves.'],['Other','Imported (cost-push) inflation; tourism into the country rises.']]),
 I('Evaluation: it depends on…',[
  `${B('PED for exports and imports')}: if demand is inelastic, quantities hardly change.`,
  `${B('Quality and brand')}: buyers of high-quality goods (e.g. luxury cars) may not switch.`,
  `${B('Imported components')}: a depreciation raises the cost of imported parts, offsetting the gain.`,
  `${B('Time')}: firms take time to find new suppliers or customers.`]),
 Q('The euro appreciates. What happens to the price of European exports in other countries?',['They rise','They fall','They stay the same','They become free of tariffs'],0,'SPICED — exports dearer.'),
 Q('A country’s currency depreciates. Its current account is most likely to…',['Improve','Worsen','Stay the same','Be eliminated'],0,'Exports cheaper, imports dearer.'),
 S('Appreciation/revaluation: currency up. Depreciation/devaluation: currency down.','SPICED: Strong → Imports Cheaper, Exports Dearer.','Depreciation: exports ↑, imports ↓, current account improves, but imported inflation.','Evaluate with PED, quality and imported components.')],8);

  ['AO1 (≈15%)','Knowledge: recall terms and concepts.'],

 C('The calculations you must be able to do',[
  ['Elasticities','PED, PES, YED — and rearranging to find a % change.'],
  ['Costs & revenue','TR, TC, TFC, TVC, AC, profit.'],
  ['Percentages','% change, inflation from CPI, growth rate, unemployment rate, interest on savings.'],

 I('Diagrams — the 3 marks',[

 Q('You are asked to calculate to two decimal places. Your calculator shows 1.5714. You write…',['1.57','1.6','1.5714','2'],0,'Two decimal places = 1.57.'),

LS('xs:2','Exam skills','➜','Explain and analyse questions reward chains of reasoning in context. Here is the structure that scores full marks.',[
 FM('Explain (3 marks)','Point (1) + development (1) + development (1) — in context',[['Point','identify the factor/effect'],['Development','“because…”, “this means that…”, “so…”'],['Context','use the firm, product or country in the question']],'One point, developed twice, beats three undeveloped points.'),
 EX('Model 3-mark answer','Explain one reason why a café owner might employ fewer workers after a rise in the minimum wage.',['The minimum wage <b>increases the café’s labour costs</b>. (1)','The owner’s profit margin on each coffee falls, so it is more expensive to employ each worker. (1)','To keep costs down the owner may cut staff hours or use self-service ordering screens instead, reducing employment. (1)'],'3/3'),
 FM('Analyse (6 marks)','Two points × (identify → chain of reasoning → context)',[['Levels','L1 1–2 · L2 3–4 · L3 5–6'],['L3 needs','clear knowledge, appropriate application, logical chains of reasoning']],'“Analyse two…” — do exactly two, both fully developed. No conclusion needed.'),
 VS('Build a chain of reasoning',chain(['Cause','→ immediate|effect','→ consequence','→ impact on the|firm / economy'],{steps:1}),`<ul class="blist"><li>Every link uses a connective: <b>so, therefore, which means, as a result</b>.</li><li>Stop when you reach the thing the question asked about.</li></ul>`),
 EX('Model 6-mark paragraph (one of two)','Analyse how a rise in interest rates could affect a car manufacturer.',['Higher interest rates make <b>car loans more expensive</b> for consumers…','…so monthly repayments rise and fewer households can afford to buy a new car on finance…','…therefore demand for the manufacturer’s cars falls, reducing its sales revenue and possibly leading to cuts in production and jobs.','(Paragraph 2 would analyse a second effect, e.g. the higher cost of the firm’s own borrowing for a new factory.)'],'Chain + context = Level 3'),
 Q('Which answer would score highest for “Explain one benefit of division of labour to a business (3)”?',['Workers specialise, so they become faster at their task, which increases output per worker and lowers average costs','Higher productivity, lower costs, more profit','Division of labour is when tasks are split up','It is good for the business because it is efficient'],0,'A point developed twice in a chain.'),
 S('Explain = point + 2 developments in context.','Analyse = two developed points with chains of reasoning.','Use connectives: so, therefore, which means.','Always apply to the case study.')],6);

LS('xs:3','Exam skills','⚖','Assess (9) and evaluate (12) questions decide the top grades. Balance, data and a real judgement are the keys.',[
 FM('Assess (9 marks)','Argument + counter-argument + judgement',[['AO2','3 marks — application'],['AO3','3 marks — analysis'],['AO4','3 marks — evaluation'],['Levels','L1 1–3 · L2 4–6 · L3 7–9']],'A one-sided answer can’t get out of Level 1 for evaluation.'),
 FM('Evaluate (12 marks)','2–3 arguments for + 2–3 against + supported conclusion',[['Levels','L1 1–4 · L2 5–8 · L3 9–12'],['L3 needs','specific knowledge, excellent use of the extract, logical chains, balanced argument, supported judgement']],'Plan for 2 minutes before writing.'),

 VS('A 12-mark plan on one screen',chain(['Define the|key term','For 1 + 2|(chains + data)','Against 1 + 2|(chains + data)','Judgement|+ it depends'],{steps:1}),`<ul class="blist"><li>About 14 minutes.</li><li>Use at least two figures from the extract.</li><li>The judgement must answer the actual question.</li></ul>`),

/* definition MCQs from the glossary */
function defQ(key,r){const own=GLOSSARY.filter(g=>g[0]===key);if(!own.length)return null;const g=r.pick(own);const top=key.split(':')[0];
  let pool=GLOSSARY.filter(x=>x!==g&&x[0].startsWith(top+':'));if(pool.length<3)pool=GLOSSARY.filter(x=>x!==g);
  const ds=r.shuffle(pool).filter(x=>x[2]!==g[2]&&x[1]!==g[1]).slice(0,3);
  if(r.chance(.5))return mcq(`Which is the correct definition of <b>${g[1].toLowerCase()}</b>?`,g[2],ds.map(x=>x[2]),`${g[1]}: ${g[2]}`);
  return mcq(`Which term means: “${g[2]}”`,g[1],ds.map(x=>x[1]),`${g[1]}: ${g[2]}`);}

const WRITTEN=[
{k:'ep:0',m:3,q:'Mia has $60 of birthday money. She decides to buy a video game. Explain one possible opportunity cost for Mia of this decision.',pts:['Identifies the next best alternative, e.g. football boots / a concert ticket (1)','Her money/income is limited (scarce) so she cannot buy both (1)','So the item she would otherwise have chosen is given up / forgone (1)'],model:'One opportunity cost is the football boots she was also thinking of buying. Because Mia only has $60, she cannot afford both the game and the boots. By choosing the game, she gives up the boots, which were her next best alternative.'},
{k:'ep:2',m:6,q:'A country has invested heavily in its education system and has discovered large natural gas reserves. Analyse two likely effects of these changes on the country’s production possibility curve.',pts:['Education raises human capital/skills of the labour force','More skilled workers are more productive → more output from the same resources','Gas discovery increases the quantity of land (natural resources)','Both increase productive potential → PPC shifts outwards = positive economic growth','Application: gas production and export industries can expand; long time lag for education'],model:'Investment in education improves the skills of the workforce, so each worker can produce more output per hour. Because productivity rises, the economy can produce more of all goods with the same number of workers, so its productive potential increases and the PPC shifts outwards. However, this effect takes years, as students must finish their education first.\n\nThe discovery of gas increases the quantity of land (natural resources) available. The country can now produce more energy and use it as an input in other industries, or export it to earn foreign currency to buy capital goods. This also increases productive potential, shifting the PPC outward — positive economic growth.'},
{k:'ep:3',m:3,q:'Hanan owns a shop and wants to maximise profits. Mostafa, the manager, wants to give customers a 10% discount for buying in large quantities. Explain one reason why Mostafa may want to offer this discount rather than maximise profit.',pts:['Mostafa may want to maximise sales / revenue / market share (1)','The discount makes bulk purchases cheaper so customers buy more (1)','Builds customer loyalty / his performance is judged on sales, even if profit per item falls (1)'],model:'Mostafa may aim to maximise sales rather than profit. A 10% discount for large purchases makes buying in bulk cheaper, so customers buy more items. This increases the shop’s sales and may build customer loyalty, even though the profit on each item is lower.'},
{k:'sd:0',m:6,q:'Analyse two factors that could increase the demand for electric bicycles in a city.',pts:['Rise in incomes → normal good → more consumers able to buy','Rise in the price of substitutes (petrol / car parking / bus fares) → switch to e-bikes','Fashion/tastes: environmental awareness, social media trends','Advertising campaigns by manufacturers','Demand curve shifts right → higher price and quantity'],model:'Higher incomes increase demand, because e-bikes are a normal good. With more disposable income, more consumers are able as well as willing to buy an e-bike, so the demand curve shifts to the right.\n\nA rise in the price of a substitute, such as petrol or parking charges, would also increase demand. Driving becomes more expensive relative to cycling, so commuters switch to e-bikes. This shifts demand to the right, raising both the equilibrium price and quantity of e-bikes sold in the city.'},
{k:'sd:2',m:3,q:'Using a supply and demand diagram, show the likely effects on the market for solar panels if the government removes an indirect tax on them. (Describe your diagram in words.)',pts:['Supply curve shifts to the right, labelled S1 (1)','Lower equilibrium price, labelled P1 (1)','Higher equilibrium quantity, labelled Q1 (1)'],model:'Removing the tax lowers producers’ costs, so the supply curve shifts right from S to S1. The new equilibrium is at a lower price P1 and a higher quantity Q1, shown with dotted lines to both axes.'},
{k:'sd:3',m:6,q:'A football club sets ticket prices below the market equilibrium for its cup final. Analyse two likely consequences.',pts:['Excess demand: Qd > Qs at the low price','Tickets sell out quickly; queues; fans disappointed / ballot needed','Resale (touting) at prices above face value','Club loses potential revenue it could have earned at equilibrium','Market forces would push the price up if allowed'],model:'Because the price is below equilibrium, quantity demanded is greater than the number of seats available, creating excess demand. Tickets sell out within minutes and many fans miss out, so the club may need a ballot or queue system.\n\nThe shortage also creates a secondary market: people who get tickets resell them at prices far above face value. The club loses revenue that it could have earned by charging the equilibrium price, while ticket touts gain instead.'},
{k:'el:0',m:3,q:'The price of a product rises by 10% and the quantity demanded falls by 4%. Explain whether demand for this product is price elastic or price inelastic.',pts:['PED = −4 ÷ 10 = −0.4 (1)','The value lies between 0 and −1 (1)','So demand is price inelastic — quantity changes proportionally less than price (1)'],model:'PED = −4% ÷ 10% = −0.4. As this is between 0 and −1, the percentage change in quantity demanded is smaller than the percentage change in price, so demand is price inelastic.'},
{k:'el:1',m:6,q:'Analyse two factors that make the demand for petrol price inelastic.',pts:['Few close substitutes for petrol in the short run','Necessity: needed for commuting, deliveries, work','Habit / long time to switch to electric vehicles','Chains: price rise → consumers still need to buy → quantity falls only slightly'],model:'Petrol has few close substitutes. Most cars can only use petrol, and switching to an electric car is expensive, so when the price rises drivers have little choice but to keep buying it. Quantity demanded falls only slightly.\n\nPetrol is also a necessity for many people who drive to work or run delivery businesses. Because they must travel regardless of the price, a price rise mainly increases what they spend rather than reducing how much they buy, so PED is between 0 and −1.'},
{k:'el:2',m:9,q:'With reference to textiles and cocoa, assess whether supply is likely to be more price elastic for textiles than for cocoa.',pts:['Textiles = manufactured: spare capacity, extra shifts, stocks → elastic','Cocoa = primary: trees take 3–5 years to mature, seasonal harvest → inelastic','Stocks of cocoa can be stored for a time → some elasticity','Textile factories may be at full capacity / need skilled workers → less elastic in the short run','Judgement: textiles generally more elastic, especially in the long run; depends on spare capacity and time period'],model:'Supply of textiles is likely to be more price elastic. Textile factories can add extra shifts, use spare machines and draw on stocks of cloth, so a rise in price can be met by a quick rise in output.\n\nCocoa supply is more inelastic. Cocoa trees take several years to produce beans, and harvests are seasonal, so farmers cannot respond quickly to a higher price.\n\nHowever, cocoa can be stored, so stocks give some flexibility, and textile factories already working at full capacity may not be able to raise output quickly.\n\nOverall, textiles are likely to have more elastic supply, especially in the long run, but this depends on how much spare capacity textile producers have.'},
{k:'el:4',m:9,q:'Assess whether a government should place an indirect tax on sugary drinks.',pts:['Tax shifts supply left → price up → consumption falls → health improves (external costs of obesity reduced)','Raises tax revenue to fund healthcare/education','Demand may be price inelastic (habit) → consumption falls little','Regressive: low-income households pay a larger share of income','Consumers switch to untaxed sugary foods','Judgement: depends on PED, size of the tax, use of revenue, availability of substitutes'],model:'A tax would shift the supply of sugary drinks to the left, raising the price. Quantity demanded would contract, reducing sugar consumption and the external costs of obesity, such as healthcare spending. The government would also gain revenue that could fund health education.\n\nHowever, demand may be price inelastic because many consumers buy out of habit, so consumption might fall only slightly. The tax is also regressive, taking a larger share of income from poorer households.\n\nOn balance, the tax is worthwhile if it is large enough and the revenue is used to promote healthy alternatives, but on its own its effect depends on how price elastic demand is.'},
{k:'mx:1',m:3,q:'Explain why street lighting would not be provided by the private sector.',pts:['Street lighting is a public good: non-excludable (1)','People can benefit without paying — free rider problem (1)','So private firms cannot charge / make a profit, so they will not provide it (1)'],model:'Street lighting is non-excludable: once it is switched on, anyone walking down the street benefits, whether or not they paid. This creates a free rider problem, so a private firm could not collect payment and would make no profit. Therefore the private sector will not provide it.'},
{k:'mx:2',m:12,q:'The Nigerian Government has handed control of Lagos Airport to a private company. Evaluate the likely impact on consumers of privatising the airport.',pts:['Profit motive → efficiency, better facilities, shorter queues','Private investment → expansion, more routes and choice','Local monopoly → higher landing fees and parking prices passed to passengers','Cost cutting → fewer staff, lower service or safety','Depends on regulation (price caps), competition from other airports, management experience, level of investment','Supported conclusion'],model:'Privatisation could benefit consumers because the new owners aim to make a profit. To attract more airlines and passengers, they have an incentive to improve efficiency — for example faster security checks and better facilities — which raises the quality of service.\n\nPrivate owners may also invest in expanding terminals, as Lagos is the busiest airport in Nigeria. More capacity could lead to more routes and more choice for travellers.\n\nHowever, the airport is effectively a local monopoly. The owners could raise landing fees, which airlines pass on through higher ticket prices, and raise parking and shop prices.\n\nCost cutting could also mean fewer staff, leading to longer queues or lower safety standards.\n\nOverall, the impact on consumers depends on regulation. If the government sets price caps and service standards, consumers are likely to gain from greater efficiency and investment; without it, monopoly pricing could make them worse off.'},
{k:'mx:3',m:3,q:'A factory produces chemicals next to a river. Explain one external cost of its production.',pts:['Water pollution from waste chemicals (1)','Harms third parties, e.g. fishermen / people using the water / wildlife (1)','These costs are not paid by the factory → social cost > private cost (1)'],model:'The factory may release waste chemicals into the river, causing water pollution. This harms third parties such as local fishermen, whose catch falls, and residents who use the river. The factory does not pay for this damage, so the social cost of production is higher than its private cost.'},
{k:'pc:2',m:3,q:'A car factory has divided production into 200 separate tasks. Explain one disadvantage of the division of labour to its workers.',pts:['Repetitive / boring work (1)','Low motivation and job satisfaction (1)','Narrow skills → hard to find another job if the factory closes (occupational immobility) (1)'],model:'Workers repeat the same small task all day, such as fitting one part, so the work becomes boring. This lowers their motivation and job satisfaction. Because their skills are so narrow, they may find it hard to get another job if the factory closes.'},
{k:'pc:3',m:6,q:'A café’s profits have fallen. Analyse two ways the café could increase its profit.',pts:['Increase revenue: raise prices if demand is inelastic; increase sales via promotion','Reduce costs: cheaper suppliers, bulk buying, cut waste, fewer staff hours','Profit = TR − TC chain','Context: coffee, location, loyal customers'],model:'The café could increase its total revenue. If demand for its coffee is price inelastic because loyal customers like its location, a small price rise would increase revenue more than it reduces sales, and since profit = TR − TC, profit rises.\n\nIt could also reduce its costs, for example by buying coffee beans and milk in bulk from a cheaper supplier. Lower variable costs per cup mean each sale adds more to profit, so with the same revenue the café earns more profit.'},
{k:'pc:4',m:6,q:'A supermarket chain plans to double the number of its stores. Analyse two economies of scale it might gain.',pts:['Purchasing: bulk buying discounts from suppliers → lower AC','Marketing: advertising cost spread over more sales','Financial: cheaper loans for a larger firm','Technical: better distribution centres and technology','Managerial: specialist managers','Lower AC → lower prices / higher profit margins'],model:'The chain could gain purchasing economies of scale. Buying food in much larger quantities for twice as many stores lets it negotiate bulk discounts with suppliers, so the cost of each item falls and average costs fall.\n\nIt could also gain marketing economies. A national TV advert costs the same whether it promotes 300 or 600 stores, so the advertising cost per item sold falls. Lower average costs allow the chain either to cut prices to win customers or to increase its profit margins.'},
{k:'cl:1',m:6,q:'Anastasia runs a martial arts club in Budapest and is considering opening a second club in another district. Analyse two possible factors influencing her decision.',pts:['Access to finance: cost of new premises/equipment; profits from successful years or bank loan','Size of the market / demand in the new district; competition from rival clubs','Desire to spread risk / economies of scale','Aims of the entrepreneur: control, workload'],model:'Access to finance will affect her decision. Opening a second club means paying for new premises, mats and instructors. If her “successful few years” have produced retained profit, or a bank will lend to her, she can afford these start-up costs; without finance she would have to stay small.\n\nThe size of the market in the other district also matters. If many children and adults there want martial arts classes and there are few rival clubs, the new club could attract enough members to cover its costs. If the market is small or competitive, the second club could make a loss.'},
{k:'cl:2',m:9,q:'Assess the impact on consumers of a monopoly in the supply of mobile phone networks.',pts:['Price-maker → higher prices, restricted output','Less choice and little incentive to improve quality/service','Economies of scale → lower average costs could mean lower prices','High profits fund investment in 5G / innovation','Depends on regulation, contestability, whether profits are reinvested'],model:'A monopoly network is a price-maker, so it can charge higher prices than in a competitive market and consumers have no alternative. With no rivals, it may also have little incentive to improve coverage or customer service.\n\nHowever, building a mobile network has very high fixed costs, so a single large firm can benefit from economies of scale, giving lower average costs than several small networks. High profits could also fund investment in faster 5G technology.\n\nOverall, consumers are likely to lose from higher prices unless the government regulates the monopoly with price caps and service standards, in which case they may benefit from its economies of scale.'},
{k:'cl:5',m:6,q:'Analyse two ways in which a trade union might increase the wages of its members.',pts:['Collective bargaining: negotiates as one group with more bargaining power','Industrial action / threat of strikes raises cost to the employer of refusing','Restricting labour supply (training/qualification requirements) → wage up','Productivity agreements: higher wages in return for higher output'],model:'A trade union negotiates through collective bargaining. Because it represents all the workers together, it has more bargaining power than any individual, so the employer is more likely to agree to a pay rise to avoid disruption.\n\nThe union can also threaten industrial action such as a strike. A strike would stop production and cost the firm revenue and customers, so the employer may decide that a higher wage is cheaper than the loss from a strike.'},
{k:'gi:0',m:9,q:'A ban on single-use plastic bags has been in place in Kenya for more than five years. It has led to a cleaner environment, but has not removed the problem completely. Assess the effectiveness of government regulation when dealing with externalities such as pollution.',pts:['Regulation directly removes the source of the external cost; cleaner streets, livestock safer','Simple, clear, does not depend on price elasticity','Needs enforcement; smuggling/illegal bags — “not totally effective”','Costly to monitor; no revenue (unlike a tax)','Depends on enforcement, penalties, availability of alternatives; combine with fines/taxes'],model:'Regulation can be very effective because it removes the source of the external cost directly. In Kenya, banning plastic bags has made the environment cleaner and reduced the number of livestock dying from eating bags.\n\nUnlike a tax, it does not rely on how price elastic demand is: the harmful product is simply not allowed.\n\nHowever, regulation only works if it is enforced. The extract says the ban has not totally removed the problem, suggesting bags are still being smuggled or used illegally. Monitoring is costly, and regulation raises no revenue to pay for clean-up.\n\nOverall, regulation is effective at reducing pollution if enforcement and fines are strong and cheap alternatives such as cloth bags are available.'},
{k:'gi:2',m:12,q:'Evaluate the likely impact of a large increase in the national minimum wage on an economy.',pts:['Higher incomes for the low paid → less poverty, more spending, possibly more jobs via demand','Incentive to work; less in-work benefit spending','Higher labour costs → firms cut jobs or replace workers with machines (excess supply of labour)','Cost-push inflation; exporters less competitive','Depends on size of increase relative to equilibrium wage, PED for labour, state of the economy, productivity'],model:'A higher minimum wage raises the incomes of the lowest-paid workers, reducing poverty and inequality. These workers tend to spend most of their extra income, which increases demand for goods and services and may help firms grow.\n\nIt can also improve incentives to work and reduce the need for in-work benefits, saving government money.\n\nHowever, if the minimum wage is set well above the equilibrium wage, firms face higher labour costs and demand fewer workers, causing unemployment among low-skilled workers. Firms may also replace workers with self-service machines.\n\nHigher costs could be passed on as higher prices, causing cost-push inflation and making exports less competitive.\n\nOverall, the impact depends on how large the increase is. A moderate rise in a growing economy may raise living standards with few job losses, but a large rise during a recession is likely to increase unemployment.'},
{k:'mo:0',m:9,q:'Assess whether GDP is a good measure of living standards.',pts:['GDP measures total output; higher real GDP per capita → more goods and services per person','Limitations: inflation (use real), population (use per capita), hidden economy, inequality, non-market activity, quality of life (pollution, hours worked, health)','Judgement: useful starting point but should be combined with other indicators'],model:'Real GDP per capita shows the average quantity of goods and services produced per person, so a rise usually means people can consume more and enjoy higher material living standards.\n\nHowever, GDP is an average that hides inequality — if growth goes to the richest, most people may be no better off. It also ignores the hidden economy and unpaid work such as caring, and does not measure pollution, working hours or health.\n\nOverall, GDP per capita is a useful indicator of material living standards, but it should be combined with measures of health, education and inequality to judge quality of life.'},
{k:'mo:3',m:6,q:'Analyse two impacts of high inflation on businesses.',pts:['Menu costs: changing prices, lists, websites','Uncertainty: harder to plan, lower business confidence → less investment','Rising costs (wages, materials) reduce profit margins','Less competitive exports → lower foreign sales'],model:'High inflation creates uncertainty for businesses because they cannot predict future costs and prices. This lowers business confidence, so firms may postpone investment in new machinery, reducing future growth and productivity.\n\nInflation also reduces the international competitiveness of exporters. If domestic prices rise faster than those in other countries, foreign buyers switch to cheaper substitutes, so export sales and revenue fall.'},
{k:'mo:5',m:6,q:'Analyse two possible effects of rising unemployment on the government.',pts:['Higher spending on unemployment benefits → opportunity cost','Lower income tax and VAT revenue','Larger fiscal deficit → more borrowing','Social costs → spending on health/crime'],model:'Rising unemployment increases government spending on benefits, as more people claim unemployment support. This has an opportunity cost: money spent on benefits cannot be spent on schools or hospitals.\n\nAt the same time, tax revenue falls. Unemployed people pay no income tax and spend less, so VAT revenue also falls. With spending up and revenue down, the fiscal deficit widens and the government may have to borrow more.'},
{k:'mo:6',m:9,q:'Assess the likely impact of a large current account deficit on an economy.',pts:['Leakage of money from the circular flow → lower demand for domestic output → jobs','Sign of uncompetitive exports','Must be financed by borrowing / foreign reserves','May reflect strong consumer demand and imports of capital goods (investment) → not always bad','Depends on size, how long it lasts, what is imported, how it is financed'],model:'A large current account deficit means more money flows out to pay for imports than comes in from exports. This is a leakage from the economy: demand goes to foreign firms instead of domestic firms, which can reduce output and jobs at home.\n\nThe deficit must also be financed, either by borrowing from abroad or by running down foreign currency reserves, which cannot continue for ever.\n\nHowever, a deficit is not always harmful. If the country is importing capital goods such as machinery, this investment can raise productivity and future exports.\n\nOverall, a deficit is a concern if it is large and long-lasting and funded by borrowing for consumption, but less worrying if it is temporary and caused by investment.'},
{k:'po:0',m:12,q:'Evaluate the use of expansionary fiscal policy to reduce unemployment.',pts:['Higher government spending (infrastructure) directly creates jobs; multiplier effect','Tax cuts raise disposable income → consumer spending → firms hire','Fiscal deficit rises → borrowing, debt interest, future tax rises','Demand-pull inflation if near full capacity; imports rise → current account worsens','Time lags; doesn’t fix structural unemployment','Depends on spare capacity, type of unemployment, how money is spent'],model:'Expansionary fiscal policy means increasing government spending or cutting taxes. Spending on infrastructure such as roads directly creates construction jobs, and those workers spend their wages, creating further demand and jobs elsewhere.\n\nCutting income tax raises disposable income, so households spend more; firms respond to higher sales by hiring more workers, reducing cyclical unemployment.\n\nHowever, the policy increases the fiscal deficit, so the government must borrow and pay interest, which may require higher taxes later.\n\nIf the economy is close to full capacity, the extra demand may mainly cause demand-pull inflation, and some of the extra spending leaks out on imports.\n\nIt also does little for structural unemployment, where workers lack the right skills.\n\nOverall, expansionary fiscal policy is effective at reducing cyclical unemployment in a recession with spare capacity, but should be combined with supply-side policies such as training to tackle structural unemployment.'},
{k:'po:1',m:9,q:'Assess the effectiveness of raising interest rates to reduce inflation.',pts:['Borrowing dearer → consumer spending and investment fall → demand-pull pressure eases','Saving more attractive','Currency appreciates → imports cheaper → lower inflation','Ineffective against cost-push inflation (e.g. oil prices)','Time lags of 18–24 months; harms growth and jobs','Depends on cause of inflation, size of rise, confidence, how many people have variable-rate debt'],model:'Higher interest rates make borrowing more expensive, so households spend less on items bought on credit and firms postpone investment. Lower demand reduces demand-pull inflation. Saving also becomes more attractive.\n\nHigher rates may attract foreign savings, causing the currency to appreciate, which makes imports cheaper and reduces inflation further.\n\nHowever, if inflation is cost-push, caused by rising global energy prices, higher interest rates do little to fix the cause and mainly reduce growth and increase unemployment. The effects also take a long time to work.\n\nOverall, raising interest rates is effective against demand-pull inflation, but much less effective when inflation is caused by rising costs.'},
{k:'po:2',m:12,q:'Evaluate the use of supply-side policies to achieve the government’s macroeconomic objectives.',pts:['Education/training → productivity → growth and lower structural unemployment','Infrastructure → lower business costs → competitiveness → exports','Lower taxes → incentives to work and invest','Increase capacity → growth without inflation','Long time lags; costly (opportunity cost / deficit); tax cuts may increase inequality; deregulation may harm environment','Depends on the policy chosen, time frame, funding'],model:'Supply-side policies aim to increase the productive capacity of the economy. Spending on education and training raises workers’ skills and productivity, which increases output and reduces structural unemployment because workers can move into growing industries.\n\nInfrastructure spending lowers firms’ transport and energy costs, making exports more competitive and helping the current account.\n\nBecause they increase capacity, these policies allow growth without causing inflation — they can help several objectives at once.\n\nHowever, they take many years to work, which does not help in a sudden recession, and they are expensive, increasing the fiscal deficit. Tax cuts for high earners may increase inequality, and deregulation could harm the environment.\n\nOverall, supply-side policies are the best long-term way to achieve several objectives together, but they need to be combined with fiscal or monetary policy for short-term problems.'},
{k:'po:4',m:12,q:'Evaluate whether a government can achieve both high economic growth and protection of the environment.',pts:['Conflict: more output → more pollution, resource depletion, waste','Growth raises demand for energy, transport','Green growth: renewable energy, technology, recycling — growth with lower emissions','Policies: carbon taxes, subsidies for green tech, regulation','Depends on technology, international cooperation, stage of development, enforcement'],model:'Economic growth usually means producing more goods and services, which uses more energy and raw materials and creates more pollution and waste, so there is a trade-off.\n\nFaster growth also increases demand for transport and air travel, raising emissions further.\n\nHowever, growth can be made greener. Investment in renewable energy and electric vehicles allows output to grow while emissions fall, and green industries create jobs and exports.\n\nGovernments can use carbon taxes, subsidies for clean technology and regulation to encourage sustainable growth.\n\nOverall, both objectives can be achieved in the long run if the government invests in green technology and enforces environmental rules, but in the short run there is usually some trade-off.'},
{k:'gl:1',m:9,q:'Assess the benefits to a developing country of foreign direct investment by a multinational car manufacturer.',pts:['Jobs in factory and suppliers → incomes → poverty falls','Skills and technology transfer → productivity','Infrastructure built; tax revenue','Profits sent abroad; tax avoidance; tax breaks to attract MNC','Environmental damage; low wages; risk MNC leaves','Depends on local skills, regulation, taxes paid'],model:'FDI by a car manufacturer creates jobs, both in the factory and in local firms that supply parts. Workers earn wages, so incomes rise and poverty falls.\n\nThe MNC may also train workers and bring new technology, raising productivity, and may build infrastructure such as roads and power supplies.\n\nHowever, profits may be sent back to the MNC’s home country, and the government may have offered tax breaks to attract the investment, so it gains little tax revenue.\n\nOverall, FDI is beneficial if local workers gain skills and the MNC pays fair taxes; otherwise much of the benefit flows abroad.'},
{k:'gl:3',m:12,q:'Evaluate the likely effects of a government placing a tariff on imported steel.',pts:['Protects domestic steel jobs and output; infant industry argument','Tariff revenue for government; current account improves','Higher steel prices raise costs for car makers, construction → less competitive exports','Retaliation against the country’s exports','Inefficient domestic firms protected from competition','Depends on size of tariff, PED for steel, retaliation, length of time'],model:'A tariff raises the price of imported steel, so domestic producers become more competitive. They sell more, which protects jobs in steel-making areas, and the government gains tariff revenue. Imports fall, improving the current account.\n\nHowever, steel is an input for car makers and construction firms. Higher steel prices raise their costs, making their products dearer and less competitive abroad, which could cost jobs elsewhere.\n\nOther countries may retaliate with tariffs on this country’s exports, and protected domestic steel firms have less incentive to become efficient.\n\nOverall, a temporary tariff may help to protect jobs, but in the long run it is likely to raise costs and invite retaliation, so its success depends on its size and duration.'},
{k:'gl:6',m:9,q:'Assess the likely impact of a depreciation of a country’s currency on its economy.',pts:['Exports cheaper abroad → demand for exports rises → output and jobs','Imports dearer → switch to domestic goods → current account improves','Imported inflation (cost-push) from dearer raw materials and fuel','Depends on PED for exports and imports, imported components, quality, time lags'],model:'A depreciation makes the country’s exports cheaper in foreign currencies, so demand for them rises, increasing output and jobs in export industries. Imports become dearer, so consumers switch to domestic goods, and the current account should improve.\n\nHowever, imported raw materials and fuel become more expensive, raising firms’ costs and causing cost-push inflation, which reduces real incomes.\n\nOverall, a depreciation helps exporters if demand for exports is price elastic, but if the country relies on imported components the rise in costs may cancel out much of the benefit.'},{k:'sd:1',m:3,q:'Explain one reason why the supply of cocoa beans might decrease.',pts:['Identifies a factor, e.g. bad weather / disease / higher costs (1)','Fewer beans can be harvested / higher cost of production (1)','So less is supplied at every price — supply shifts left (1)'],model:'Heavy rain and crop disease in West Africa can destroy cocoa trees. Farmers can harvest fewer beans, so less cocoa is available at every price, meaning supply decreases and the supply curve shifts left.'},
{k:'el:3',m:6,q:'Analyse how a recession might affect the demand for luxury holidays and for supermarket value-range food.',pts:['Recession → incomes fall','Luxury holidays have YED > 1 → demand falls more than proportionally','Firms selling holidays see revenue fall, may cut prices/jobs','Value-range food is an inferior good (negative YED) → demand rises as incomes fall','Supermarkets may increase stock of value ranges'],model:'In a recession, incomes fall. Luxury holidays have a high positive YED (above +1), so demand falls by a larger percentage than income. Travel firms see revenue fall sharply and may cut prices or jobs.\n\nValue-range food is an inferior good with a negative YED. As incomes fall, households switch from branded goods to cheaper value ranges, so demand for them rises, and supermarkets may expand these ranges.'},
{k:'mx:0',m:6,q:'Analyse two differences between the public sector and the private sector.',pts:['Ownership: government v individuals/shareholders','Control: ministers/public bodies v owners/managers','Aims: services for all/welfare v profit','Funding: taxation v revenue from sales','Examples applied'],model:'The public sector is owned and controlled by the government, for example state schools and hospitals, whereas the private sector is owned by individuals and shareholders, such as supermarkets. This means public sector decisions are made by ministers on behalf of citizens.\n\nTheir aims also differ. Private firms aim to make a profit, so they produce what consumers will pay for. The public sector aims to provide essential services for everyone, often free at the point of use and funded by taxation, even if they are not profitable.'},
{k:'pc:0',m:6,q:'Analyse why the tertiary sector has grown in developed economies.',pts:['Rising incomes → demand for services (high YED): tourism, leisure, finance','Technology/automation reduced labour needed in primary and secondary','Manufacturing moved to lower-cost countries (deindustrialisation)','Education → skilled workforce for services'],model:'As incomes in developed economies have risen, consumers spend a larger share on services such as tourism, restaurants and financial services, which have a high income elasticity of demand. Firms in these industries expand and employ more workers.\n\nAt the same time, manufacturing has moved to countries with lower labour costs, and automation means fewer workers are needed in farming and factories. So employment and output shift from the primary and secondary sectors to the tertiary sector.'},
{k:'pc:1',m:6,q:'Analyse two ways a business could increase the productivity of its workers.',pts:['Training → human capital → more output per hour','Investment in capital/technology → each worker produces more','Motivation/incentives (bonuses) → more effort','Lower average cost / competitiveness'],model:'The business could train its workers. Training improves their skills (human capital), so they work faster and make fewer mistakes, increasing output per worker per hour and lowering average costs.\n\nIt could also invest in new machinery and technology. With better equipment, each worker can produce more in the same time, so labour productivity rises and the firm becomes more competitive.'},
{k:'pc:5',m:3,q:'Explain one cause of diseconomies of scale for a large multinational company.',pts:['Identifies a cause: bureaucracy / communication / lack of control / distance (1)','Explains why it happens in a large firm (1)','Links to rising average costs (1)'],model:'A large multinational has many layers of management, so communication problems arise as messages pass through many people and countries. Decisions are slow and mistakes are made, so resources are wasted and average costs rise.'},
{k:'cl:0',m:9,q:'Assess the benefits of increased competition in the market for food delivery apps.',pts:['Lower prices/fees for consumers','More choice and better service quality','Innovation (faster delivery, features)','Lower profits → firms exit; less investment','Workers (riders) may face lower pay','Judgement: depends on number of firms, regulation, whether firms survive'],model:'More competition pushes delivery apps to cut fees and offer discounts, so consumers pay less. Firms also compete on quality and innovation, offering faster delivery and more restaurants, which increases choice.\n\nHowever, price competition squeezes profits; some apps may leave the market, reducing competition later. Firms may also cut riders’ pay to stay competitive.\n\nOverall, consumers benefit in the short run, but the long-run benefit depends on whether enough firms survive to keep the market competitive.'},
{k:'cl:3',m:6,q:'Analyse two features of an oligopoly, using the supermarket industry as an example.',pts:['Few large firms dominate (high concentration ratio)','Barriers to entry: huge buying power, store networks, marketing budgets','Non-price competition: loyalty cards, adverts, quality ranges','Interdependence / price matching; risk of collusion'],model:'An oligopoly is dominated by a few large firms. In the supermarket industry, the four largest chains have most of the market, so they have significant market power and high barriers to entry, such as national store networks and huge marketing budgets.\n\nOligopolies often use non-price competition. Supermarkets compete through loyalty cards, advertising and premium own-brand ranges rather than constant price cuts, because a price war would reduce all their profits.'},
{k:'cl:4',m:6,q:'Analyse two factors that could increase the supply of labour in a country.',pts:['Immigration increases working-age population','Higher retirement age keeps workers in the labour force','Higher female participation (childcare, flexible work)','Lower school-leaving age','Effect: more workers available → wage pressure eases'],model:'Immigration increases the supply of labour because more people of working age arrive looking for jobs. This can fill skill shortages in industries such as healthcare and construction.\n\nRaising the retirement age also increases supply, as older workers stay in employment for longer instead of leaving the labour force. With more workers available, firms can expand more easily and wage pressure may ease.'},
{k:'gi:1',m:9,q:'Assess whether governments should block a merger between the two largest mobile phone networks.',pts:['Merger → reduced competition → higher prices, less choice','Less incentive to innovate/improve service','But economies of scale → lower costs, more investment in 5G','Conditions (selling assets, price caps) as alternative','Judgement: depends on market share after merger, regulation, efficiency gains passed on'],model:'Blocking the merger would protect competition. With only one dominant network, prices could rise and consumers would have less choice, and the firm would have less incentive to improve coverage or service.\n\nHowever, the merged firm could gain economies of scale, lowering average costs and funding investment in faster 5G networks.\n\nOverall, the government should block the merger unless the firms accept conditions such as price caps or selling part of their network, because the risk of higher prices is likely to outweigh the efficiency gains.'},
{k:'mo:1',m:6,q:'Analyse the likely effects of a recession on unemployment and inflation.',pts:['Falling demand → firms cut output → cyclical unemployment rises','Lower confidence → less spending → further job losses','Lower demand → firms cut prices / smaller price rises → inflation falls','Possible deflation'],model:'In a recession, real GDP falls because consumers and firms spend less. Firms need fewer workers to produce lower output, so they cut jobs and cyclical unemployment rises; falling confidence makes this worse.\n\nWith demand falling, firms find it harder to raise prices and may offer discounts to sell stock. Demand-pull pressure disappears, so inflation falls and the economy may even experience deflation.'},
{k:'mo:2',m:3,q:'Explain how the consumer price index (CPI) is used to measure inflation.',pts:['A basket of goods and services bought by typical households is priced regularly (1)','Each item is weighted by its share of spending; base year = 100 (1)','Inflation = % change in the index over 12 months (1)'],model:'Statisticians record the prices of a basket of goods and services that typical households buy. Each item is weighted according to how much households spend on it, and the total is compared with a base year of 100. The inflation rate is the percentage change in this index over 12 months.'},
{k:'mo:4',m:6,q:'Analyse two types of unemployment that might exist in a coastal tourist town.',pts:['Seasonal: hotels, restaurants close in winter → workers laid off','Structural: decline of traditional industry (e.g. fishing) → wrong skills','Frictional: workers between jobs','Cyclical: recession reduces holidays'],model:'Seasonal unemployment is likely, because demand for hotels and restaurants falls in winter when tourists stop visiting. Businesses close or cut staff until summer, so many workers are unemployed for part of the year.\n\nStructural unemployment may also exist if a traditional industry, such as fishing, has declined. Former fishermen may lack the skills needed for jobs in tourism or services, so they remain unemployed for a long time.'},
{k:'mo:7',m:9,q:'Assess the effectiveness of pollution permits in protecting the environment.',pts:['Cap limits total pollution','Tradable → firms that cut pollution can sell permits → incentive to go green','Market-based, efficient','Hard to set the right cap; too many permits issued → low price, little effect','Monitoring costs; firms may relocate','Judgement: depends on cap level and enforcement'],model:'Pollution permits set a cap on total pollution, so the government controls the maximum amount of emissions. Because permits can be traded, firms that cut pollution can sell spare permits, giving them a financial incentive to invest in cleaner technology.\n\nHowever, if the government issues too many permits, their price falls and firms have little reason to cut pollution. Monitoring emissions is also costly.\n\nOverall, permits are effective if the cap is set low enough and gradually reduced, with strict monitoring.'},
{k:'mo:8',m:12,q:'Evaluate the use of progressive taxation to reduce income inequality.',pts:['Higher earners pay higher % → narrows post-tax income gap','Revenue funds benefits, education, healthcare for poorer households','Disincentive to work/invest for high earners; brain drain','Tax avoidance/evasion','Doesn’t help those with no income unless combined with benefits','Depends on rates, enforcement, how revenue is spent'],model:'Progressive taxation takes a larger percentage of income from high earners, which directly narrows the gap between post-tax incomes. The extra revenue can be spent on benefits, free education and healthcare, which raise the living standards of poorer households.\n\nHowever, very high tax rates may reduce the incentive for high earners to work longer, invest or start businesses, and some skilled workers may emigrate. Wealthy individuals may also avoid tax through legal loopholes.\n\nOverall, progressive taxation is effective when rates are moderate, enforcement is strong and revenue is spent on education and benefits; on its own it cannot remove inequality.'},
{k:'po:3',m:6,q:'Analyse one advantage and one disadvantage of using regulation to reduce air pollution from factories.',pts:['Advantage: clear legal limits → directly cuts emissions; certainty','Disadvantage: costly to monitor/enforce; firms may break rules','Disadvantage: raises firms’ costs → higher prices / less competitive','No revenue raised'],model:'An advantage of regulation is that it sets clear legal limits on emissions. Factories must install filters or cleaner technology, so air pollution falls directly and predictably.\n\nA disadvantage is that regulation is costly to monitor and enforce. Inspectors are needed to check every factory, and if penalties are weak some firms may ignore the rules, so pollution continues.'},
{k:'gl:0',m:9,q:'Assess the impact of globalisation on workers in a developed country.',pts:['New jobs in export industries, services, MNCs','Lower prices raise real incomes','Manufacturing jobs move abroad → structural unemployment','Downward pressure on wages for low-skilled','Depends on skills, retraining, sector'],model:'Globalisation creates jobs in export industries and in multinational companies that invest in the country, and cheaper imported goods raise workers’ real incomes.\n\nHowever, manufacturing jobs may move to countries with lower wages, causing structural unemployment for workers whose skills are no longer needed, and competition can hold down wages for low-skilled workers.\n\nOverall, skilled workers are likely to gain while low-skilled workers in manufacturing may lose, so the impact depends on how well workers can retrain.'},
{k:'gl:2',m:6,q:'Analyse two advantages of free trade for a country’s businesses.',pts:['Wider markets → more sales → economies of scale','Cheaper imported inputs/raw materials → lower costs','Competition drives efficiency and innovation'],model:'Free trade gives businesses access to wider markets. A firm can sell to customers in many countries, increasing sales and allowing it to benefit from economies of scale, which lower average costs.\n\nBusinesses can also buy cheaper raw materials and components from abroad without tariffs. Lower input costs reduce production costs, so firms can cut prices or increase profit margins.'},
{k:'gl:4',m:9,q:'Assess the impact of joining a trading bloc on a country’s economy.',pts:['Free access to members’ markets → exports, growth, jobs','Cheaper imports from members','More FDI from firms wanting access to the bloc','Loss of independent trade policy; common external tariff','Domestic firms face more competition','Trade diversion away from cheaper non-members','Depends on competitiveness of domestic firms, size of bloc'],model:'Joining a trading bloc gives domestic firms tariff-free access to members’ markets, so exports, output and jobs can rise. Consumers benefit from cheaper imports, and foreign firms may invest in the country to gain access to the whole bloc.\n\nHowever, uncompetitive domestic firms face more competition and may close, and the country loses control over its trade policy. Trade may also be diverted away from cheaper non-member suppliers.\n\nOverall, joining is likely to benefit the economy if its firms are competitive, but some industries will lose out.'},
{k:'gl:5',m:6,q:'Analyse two factors that could cause a country’s currency to appreciate.',pts:['Higher interest rates → hot money inflows → demand for currency rises','Rise in exports → foreigners buy currency','Speculation expecting a rise','Fall in imports → supply of currency falls'],model:'If the central bank raises interest rates, saving in the country becomes more attractive to foreign investors. They buy the currency to deposit money in its banks, so demand for the currency rises and it appreciates.\n\nAn increase in demand for the country’s exports also causes appreciation. Foreign buyers need the domestic currency to pay for the goods, so demand for it rises and its value increases.'}];
