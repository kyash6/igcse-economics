WRITTEN.push(
{k:'pc:4',m:3,q:'Explain one advantage to a firm of achieving economies of scale.',pts:['Identify a type, e.g. bulk-buying (purchasing) / technical / financial economies','Development: lower average (unit) costs as output increases','Linked consequence: higher profit margins or lower prices / more competitive'],acc:['any valid type with explanation'],rej:['“the firm gets bigger” with no reference to average costs'],tip:'Economies of scale are about AVERAGE cost per unit falling — say it explicitly to secure the development mark.',model:'A large supermarket chain can gain purchasing economies of scale by buying stock in bulk at a discount. This lowers its average cost per unit as output increases, so it can either cut prices to win customers from rivals or keep prices the same and earn a higher profit margin.'},
{k:'el:2',m:6,q:'Analyse why the demand for petrol is likely to be price inelastic.',pts:['PED < 1 / % change in quantity demanded smaller than % change in price','Few close substitutes for drivers (electric cars expensive / limited)','Necessity — needed to get to work / for business','Habit / addiction-type consumption; short time period to adjust','Consequence: a price rise causes only a small fall in quantity demanded, so revenue rises'],acc:['diagram of a steep demand curve'],rej:['“people need petrol” with no chain of reasoning'],tip:'Analyse = point + two developments. Use the term PED and say what it means numerically (between 0 and −1).',model:'Demand for petrol is price inelastic, meaning the percentage change in quantity demanded is smaller than the percentage change in price, so PED lies between 0 and −1. Most drivers have few close substitutes: switching to an electric car is expensive and public transport may not reach their workplace, so they keep buying petrol even when its price rises. Petrol is also a necessity for many people to get to work and for firms to deliver goods, so consumption only falls slightly. As a result, when the price rises, quantity demanded falls by a smaller proportion, and total spending on petrol increases — which is why governments find it an effective good to tax.'},
{k:'po:1',m:9,q:'Assess the effectiveness of an increase in interest rates in reducing inflation.',pts:['Higher interest rates raise the cost of borrowing → less consumer spending on credit / mortgages cost more','Higher incentive to save → lower consumption','Firms invest less → lower aggregate demand','Exchange rate may rise → cheaper imports reduce cost-push inflation','Evaluation: time lags (12–18 months)','Evaluation: ineffective if inflation is cost-push (e.g. oil prices) rather than demand-pull','Evaluation: side-effects — lower growth, higher unemployment, hurts borrowers/firms','Judgement: effectiveness depends on the cause of inflation and the size of the rise'],acc:['diagram showing AD shifting left'],rej:['one-sided answer with no evaluation (max level 2)'],tip:'9-mark “assess” answers need balance AND a judgement that says what it depends on.',model:'Higher interest rates increase the cost of borrowing, so households spend less on credit and mortgage payments rise, leaving less disposable income. Saving becomes more attractive, so consumption falls further, and firms postpone investment because loans are dearer. Lower consumption and investment reduce aggregate demand, which reduces demand-pull inflation. A rise in rates may also strengthen the exchange rate, making imports cheaper.\n\nHowever, there are time lags of up to 18 months before the full effect is felt. If inflation is cost-push — for example caused by higher oil prices — reducing demand does little to lower costs and mainly slows growth and raises unemployment. Highly indebted households and firms may also be badly hurt.\n\nOverall, raising interest rates is effective against demand-pull inflation if the rise is large enough, but it is a slow and costly tool when inflation is caused by rising costs.'},
{k:'gl:2',m:6,q:'Analyse the benefits to a country of specialisation and international trade.',pts:['Countries specialise in goods they can produce relatively efficiently (comparative / absolute advantage)','Higher total world output / more efficient use of resources','Economies of scale from larger markets → lower costs and prices','Consumers get more choice and lower prices','Access to resources/goods the country cannot produce','Firms face competition → more efficiency and innovation'],acc:['named example, e.g. Saudi Arabia oil, Brazil coffee'],rej:['list of benefits without chains of reasoning'],tip:'Take two benefits and develop each with a chain (because… which means… so…) rather than listing six.',model:'When a country specialises in the goods it produces most efficiently, such as Brazil specialising in coffee, resources are used where they are most productive and total output rises. Selling to a world market allows firms to grow and benefit from economies of scale, lowering average costs, which leads to lower prices for consumers both at home and abroad.\n\nTrade also gives consumers access to goods the country cannot produce itself, increasing choice, and exposes domestic firms to foreign competition, which pushes them to cut costs and innovate, raising living standards over time.'},
{k:'cl:5',m:12,q:'Evaluate whether a government should introduce a national minimum wage increase.',pts:['Benefits: higher incomes for low-paid workers → reduced poverty / inequality','Higher consumption → higher AD and possibly growth','Improved worker motivation / productivity, lower staff turnover','Costs: higher wage costs for firms → possible unemployment (especially young/unskilled)','Firms may raise prices → inflation; less competitive internationally','Some firms may automate or relocate','It depends on: size of increase vs average wages, state of the economy, elasticity of demand for labour','Justified overall judgement'],acc:['labour market diagram showing excess supply'],rej:['answer with no final judgement (max level 3)'],tip:'12-mark evaluate: develop both sides, then a conclusion that says WHICH matters more and WHAT IT DEPENDS ON.',model:'An increase in the national minimum wage raises the incomes of the lowest-paid workers, reducing poverty and narrowing inequality. Because low-income households spend most of what they earn, consumption and aggregate demand rise, supporting growth, and better-paid workers may be more motivated and less likely to leave, reducing firms’ recruitment costs.\n\nHowever, the minimum wage raises firms’ costs. If it is set above the market wage, the supply of labour exceeds demand, so some firms cut jobs or hours, which hits young and unskilled workers hardest. Firms may pass the costs on in higher prices, adding to inflation and making exports less competitive, and some may replace workers with machines.\n\nOverall, a moderate increase is likely to be beneficial when the economy is growing and demand for labour is strong, but a large rise during a recession could cause significant unemployment. The decision should depend on how far the minimum wage is above the market rate and the state of the economy.'},
{k:'po:0',m:3,q:'Explain one reason why a government might reduce income tax.',pts:['Identify a reason, e.g. to increase consumer spending / incentive to work','Development: higher disposable income → more spending (AD) or more people willing to work / work longer','Linked outcome: higher economic growth / lower unemployment'],acc:['supply-side incentive argument'],rej:['“people have more money” with no further link'],tip:'3-mark explain = one point, developed twice. One well-developed reason beats three listed reasons.',model:'A government might cut income tax to boost economic growth. Lower income tax increases households’ disposable income, so they spend more, raising aggregate demand; firms then produce more and hire more workers, increasing real GDP and reducing unemployment.'}
);

[
{k:'po:4',c:'Ch 34 · Objectives & policies',m:3,q:'Explain one reason why there may be a conflict between reducing unemployment and keeping inflation low.',pts:['Identify: policies to cut unemployment raise aggregate demand (e.g. lower taxes / lower interest rates / more government spending)','Development: higher demand → firms produce more and hire workers → unemployment falls','Development: more people in work → higher incomes → more consumption (a component of AD) → AD rises faster than output → demand-pull inflation'],tip:'Name the policy, then two linked “→” steps ending in DEMAND-PULL inflation. Mr Jones: don’t say cost-push here — hiring more workers raises firms’ total costs, not average costs, so supply does not fall.',ann:'If the government [[cuts income tax]] to reduce unemployment, households have [[more disposable income]], so [[consumption rises]]. Consumption is a [[component of aggregate demand]], so [[AD rises]] and firms [[hire more workers]]. With more people in work, [[incomes are higher]], so they spend even more on goods and services. Demand grows faster than output, which causes [[demand-pull inflation]].'},
{k:'po:4',c:'Ch 34 · Objectives & policies',m:6,q:'Analyse the possible conflict between achieving economic growth and protecting the environment.',pts:['Growth = increase in real GDP → more output from factories, power stations and transport','More production → more pollution (air, water), carbon emissions → climate change','More consumption → more waste / landfill and resource depletion (non-renewables, deforestation)','Developing countries may prioritise growth and have weaker environmental laws','Policies to protect the environment (taxes, regulation) raise firms’ costs → lower output / growth','Two developed chains of reasoning needed for 5–6'],tip:'Two separate chains: (1) production → pollution; (2) environmental policy → higher costs → slower growth.',ann:'Economic growth is an [[increase in real GDP]], which means firms [[produce more output]]. To do this, factories and power stations burn more [[fossil fuels]], which [[increases carbon emissions and air pollution]]. This creates [[external costs]] such as health problems and climate change, so the environment is damaged as the economy grows. For example, rapid growth in China was accompanied by serious smog in cities.\n\nSecondly, the conflict also works the other way. If the government protects the environment by introducing [[environmental taxes or strict regulations]], firms’ [[costs of production rise]]. Firms may then [[cut output or invest less]], or even move production abroad, which [[reduces the growth of real GDP]]. Therefore the two objectives conflict, because policies that help one objective tend to harm the other.'},
{k:'po:4',c:'Ch 34 · Objectives & policies',m:9,q:'Assess whether raising interest rates to reduce inflation is likely to conflict with other macroeconomic objectives.',pts:['Higher interest rates → borrowing more expensive, saving more attractive → consumption and investment fall → AD falls → lower inflation','Conflict with growth: lower AD → lower real GDP / possible recession','Conflict with unemployment: firms produce less → cyclical unemployment rises','Conflict with current account: higher rates attract hot money → currency appreciates → exports dearer → current account worsens','But: lower inflation makes exports more price competitive over time → helps current account','Evaluation: depends on size of rise, spare capacity, cause of inflation (cost-push not solved), time lags, consumer confidence','Supported judgement'],tip:'Analyse 2 conflicts, then evaluate with “it depends on…” and finish with a judgement.',ann:'A rise in interest rates makes [[borrowing more expensive]] and [[saving more attractive]], so consumers spend less on credit and firms [[invest less]]. [[Aggregate demand falls]], which reduces demand-pull inflation.\n\nHowever, this is likely to [[conflict with economic growth]]: with lower aggregate demand, firms [[produce less]], so [[real GDP grows more slowly]] and the economy could even fall into recession. It also [[conflicts with low unemployment]], because when firms cut output they need fewer workers, so [[cyclical unemployment rises]].\n\nHigher interest rates can also harm the [[current account]]. They attract savings from abroad, so demand for the currency rises and it [[appreciates]]. Exports become [[more expensive]] for foreigners, so export volumes fall and the current account worsens.\n\nOn the other hand, the conflict [[depends on the size of the rise]] and on how much [[spare capacity]] there is. A small rise when the economy is booming may slow inflation without causing much unemployment. Also, in the long run, [[lower inflation makes exports more price competitive]], which helps the current account. Finally, if inflation is [[cost-push]] (e.g. rising oil prices), higher interest rates will not tackle its cause and the conflict with growth will be severe.\n\nOverall, raising interest rates [[is likely to conflict with growth and employment in the short run]], but the conflict is smallest when the economy is overheating and the rise is small and gradual.'},
{k:'po:4',c:'Ch 34 · Objectives & policies',m:12,q:'Evaluate whether a government can achieve both low unemployment and low inflation at the same time.',pts:['Conflict: expansionary fiscal/monetary policy → AD ↑ → unemployment ↓ but demand-pull inflation near full capacity','Conflict: low unemployment → more people with incomes → consumption ↑ → AD ↑ → more demand-pull inflation (NOT cost-push — Mr Jones)','Contractionary policy to cut inflation → AD ↓ → unemployment ↑','No conflict: spare capacity (recession) → output rises without much inflation','No conflict: supply-side policies (education/training, infrastructure, deregulation) → productive capacity ↑ → both objectives','Evaluation: time lags of supply-side policy; type of unemployment (structural not fixed by AD); cause of inflation; global factors (oil prices)','Clear, supported judgement'],tip:'12-markers need BOTH sides fully developed, then evaluation and a justified conclusion that answers the question.',ann:'Low unemployment means most people who want a job have one, and low inflation means the general price level rises slowly (e.g. around a 2% target). In the short run these objectives [[often conflict]].\n\nIf the government uses [[expansionary fiscal policy]] (lower taxes or more government spending) or the central bank [[cuts interest rates]], [[aggregate demand rises]]. Firms produce more and [[hire more workers]], so unemployment falls. However, as the economy approaches [[full capacity]], extra demand cannot be met by extra output, so firms [[raise prices]] — [[demand-pull inflation]].\n\nIn addition, when unemployment is low, more citizens have jobs, so [[incomes are higher]]. They use these incomes to buy more goods and services, so [[consumption — a component of AD — rises]] again, adding to [[demand-pull inflation]]. The reverse is also true: if the central bank [[raises interest rates]] to reduce inflation, consumers and firms [[borrow less]], higher mortgage payments cut spending power, so consumption and investment fall and firms need fewer workers — [[unemployment rises]]. Even [[contractionary fiscal policy]] (higher taxes, lower government spending) can directly cut [[public-sector jobs]] such as teachers and nurses.\n\nHowever, the conflict is [[not always present]]. If the economy is in a [[recession with lots of spare capacity]], higher demand can be met by unused machines and unemployed workers, so output and employment rise with [[little effect on prices]].\n\nFurthermore, [[supply-side policies]] such as investment in [[education and training]] or [[infrastructure]] increase the [[productive capacity]] of the economy. Workers become more productive and employable, which reduces unemployment, and policies such as [[privatisation and deregulation]] make firms more efficient, so their [[average costs fall]]. Aggregate supply increases, so output rises while [[the price level falls]]. Because supply-side policies [[increase output rather than reduce AD]], this allows [[both objectives to be achieved]]. However, some supply-side policies, such as [[infrastructure spending]], also [[raise AD]], so they may still add to inflation.\n\nOverall, whether both can be achieved [[depends on]] how much spare capacity exists and the [[time period]]. In the short run, demand-side policies usually create a trade-off. In the long run, supply-side policies can achieve both, but they are [[expensive and take years to work]]. Therefore a government is [[most likely to achieve both in the long run]], using supply-side policies alongside careful demand management.'},
{k:'gl:0',c:'Ch 35 · Globalisation',m:2,q:'Define the term globalisation.',pts:['The growing interconnection / integration of the world’s economies (1)','Development/example: goods, services, capital and people move freely between countries, creating interdependence (1)'],tip:'Use the textbook wording: “the growing interconnection of the world’s economies”.',ann:'Globalisation is [[the growing interconnection of the world’s economies]], where [[goods, services, capital and people move more freely between countries]], so countries become [[interdependent]].'},
{k:'gl:0',c:'Ch 35 · Globalisation',m:3,q:'Explain one reason for the growth of globalisation.',pts:['Identify a reason: fewer tariffs and quotas / reduced cost of transport / reduced cost of communication / increased significance of MNCs','Development: e.g. bigger container ships and aircraft → economies of scale → lower cost per unit of moving goods','Development: trade between countries becomes cheaper/more profitable → more trade and integration'],tip:'Pick ONE of the four textbook reasons and develop it twice.',ann:'One reason is the [[reduced cost of transporting goods]]. Transport has improved with [[bigger container ships and aircraft]], which give [[economies of scale]] and lower the average cost of moving each item. This makes it [[cheaper and more profitable to trade]] with firms on the other side of the world, so countries buy and sell more from each other and become more [[integrated]].'},
{k:'gl:0',c:'Ch 35 · Globalisation',m:6,q:'Analyse two benefits of globalisation for consumers.',pts:['Lower prices: production moves to lower-cost countries / more international competition / economies of scale → cheaper goods → real incomes rise','More choice: products from all over the world available, including online → wants better satisfied','Better quality / innovation from foreign competition','Two chains of reasoning, each with development'],tip:'6-mark analyse = two points, each with a 2–3 step chain of reasoning. No evaluation needed.',ann:'Firstly, globalisation leads to [[lower prices]]. Firms can [[produce in low-cost countries]], such as clothing factories in Bangladesh, and sell to a [[global market]], which gives them [[economies of scale]]. There is also [[more competition from foreign firms]], which forces domestic firms to cut prices. As a result consumers’ [[real incomes rise]], because their money buys more goods.\n\nSecondly, consumers get [[greater choice]]. Fewer tariffs and quotas and cheaper transport mean that [[goods from all over the world]] are available in shops and [[online]], for example buying products from overseas websites. With a wider range of goods, consumers can find products that [[better match their wants]], which increases their satisfaction and standard of living.'},
{k:'gl:0',c:'Ch 35 · Globalisation',m:9,q:'Assess the impact of globalisation on workers in a developing country.',pts:['Positive: MNCs/FDI create jobs (direct and at local suppliers) → incomes ↑ → poverty ↓','Positive: training and new skills / technology → higher productivity → higher wages','Positive: freedom to migrate → remittances sent home','Negative: low wages and poor working conditions / exploitation (e.g. garment factories)','Negative: local firms that cannot compete close → structural unemployment','Negative: job insecurity — MNCs can leave if costs rise elsewhere','Evaluation: depends on regulation/minimum wage, skill level, whether MNCs train local staff; judgement'],tip:'Two benefits, two costs, then “depends on…” + judgement. Use examples (Bangladesh, Vietnam, Kenya).',ann:'Globalisation can benefit workers in a developing country because [[MNCs set up factories]] there, which [[creates jobs]] both directly and at [[local suppliers]]. Workers who were unemployed or in low-paid farming earn [[higher, more regular incomes]], which reduces poverty. For example, Samsung’s factories in Vietnam employ over 100,000 people.\n\nWorkers also gain [[skills and training]] from MNCs, which [[raises their productivity]], so they can earn [[higher wages]] in the future. Globalisation also lets workers [[migrate abroad]] and send [[remittances]] home, as many Kenyan nurses and teachers do.\n\nHowever, many jobs created are [[low-paid with poor working conditions]], because MNCs locate there to [[cut labour costs]]. In addition, [[local firms that cannot compete]] with cheap imports or large MNCs may close, causing [[structural unemployment]]. Jobs are also [[insecure]], because an MNC may [[relocate]] to a cheaper country — for example several MNCs left Kenya after economic shocks.\n\nOverall, the impact [[depends on]] how well the government [[regulates working conditions]] and whether workers are [[trained for skilled jobs]]. Where this happens, globalisation is likely to benefit workers overall, because job creation and higher incomes outweigh the risks.'},
{k:'gl:0',c:'Ch 35 · Globalisation',m:12,q:'Evaluate whether a developing country such as Kenya has benefited from globalisation.',pts:['Benefit: industrial growth and exports (garments, export processing zones, firms supplying global brands) → diversify beyond agriculture','Benefit: FDI and jobs; technology transfer','Benefit: remittances from workers abroad → household incomes, education','Cost: high unemployment remains / benefits concentrated in a few sectors and urban areas','Cost: foreign investment volatile — MNCs leave after external shocks (e.g. recession abroad)','Cost: interdependence → exposure to global shocks; competition closes local firms; environment','Evaluation: depends on government policy, inclusiveness, stability of FDI, time period; judgement'],tip:'Mr Jones’ model: definition → 2 benefit paragraphs → 2 cost paragraphs → conclusion that “depends on…”. Use the case-study evidence in every paragraph.',ann:'Globalisation is [[the growing interconnection of the world’s economies]] through trade, foreign investment, technology and the movement of labour.\n\nKenya has benefited through [[industrial growth and exports]]. The growth of [[garment industries and export processing zones]] has [[created jobs]] and increased [[export earnings]], helping to [[diversify the economy beyond agriculture]]. Firms that supply global brands can [[increase their revenue and reach new markets]], which raises GDP.\n\nKenya has also gained from the [[movement of labour]]. Skilled workers such as nurses and teachers work abroad and send [[remittances]] home. This money goes directly to families and is spent on [[education and housing]], improving living standards and [[human capital]] in the long run.\n\nHowever, many Kenyans are [[excluded from the benefits]]. Unemployment has remained [[very high]] despite years of global integration, which suggests that new export jobs have [[not absorbed enough of the labour force]]. Gains are concentrated in [[a few sectors and urban areas]].\n\nIn addition, foreign investment has been [[volatile]]. Several MNCs, such as [[Nestlé and HSBC]], scaled back in Kenya after [[external shocks]] such as recession in Russia and a slowdown in China. This shows that [[interdependence]] exposes Kenya to [[global shocks it cannot control]], leading to sudden job losses.\n\nOverall, Kenya has [[benefited to some extent]], especially through exports and remittances. However, the extent of the benefit [[depends on]] whether the government can [[spread the gains to more of the population]], for example through education and infrastructure, and attract [[stable, long-term FDI]]. At the moment the benefits are real but [[narrow and unstable]].'},
{k:'gl:1',c:'Ch 36 · MNCs & FDI',m:2,q:'Define the term foreign direct investment (FDI).',pts:['When a company/organisation invests in a foreign country (1)','Example: building a factory, store, mine or plantation, or buying 10% or more of the shares of a foreign business (1)'],tip:'Textbook: FDI occurs when a company makes an investment in a foreign country.',ann:'FDI occurs when [[a company makes an investment in a foreign country]], for example [[building a factory, store or mine]] there, or [[buying 10% or more of the shares]] of a foreign business.'},
{k:'gl:1',c:'Ch 36 · MNCs & FDI',m:2,q:'Define the term multinational company (MNC).',pts:['An organisation which has operations (production, shops or assets) (1)','in at least one country other than its home country (1)'],tip:'“Operations” can be factories, shops or other assets — say so.',ann:'An MNC is [[an organisation which has operations]], such as factories or shops, [[in at least one country other than its home country]].'},
{k:'gl:1',c:'Ch 36 · MNCs & FDI',m:3,q:'Explain one reason why a company may become a multinational.',pts:['Identify: economies of scale / access to cheaper resources (natural resources, cheap labour) / lower costs of transport and communication / access to customers in different regions (and avoiding tariffs)','Development: e.g. sells to a global market → produces much more → average costs fall','Development: higher profit / more competitive prices'],tip:'Use one of the four textbook reasons — and make sure the last step is profit or competitiveness.',ann:'A company may become a multinational to gain [[access to customers in different regions]]. By setting up a factory inside a large market, such as Toyota building car plants in the USA, it can [[sell directly to those customers]] and [[avoid tariffs and quotas]] on imports. This [[lowers its costs and prices]] compared with exporting, so it [[sells more and earns higher profits]].'},
{k:'gl:1',c:'Ch 36 · MNCs & FDI',m:3,q:'Explain one way a government could attract FDI into its country.',pts:['Identify: tax breaks / subsidies / grants / cheap loans / relaxing business regulations / investing in infrastructure / investing in education and training','Development: reduces the MNC’s costs or makes operating easier','Development: higher expected profit → MNC more likely to choose this country over others'],tip:'Mr Jones’ seven: tax breaks, subsidies, grants, cheap loans, relaxing regulations, infrastructure, education & training.',ann:'A government could offer [[tax breaks]], allowing an MNC to [[pay lower taxes than normal]] for a number of years. This [[reduces the MNC’s costs]] and [[increases its expected profit]] from operating in the country, so the country becomes [[more attractive than competing locations]] and the MNC is more likely to invest there.'},
{k:'gl:1',c:'Ch 36 · MNCs & FDI',m:6,q:'Analyse two advantages to a host country of a multinational company locating there.',pts:['Job creation: direct jobs + jobs at local suppliers → incomes ↑ → spending ↑ (multiplier) → unemployment ↓','Infrastructure investment: roads, ports, power → lowers costs for all firms','Skills: training → human capital ↑ → productivity','Developing capital: advanced technology / efficient factories that local firms learn from','Taxes: corporation (profit) tax, VAT, income tax from workers → government can spend on services','Two developed chains with context'],tip:'The five textbook advantages: jobs, infrastructure, skills, capital, taxes. Pick two and build chains.',ann:'Firstly, the MNC will [[create jobs]], both [[directly in its factory]] and [[indirectly with local firms that supply it]] with components and services. Workers earn incomes, which they spend in the local economy, [[increasing demand]] for other firms and [[reducing unemployment]] further.\n\nSecondly, the MNC will [[contribute taxes]]. It pays [[profits tax]] on its earnings, and its workers pay [[income tax]]. This [[increases government revenue]], which can be spent on [[healthcare, education and infrastructure]], raising living standards in the host country.'},
{k:'gl:1',c:'Ch 36 · MNCs & FDI',m:9,q:'Assess the disadvantages to a developing country of foreign direct investment by multinational companies.',pts:['Tax avoidance: lawyers/accounting techniques use legal loopholes → host government loses revenue (e.g. Starbucks UK)','Environmental damage: especially extraction (oil, coal, gold) → pollution, deforestation, external costs','Moving profits abroad: profits sent to home country rather than reinvested → less spending/investment in host (≠ tax avoidance)','(Accept if context allows) exploitation of workers / loss of local culture / local firms forced out','Evaluation: still jobs, skills, taxes; depends on regulation, tax enforcement, whether profits are reinvested; judgement'],tip:'Mr Jones: stick to the three textbook disadvantages (tax avoidance, environment, profits abroad) — and remember profits abroad ≠ tax avoidance.',ann:'One disadvantage is [[tax avoidance]]. MNCs can afford [[expensive lawyers and accountants]] who use [[legal loopholes]], such as paying high fees to a branch in a low-tax country, so that little profit is declared in the host country. The host government therefore [[loses tax revenue]] it could have spent on schools and hospitals. For example, Starbucks paid very little UK corporation tax for many years.\n\nA second disadvantage is [[environmental damage]], especially in [[extraction industries]] such as oil and gold mining. Pollution and deforestation create [[external costs]] for local people, such as health problems and damage to farming and fishing, as happened with oil spills in the Niger Delta.\n\nThirdly, MNCs often [[send profits back to their home country]] rather than [[reinvesting them]] in the host country. This is different from tax avoidance: even after tax is paid, the profit [[leaves the economy]], so it is not spent or invested locally and does not create further jobs.\n\nHowever, these disadvantages must be weighed against the [[jobs, skills and technology]] that FDI brings. The size of the disadvantages [[depends on]] how well the government [[enforces tax and environmental laws]] and whether MNCs [[reinvest their profits]] locally. Overall, the disadvantages are [[significant where regulation is weak]], but they do not usually outweigh the benefits of FDI if the government regulates MNCs effectively.'},
{k:'gl:1',c:'Ch 36 · MNCs & FDI',m:12,q:'Evaluate whether a government should offer incentives, such as tax breaks and subsidies, to attract multinational companies.',pts:['For: attracts FDI → jobs (direct and suppliers) → unemployment ↓, incomes ↑','For: skills, technology and capital transfer → productivity and long-term growth','For: infrastructure built by MNCs; taxes paid by workers even if profit tax is cut; exports ↑','Against: opportunity cost — subsidies/tax breaks reduce revenue that could fund health/education','Against: MNC may leave when incentives end (footloose); profits sent abroad; tax avoidance','Against: unfair to domestic firms; environmental damage','Evaluation: size/length of incentive, conditions attached (local jobs, training), alternatives (education, infrastructure) that benefit everyone; judgement'],tip:'Make the opportunity cost argument — it is the strongest “against” point — and finish with a conditional judgement.',ann:'Governments can attract MNCs with [[tax breaks]] (paying lower tax than normal) or [[subsidies and grants]]. These [[reduce the MNC’s costs]] and raise its expected profit, so the country is chosen over competitors.\n\nThe main benefit is [[job creation]]. An MNC factory employs local workers directly and also creates jobs at [[local suppliers]]. Incomes rise and are spent in the economy, [[reducing unemployment]] and poverty. Even if the MNC pays little profit tax, its workers pay [[income tax]] and spend money on which [[VAT]] is paid, so government revenue may still rise.\n\nMNCs also bring [[advanced technology and training]]. Local workers gain [[skills]] and local firms learn more efficient methods, which [[raises productivity]] and long-term economic growth. Singapore attracted MNCs with tax incentives and became a high-income economy.\n\nHowever, incentives have an [[opportunity cost]]. Money spent on subsidies, or tax revenue given up, could have been spent on [[healthcare, education or infrastructure]] that benefit everyone. If the MNC also uses [[tax avoidance]] and [[sends its profits abroad]], the country may gain very little.\n\nFurthermore, MNCs attracted only by incentives may be [[footloose]]: when the tax break ends, or another country offers more, they may [[relocate]], causing sudden job losses. Incentives can also be [[unfair to domestic firms]], which do not receive the same support.\n\nOverall, offering incentives is [[worthwhile only if conditions are attached]], for example requiring the MNC to [[train local workers, use local suppliers and stay for a minimum period]]. It [[depends on]] the size of the incentive compared with the benefits. In the long run, investing in [[education and infrastructure]] may be a better way to attract FDI, because it helps all firms and is less likely to be wasted.'},
{k:'gl:1',c:'Ch 36 · MNCs & FDI',m:6,q:'Analyse two features of multinational companies that give them an advantage over smaller local firms.',pts:['A STAGE: Assets, Staff, Technology, Advertising & marketing, Government influence, Economies of scale','e.g. Economies of scale → lower average costs → lower prices / higher profit','e.g. Advertising & marketing budgets → strong brands → outcompete smaller rivals','e.g. Technology → most efficient factories → lower costs','Two developed chains'],tip:'Remember Mr Jones’ “The world is A STAGE for MNCs”: Assets, Staff, Technology, Advertising, Government influence, Economies of scale.',ann:'Firstly, MNCs can exploit [[economies of scale]] because they produce for a [[global market]]. For example, they can [[buy raw materials in bulk]] at a discount, so their [[average costs are lower]] than those of a small local firm. They can then [[charge lower prices]] and win customers, or earn higher profits.\n\nSecondly, MNCs can spend huge amounts on [[advertising and marketing]]. This builds [[strong global brands]] such as Coca-Cola, which increases [[brand loyalty]] and makes demand for their products [[less price elastic]]. Smaller local firms cannot afford the same advertising, so they [[struggle to compete]] for customers.'}

{k:'po:4',c:'Ch 34 · Iran case study',m:12,q:'Iran: to cut inflation the government raised interest rates from about 15% (2013) to over 20%, cut the budget deficit and removed cash subsidies from people who did not need them. Inflation fell from about 40% (2013) to below 10% (2016), but unemployment rose from 9.5% (late 2014) to 12.7% (end of 2016). Evaluate the likely impact of Iran’s anti-inflationary policies on living standards in the country.',pts:['Level 1 (1–4): defines inflation or living standards; vague statements (“inflation is bad”); little use of the case study; no evaluation','Level 2 (5–8): explains how inflation or the policies affect living standards; uses case-study evidence (inflation ~40% → under 10%); purchasing power or job losses; some evaluation','Level 3 (9–12): case study applied to BOTH benefits and drawbacks; good economic reasoning (inflation–unemployment trade-off, fiscal restraint and services); balanced, developed evaluation','Conclusion focused on ONE key factor the overall impact depends on (e.g. how evenly the costs and benefits were shared)'],tip:'Mr Jones’ 6-paragraph plan: 1 definitions · 2 + purchasing power · 3 + fiscal control/reallocation · 4 − rising unemployment · 5 − less support for vulnerable groups · 6 conclusion “depends on income distribution”. Quote a number from the case study in every paragraph.',ann:'[[Inflation]] is the sustained increase in the [[general price level]] of goods and services in an economy. [[Living standards]] refer to the general well-being of individuals, including their ability to afford goods, access services and enjoy a stable economic environment. Anti-inflationary policies aim to reduce inflation, often through [[higher interest rates]], [[reduced government spending]] and tighter control of the money supply.\n\nOne benefit of reducing inflation is that it [[protects consumers’ purchasing power]]. In Iran, inflation fell from [[around 40% in 2013 to below 10% by 2016]]. This means that wages and savings were [[less likely to lose value quickly]], allowing people to plan spending and saving more confidently. More stable prices also [[reduce uncertainty]] for businesses and consumers alike.\n\nThe government also [[redirected subsidies away from people who didn’t need them]] and [[reduced the budget deficit]]. This made public finances more sustainable and allowed resources to be invested in production rather than consumption. In the long term, this could [[support job creation]] and reduce pressure on the economy, improving living standards over time.\n\nHowever, some anti-inflationary policies may have [[hurt living standards in the short term]]. For example, [[high interest rates (20% in 2017)]] discouraged borrowing and spending, which reduces economic activity. As shown in the case study, [[unemployment rose from 9.5% in late 2014 to 12.7% by the end of 2016]]. Higher joblessness leads to [[lower incomes and greater hardship]] for households.\n\nThe [[removal of cash subsidies]] could also have hurt [[poorer households]]. Although the government aimed to redirect money more efficiently, some people may have lost support they relied on. Combined with [[fewer government services]] due to tighter spending, this may have led to a decline in living standards for the [[most vulnerable citizens]].\n\nOverall, the effect on living standards [[depends on how evenly the benefits and costs were shared]]. If most of the pain fell on [[low-income groups]] through subsidy cuts or job losses, living standards may have worsened for them even though inflation improved. However, if [[long-term stability]] creates broader economic opportunities, the benefits could become more widely felt over time.'},
{k:'po:4',c:'Ch 34 · Objectives & policies',m:6,q:'Analyse how raising interest rates to reduce inflation could increase unemployment.',pts:['Higher interest rates → consumers and businesses borrow less → consumption and investment fall → AD falls → firms need fewer workers','Higher mortgage payments → less spending power → AD falls → staff laid off','Firms with loans pay higher interest charges → costs ↑, profits ↓ → less investment in capital goods → capital-goods firms need fewer staff','Less borrowing for new technology → less competitive abroad → lower demand → fewer staff','Higher interest rates → higher exchange rate → exports dearer → exporters cut staff','Two developed chains needed for 5–6'],tip:'Pick TWO of Mr Jones’ chains (borrowing, mortgages, firms’ interest charges, technology, exchange rate) and take each all the way to “workers lose their jobs”.',ann:'Higher interest rates [[discourage consumers and businesses from borrowing]]. As a result there is a [[fall in consumption and investment]], which are both components of [[aggregate demand]]. AD falls, so businesses do not need to supply as many goods and services and [[workers lose their jobs]]. Higher interest rates also mean [[higher mortgage payments]] for many households, which [[reduces their spending power]], so AD falls further and firms [[lay off staff]].\n\nSecondly, higher interest rates may cause the [[exchange rate to rise]], because foreign investors move money into the country’s banks to earn the higher rate. This makes the country’s [[exports relatively more expensive]] abroad, so businesses that export face a [[fall in demand]]. They then need [[fewer workers]], so unemployment rises. This is why there is a [[trade-off between inflation and unemployment]].'},
{k:'po:4',c:'Ch 34 · Objectives & policies',m:6,q:'Analyse how using monetary policy to reduce inflation could worsen a country’s current account.',pts:['Higher interest rates → foreign investors move money into the country’s banks','Foreigners sell their own currency and buy this currency → exchange rate strengthens','Stronger currency → exports more expensive → fewer exports sold','Stronger currency → imports cheaper → more imports bought','Value of exports falls / imports rises → current account worsens','Whether the VALUE changes depends on price elasticity of demand for exports and imports'],tip:'Mr Jones’ chain: interest rates ↑ → hot money → buy the currency → appreciation → exports dearer AND imports cheaper → current account worse — “depends on elasticity”.',ann:'If the central bank [[raises interest rates]] to reduce inflation, foreign investors benefit from moving their money into the [[bank accounts of the domestic country]]. To do this they must [[sell their own currency and buy the domestic currency]], so demand for it rises and the [[exchange rate strengthens]]. This makes the country’s [[exports more expensive]] for foreign buyers, so fewer exports are sold and the [[value of exports may fall]].\n\nAt the same time, a stronger currency makes [[imports cheaper]] for domestic consumers and firms, so they buy more goods from abroad and the [[value of imports rises]]. With exports falling and imports rising, the [[current account balance worsens]] (a bigger deficit). However, how much it worsens [[depends on the price elasticity of demand]] for exports and imports — if demand is price inelastic, the values may change very little.'},
{k:'po:4',c:'Ch 34 · Objectives & policies',m:3,q:'Explain why high economic growth could cause high inflation.',pts:['Economic growth = rising GDP, and GDP = C + I + G + (X − M)','Higher GDP means higher spending by consumers, businesses, the government and foreigners','Higher demand for goods and services → prices rise → demand-pull inflation (especially near full capacity / immobile factors)'],tip:'Use Mr Jones’ formula: GDP = C + I + G + (X − M) → more spending → more demand → higher prices.',ann:'High economic growth means [[GDP is rising]], and [[GDP = C + I + G + (X − M)]]. So higher GDP means spending is rising — [[higher consumer spending, business investment, government spending and spending by foreigners on exports]]. This higher demand for goods and services results in [[higher prices]], so there is [[demand-pull inflation]], especially if firms are close to [[full capacity]] and cannot easily get more resources.'},
{k:'po:4',c:'Ch 34 · Objectives & policies',m:9,q:'Assess whether supply-side policies allow a government to reduce inflation without increasing unemployment.',pts:['Supply-side policies increase output (AS) rather than reduce AD','Firms become more efficient → average costs fall → AS ↑ → price level falls','No fall in AD → firms do not cut jobs; output rises so employment can rise','Examples: privatisation, deregulation, education and training','Also “business friendly” → cheaper exports → current account improves','But: some (infrastructure spending) raise AD → demand-pull inflation','But: expensive (opportunity cost) and take a long time to work (time lags)','Judgement: best long-run solution; in the short run monetary policy still needed'],tip:'Two paragraphs FOR (avoids reducing AD; lowers average costs), one AGAINST (raises AD / slow / expensive), then a judgement on the time period.',ann:'Supply-side policies can reduce inflation [[without increasing unemployment]] because they are designed to [[increase output, not reduce aggregate demand]]. Policies such as [[privatisation and deregulation]] make businesses more efficient, so their [[average production costs fall]]. This [[increases aggregate supply]], so output rises and the [[overall price level falls]]. Because AD is not reduced, firms have no reason to cut jobs — in fact, higher output means they may [[hire more workers]].\n\nIn comparison, raising interest rates or taxes [[reduces AD]], so firms produce less and [[unemployment rises]]. Supply-side policies are also “[[business friendly]]” and do not push up the exchange rate, so firms can sell [[cheaper exports]], which also helps the current account.\n\nHowever, supply-side policies will [[not definitely reduce inflation]]. Some, such as [[infrastructure spending]], increase government spending and therefore [[raise AD]], which could add to demand-pull inflation in the short run. They can also be [[expensive]], with an opportunity cost for the government budget, and they [[take a long time to have an impact]] — building skills or new roads can take years.\n\nOverall, supply-side policies are [[the best way to reduce inflation without raising unemployment in the long run]], but it [[depends on the time period]]: if inflation is high now, the government may still need monetary policy in the short run and accept some rise in unemployment.'},
{k:'po:4',c:'Ch 34 · Objectives & policies',m:9,q:'Assess whether developing countries should prioritise economic growth over protecting the environment.',pts:['FOR growth: developing countries are poor; growth reduces poverty, raises life expectancy, lowers infant mortality, raises living standards','FOR: India and China accepted environmental damage as a price for growth over the past 50 years','AGAINST: growth → more energy generation and car ownership → pollution and emissions','AGAINST: e.g. over 80% of China’s underground well water unsafe; habitats cleared for farms, housing, roads','AGAINST: damage is costly (health, lost farmland); attitudes in China and India are changing (e.g. New Delhi’s air improving)','Evaluation: depends on level of poverty, cost of green technology, international help','Judgement'],tip:'Use Mr Jones’ examples: India and China, 80% of China’s well water unsafe, New Delhi pollution. End with “it depends on…”.',ann:'Developing countries are generally poor, so economic growth is badly needed. Higher growth [[reduces poverty]], leads to [[longer life expectancy]], [[lower infant mortality]] and [[higher living standards]]. Over the past 50 years many developing countries, such as [[India and China]], have accepted [[damage to the environment as a price worth paying]] for growth, and hundreds of millions of people have been lifted out of poverty.\n\nHowever, higher growth usually [[damages the environment]]. As businesses produce more output, more [[energy generation]] is needed, which causes pollution, and higher incomes mean more people buy [[cars]], increasing emissions and congestion. In China, for example, [[more than 80% of underground well water]] used by farms, factories and households is not safe due to pollution, and habitats are cleared for agriculture, housing and roads. This damage is [[costly]] — it harms health and productivity, which can reduce living standards and future growth.\n\nThis is why attitudes in [[China and India are changing]]: they are developing policies to reduce the harmful effects, and air quality in [[New Delhi has improved]] in recent years.\n\nOverall, it [[depends on how poor the country is]]: for very poor countries, growth that reduces poverty should come first, but they should not ignore the environment, because the long-run costs of pollution are high. The best approach is growth using [[cheaper green technology]], so both objectives can be achieved.'},
{k:'po:4',c:'Ch 34 · Objectives & policies',m:6,q:'Analyse how contractionary fiscal policy could reduce inflation without harming the current account.',pts:['Government cuts spending and/or raises taxes → disposable income ↓ → consumption ↓ → AD ↓ → less demand-pull inflation','No direct effect on the exchange rate (unlike higher interest rates) → prices of exports and imports stay stable → current account relatively unaffected','Lower disposable incomes → fewer imports bought → current account may even improve','Compare with monetary policy: higher interest rates → appreciation → current account worsens'],tip:'Chain 1: fiscal policy → AD ↓ → inflation ↓. Chain 2: no exchange-rate effect + fewer imports → current account OK or better. Compare with interest rates.',ann:'If the government [[reduces its spending and/or increases taxes]], households have [[less disposable income]], so consumption falls. Government spending and consumption are both [[components of AD]], so [[AD falls]] and [[demand-pull inflation is reduced]].\n\nUnlike raising interest rates, contractionary fiscal policy has [[no direct effect on the exchange rate]], because it does not attract hot money from abroad. This means the [[prices of exports and imports stay fairly stable]], so the current account is relatively unaffected. In fact, lower disposable incomes mean consumers [[buy fewer imports]], which could [[improve the current account]]. Therefore fiscal policy can reduce inflation while avoiding the conflict with the current account that monetary policy creates.'},
{k:'po:4',c:'Ch 34 · Australia case study',m:9,q:'Australia generates 73% of its electricity from coal and 13% from oil. The government plans to invest AUS$40.4 billion in “green” energy by 2030, with 30–50 major projects expected to create over 15,000 jobs. Employment in coal mining fell from over 80,000 in 2009 to 57,800 in 2014. Assess the possible impact on the Australian economy of switching to “greener” energy.',pts:['Trade-off: growth → more emissions; switching to green energy reduces environmental damage','Benefit: AUS$40.4bn investment, 30–50 major projects → over 15,000 jobs → incomes, multiplier, growth','Benefit: fewer emissions, cleaner air, less global warming (86% of electricity from coal and oil now)','Cost: job losses in coal — already fell from 80,000+ to 57,800 → structural unemployment in mining regions','Cost: opportunity cost of government spending; possibly higher energy costs for firms','Evaluation: net effect hard to predict; depends on whether new jobs outnumber lost coal jobs and are in the same regions/skills','Judgement — even with net job loss, may be “a price worth paying”'],tip:'Use every number in the extract. Benefits (jobs, environment) → costs (coal jobs, structural unemployment) → “overall it depends on…”.',ann:'Switching to greener energy could [[benefit the economy]]. The government plans to invest [[AUS$40.4 billion by 2030]], with [[30–50 major projects]] and many smaller solar projects. As a result, [[over 15,000 jobs]] are expected to be created. These workers earn incomes and spend them, so [[consumption and AD rise]], supporting economic growth.\n\nIt would also reduce environmental damage. At the moment [[73% of electricity comes from coal and 13% from oil]], so power generation causes high emissions. Renewables would mean [[fewer emissions, cleaner air and less pressure on global warming]], improving health and living standards.\n\nHowever, although green energy creates jobs, there will be [[job losses in the coal industry]], because less coal is needed for power. Coal mining employment has already fallen [[from over 80,000 to 57,800 in 2014]], and the switch will add to this decline. Coal workers may not have the skills for green jobs, so there may be [[structural unemployment]] in mining regions. The investment also has an [[opportunity cost]] — the money could have been spent on schools or hospitals.\n\nOverall, the impact on the economy is [[difficult to predict without more information]]: it [[depends on whether the 15,000 new jobs outweigh the coal jobs lost]] and whether coal workers can be retrained. Even if there were a net job loss, many would argue it is [[a price worth paying]] for fewer emissions and cleaner air.'}
].forEach(w=>{w.model=w.ann.replace(/\[\[|\]\]/g,'');WRITTEN.push(w);});

  {h:'🚀 How to go from a 3 to an 8/9',body:`<p style="margin:0 0 8px">A grade 3 answer usually <b>knows the points</b> but <b>lists</b> them. A grade 8/9 answer <b>explains each point as a chain</b>, uses the <b>extract</b>, and <b>evaluates</b>.</p>

<p style="margin:10px 0 4px"><b>Connectives that earn analysis marks:</b> <i>which means that… · this leads to… · as a result… · therefore…</i></p>

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function parse(r){try{const d=JSON.parse(r);return d&&typeof d==='object'?d:null;}catch(e){return null;}}
function load(){
  let d=parse(lsGet(STORE));

  tier='extended';

let PL=null;
function openPlayer(key,start){SEEN.clear();
  const l=lessonByKey(key);if(!l){go('lessons');return;}
  const L=LESSONS[key]||{slides:[{t:'idea',h:'Lesson coming soon',pts:['Use the Notes and Checklist for this subtopic for now.']}]};
  if(PL&&PL.key===key){plGo(Math.min(start||0,PL.slides.length-1));return;}
  const slides=[{t:'title'},...L.slides,{t:'mastery'}];
  PL={key,l,L,slides,i:-1,steps:slides.map(()=>0),max:slides.map(()=>0)};
  prefs.last=key;savePrefs();
  const p=document.getElementById('player');p.classList.add('on');document.body.style.overflow='hidden';document.body.classList.add('in-player');
  p.style.setProperty('--c',colorOf(l.ti));
  const bm=bookmarks.includes(key);
  p.innerHTML=`<div class="pl-top"><button class="iconbtn" onclick="go('lessons/${l.T.id}')" title="Close (Esc)">${ico('x')}</button>${badge(l.ti,36)}<div class="pl-title"><b>${esc(l.title)}</b><span>${esc(l.T.name)} · Lesson ${l.si+1} of ${l.T.subs.length}${L.ref?' · '+(l.xs?L.ref:'Spec '+L.ref):''}</span></div><button class="iconbtn${bm?' on':''}" id="pl-bm" onclick="toggleBookmark()" title="Save lesson">${ico('bookmark')}</button><button class="iconbtn${lnotes[key]?' dot':''}" id="pl-nb" onclick="toggleNotes()" title="My notes (N)">${ico('pen')}</button>${(document.fullscreenEnabled||document.webkitFullscreenEnabled)?`<button class="iconbtn" onclick="toggleFS()" title="Fullscreen (F)">${ico('expand')}</button>`:''}</div><div class="pl-prog"><i id="pl-bar"></i></div><div class="pl-stage" id="pl-stage">${slides.map((s,i)=>`<section class="slide anim" id="sl-${i}"></section>`).join('')}<aside class="pl-notes" id="pl-notes"><div class="pn-hd">${ico('pen')}<b>My notes</b><span id="pn-saved"></span><button class="btn sm pn-add" onclick="noteAddSlide()" title="Copy this slide’s key points into your notes">${ico('plus')}Add slide</button><button class="iconbtn sm" onclick="toggleNotes()" aria-label="Close notes">${ico('x')}</button></div><textarea id="pn-ta" placeholder="Write anything you want to remember from this lesson — it saves automatically." oninput="noteInput(this)">${esc(lnotes[key]||'')}</textarea><div class="pn-ft">Saved automatically · all notes collect in <a href="#mynotes">My notebook</a></div></aside></div><div class="pl-bot"><button class="btn" onclick="plPrev()">${ico('left')}Back</button><div class="pl-dots" id="pl-dots">${slides.map((_,i)=>`<i onclick="plGo(${i})" title="Slide ${i+1}"></i>`).join('')}</div><span class="pl-count" id="pl-count"></span><span class="pl-hint">Space / → next · click a diagram to zoom</span><button class="btn pri" id="pl-next" onclick="plNext()">Next${ico('right')}</button></div>`;
  slides.forEach((s,i)=>{const el=document.getElementById('sl-'+i);const r=renderSlide(s,i);el.innerHTML=r.html;el.className='slide anim '+(r.cls||'');if(r.sym)el.dataset.sym=r.sym;PL.max[i]=Math.max(r.steps||0,...[...r.html.matchAll(/data-s="(\d+)"/g)].map(m=>+m[1]));});
  const st=document.getElementById('pl-stage');let x0=null;st.ontouchstart=e=>{x0=e.touches[0].clientX;};st.ontouchend=e=>{if(x0==null||e.target.closest('textarea,input,.widget'))return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60){dx<0?plNext():plPrev();}x0=null;};
  plGo(Math.min(start||0,slides.length-1),false);
}
function closePlayer(){document.body.classList.remove('in-player');const p=document.getElementById('player');if(!p.classList.contains('on'))return;p.classList.remove('on');p.innerHTML='';document.body.style.overflow='';PL=null;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}
function toggleFS(){fsToggle();}
function toggleBookmark(){if(!PL)return;const k=PL.key,i=bookmarks.indexOf(k);if(i>=0){bookmarks.splice(i,1);toast('Removed from saved lessons','bookmark');}else{bookmarks.push(k);toast('Lesson saved — find it on the Home page','bookmark');}saveB();document.getElementById('pl-bm').classList.toggle('on',i<0);}
function toggleNotes(){const n=document.getElementById('pl-notes');n.classList.toggle('on');const st=document.getElementById('pl-stage');if(st)st.classList.toggle('notes-on',n.classList.contains('on'));if(n.classList.contains('on'))setTimeout(()=>{const t=document.getElementById('pn-ta');if(t)t.focus();},250);}
let noteT;function noteInput(ta){clearTimeout(noteT);document.getElementById('pn-saved').textContent='…';noteT=setTimeout(()=>{if(ta.value.trim())lnotes[PL.key]=ta.value;else delete lnotes[PL.key];saveN();document.getElementById('pn-saved').textContent='saved';document.getElementById('pl-nb').classList.toggle('dot',!!lnotes[PL.key]);},400);}
function plGo(i,back){
  if(!PL)return;const prev=PL.i;
  if(prev>=0)document.getElementById('sl-'+prev).classList.remove('on');
  PL.i=i;const el=document.getElementById('sl-'+i);
  el.classList.toggle('back',!!back);el.classList.remove('on');void el.offsetWidth;el.classList.add('on');el.scrollTop=0;
  if(back)PL.steps[i]=PL.max[i];else if(i!==prev)PL.steps[i]=0;
  applySteps(i);
  el.querySelectorAll('[data-widget]').forEach(w=>{if(!w.dataset.mounted){mountWidget(w,w.dataset.widget);w.dataset.mounted=1;}});
  document.querySelectorAll('#pl-dots i').forEach((d,j)=>{d.classList.toggle('on',j===i);d.classList.toggle('seen',j<i);});
  document.getElementById('pl-bar').style.width=((i+1)/PL.slides.length*100)+'%';document.getElementById('pl-count').textContent=(i+1)+' / '+PL.slides.length;
  const last=i===PL.slides.length-1;
  document.getElementById('pl-next').innerHTML=last?'Finish'+ico('check'):'Next'+ico('right');
  const lp=lprog[PL.key]||{};lp.s=i;if(last&&lp.done&&!PL.fin){PL.fin=1;if((lp.ru||0)>(lp.rd||0)){lp.rd=lp.ru;lprog[PL.key]=lp;saveL();setTimeout(()=>toast('Redo complete — lesson ticked again','checkc'),300);}const id='L'+todayStr()+PL.key;if(!SEEN.has(id)){SEEN.add(id);logM('l');toast('Lesson revised · +5 XP','trophy');}}if(last&&!lp.done){PL.fin=1;lp.done=1;lprog[PL.key]=lp;saveL();logM('l');const nx=ALL_LESSONS[ALL_LESSONS.findIndex(x=>x.key===PL.key)+1];const ttl=PL.l.title,lk=PL.key;setTimeout(()=>celebrate({title:'Lesson complete!',sub:esc(ttl)+' · '+lessonsDone()+' of '+ALL_LESSONS.length+' lessons done',xp:5,icon:'trophy',ok:'Keep going',actions:GEN[lk]?`<a class="btn" href="#practice/${lk}" onclick="closeModal()">${ico('practice')}Practise it</a>`:''}),450);}lprog[PL.key]=lp;saveL();
  if(i>prev)logSlide(PL.key,i);
  const h='lesson/'+PL.key+'/'+i;if(location.hash!=='#'+h)history.replaceState(null,'','#'+h);
}
function applySteps(i){const el=document.getElementById('sl-'+i),k=PL.steps[i];
  el.querySelectorAll('.build').forEach(b=>b.classList.toggle('shown',+b.dataset.b<=k));
  el.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('shown',+b.dataset.s<=k));
  const nh=el.querySelector('.nexthint');if(nh)nh.style.visibility=k<PL.max[i]?'visible':'hidden';}
function plNext(){if(!PL)return;const i=PL.i;if(PL.steps[i]<PL.max[i]){PL.steps[i]++;applySteps(i);return;}
  if(i<PL.slides.length-1)plGo(i+1);else{go('lessons/'+PL.l.T.id);}}
function plPrev(){if(!PL)return;if(PL.i>0)plGo(PL.i-1,true);}
function visHTML(v){if(!v)return'';if(typeof v==='object'&&v.w)return`<div class="widget-host" data-widget="${v.w}" style="width:100%"></div>`;return v;}

    return{steps:n+(s.ans?1:0),html:`${kick}${H('pen',s.h||'Worked example')}<div class="s-body ${s.vis?'wide':'one'}"><div><div class="exq">${s.q}</div><div class="exsteps">${s.steps.map((st,j)=>`<div class="exstep build" data-b="${j+1}"><div class="n">${j+1}</div><div>${st}</div></div>`).join('')}${s.ans?`<div class="exans build" data-b="${n+1}">${ico('checkc')}<span>${s.ans}</span></div>`:''}</div></div>${s.vis?`<div class="s-vis">${visHTML(s.vis)}</div>`:''}</div>${hint}`};}

const SUPMAP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'};
function normSup(s){return s.replace(/[⁻]?[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+m.split('').map(c=>SUPMAP[c]).join(''));}
function parseNum(s0){
  let s=normSup(String(s0)).trim().toLowerCase().replace(/[−–]/g,'-').replace(/(\d),(\d{3})/g,'$1$2').replace(/\s+/g,'').replace(/[$£€%°]/g,'');
  s=s.replace(/[$£€¥₹]/g,'').replace(/(bn|billion|million|m|units?|tractors?|bikes?|calls?|workers?|years?|per[a-z]*)$/,'').replace(/[a-z]+$/,'');
  s=s.replace(/×/g,'x').replace(/\*/g,'x');
  let m=s.match(/^(-?[\d.]+)x10\^\(?(-?\d+)\)?$/);if(m)return +m[1]*10**+m[2];
  m=s.match(/^(-?[\d.]+)e(-?\d+)$/);if(m)return +m[1]*10**+m[2];
  if(/π|pi/.test(s)){s=s.replace('pi','π');const [a,b]=s.split('π');let k=a===''?1:a==='-'?-1:parseFrac(a);let d=b&&b.startsWith('/')?parseFrac(b.slice(1)):1;return k*Math.PI/d;}
  return parseFrac(s);
}
function parseFrac(s){let m=String(s).match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m)return +m[1]/+m[2];if(/^-?\d*\.?\d+$/.test(s))return +s;return NaN;}
function close3(u,a){if(!isFinite(u))return false;if(Math.abs(u-a)<=1e-9*Math.max(1,Math.abs(a)))return true;if(a===0)return Math.abs(u)<5e-4;const tol=0.5*10**(Math.floor(Math.log10(Math.abs(a)))-2);return Math.abs(u-a)<=tol*1.0001;}
function normTxt(s){return normSup(String(s)).toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/sqrt\(?([0-9]+)\)?/g,'√$1').replace(/\*/g,'').replace(/×/g,'x').replace(/·/g,'');}
function exprFn(s,v){
  let e=normSup(String(s)).toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/');
  e=e.replace(/^[a-z]\(?[a-z]?\)?=/,'').replace(/^t\(?n\)?=|^tn=|^y=/,'');
  if(!new RegExp('^[0-9.+\\-*/^()'+v+']+$').test(e))return null;
  e=e.replace(new RegExp('(\\d|\\))(?=['+v+'(])','g'),'$1*').replace(new RegExp('(['+v+'])(?=[\\d'+v+'(])','g'),'$1*').replace(/\^/g,'**');
  try{return new Function(v,'return '+e);}catch(err){return null;}
}
function checkAns(input,ans){
  if(input==null||String(input).trim()==='')return false;
  if(typeof ans==='number')return close3(parseNum(input),ans);
  if(Array.isArray(ans))return ans.some(a=>checkAns(input,a));
  if(ans.txt)return ans.txt.some(t=>normTxt(t)===normTxt(input));
  if(ans.set){const nums=String(input).replace(/[−–]/g,'-').split(/[,;]|\band\b|\bor\b/).map(x=>parseNum(x.replace(/^[a-z]+=/i,''))).filter(x=>isFinite(x));if(nums.length!==ans.set.length)return false;const used=new Set();return ans.set.every(a=>{const j=nums.findIndex((u,k)=>!used.has(k)&&close3(u,a));if(j<0)return false;used.add(j);return true;});}
  if(ans.pair){const nums=String(input).replace(/[−–]/g,'-').replace(/[()\[\]]/g,'').split(/[,;]/).map(x=>parseNum(x.replace(/^[a-z]+=/i,'')));return nums.length===2&&close3(nums[0],ans.pair[0])&&close3(nums[1],ans.pair[1]);}
  if(ans.expr){const v=ans.v||'x';const f=exprFn(input,v),g=exprFn(ans.expr,v);if(!f||!g)return false;try{const pts=[1.37,2.71,-0.83,3.29,0.51,-2.6,5.13].filter(t=>isFinite(g(t)));return pts.length>=4&&pts.every(t=>Math.abs(f(t)-g(t))<1e-6*Math.max(1,Math.abs(g(t))));}catch(e){return false;}}
  if(ans.ratio){const a=String(input).split(':').map(x=>parseNum(x));if(a.length!==ans.ratio.length||a.some(x=>!isFinite(x)))return false;return a.every((x,i)=>Math.abs(x-ans.ratio[i])<1e-9);}
  return false;
}
function ansText(a){if(a==null)return'';if(typeof a==='number')return fmtNum(a);if(Array.isArray(a))return ansText(a[0]);if(a.txt)return a.txt[0];if(a.set)return a.set.map(fmtNum).join(', ');if(a.pair)return'('+a.pair.map(fmtNum).join(', ')+')';if(a.expr)return a.show||a.expr;if(a.ratio)return a.ratio.join(' : ');return'';}
function fmtNum(n){if(!isFinite(n))return String(n);if(Number.isInteger(n))return String(n).replace('-','−');const s=Math.abs(n)>=1000?n.toFixed(1):Number(n.toPrecision(Math.abs(n)<1?3:4)).toString();return s.replace('-','−');}

  if(!s)return null;if(!/^[0-9a-z.+\-*/^(),]+$/.test(s))throw new Error('Use only numbers, x, + − × ÷ ^ ( ) and sin cos tan sqrt log ln abs pi e');
  const toks=s.match(/\d*\.?\d+|[a-z]+|[+\-*/^(),]/g)||[];const FN=['sin','cos','tan','asin','acos','atan','sqrt','log','ln','abs','exp'];const out=[];
  const isVal=t=>t&&(/^[\d.]/.test(t)||t==='x'||t==='pi'||t==='e'||t===')');
  toks.forEach(t=>{
    if(/^[a-z]+$/.test(t)&&!['x','pi','e',...FN].includes(t)){const parts=[];let r=t;while(r.length){const f=['asin','acos','atan','sqrt','sin','cos','tan','log','abs','exp','ln','pi','x','e'].find(n=>r.startsWith(n));if(!f)throw new Error('Unknown word “'+t+'”');parts.push(f);r=r.slice(f.length);}parts.forEach(p=>{if(isVal(out[out.length-1])&&(isVal(p)||FN.includes(p)))out.push('*');out.push(p);});return;}
    if(isVal(out[out.length-1])&&(isVal(t)&&t!==')'||FN.includes(t)||t==='('))out.push('*');out.push(t);});
  const js=out.map(t=>t==='^'?'**':t==='pi'?'Math.PI':t==='e'?'Math.E':FN.includes(t)?'S.'+t:t).join('');
  const k=deg?Math.PI/180:1;const S={sin:v=>Math.sin(v*k),cos:v=>Math.cos(v*k),tan:v=>Math.tan(v*k),asin:v=>Math.asin(v)/k,acos:v=>Math.acos(v)/k,atan:v=>Math.atan(v)/k,sqrt:Math.sqrt,log:Math.log10,ln:Math.log,abs:Math.abs,exp:Math.exp};
  const f=new Function('x','S','return '+js);f(1.234,S);return x=>f(x,S);
}
function gpRoots(f,a,b){const out=[];const n=600;let px=a,py=f(a);for(let i=1;i<=n;i++){const x=a+(b-a)*i/n,y=f(x);if(isFinite(py)&&isFinite(y)&&py*y<=0&&Math.abs(y-py)<(GP.y[1]-GP.y[0])){let lo=px,hi=x;for(let k=0;k<50;k++){const m=(lo+hi)/2;if(f(lo)*f(m)<=0)hi=m;else lo=m;}const r=(lo+hi)/2;if(!out.some(o=>Math.abs(o-r)<(b-a)/400))out.push(r);}px=x;py=y;}return out;}
function gpTurns(f,a,b){const out=[];const h=(b-a)/2000,d=x=>(f(x+h)-f(x-h))/(2*h);const n=400,o=0.3719;let px=a,pd=d(a+(b-a)*o/n);for(let i=1;i<=n;i++){const x=a+(b-a)*(i+o)/n,dd=d(x);if(x>b)break;if(isFinite(pd)&&isFinite(dd)&&pd*dd<0){let lo=px,hi=x;for(let k=0;k<40;k++){const m=(lo+hi)/2;if(d(lo)*d(m)<=0)hi=m;else lo=m;}const r=(lo+hi)/2,y=f(r);if(isFinite(y)&&Math.abs(y)<1e6)out.push([r,y,pd>0?'max':'min']);}px=x;pd=dd;}return out;}

function gpDraw(){

async function packProgress(){writeNow();savePrefs();const d={};Object.keys(localStorage).filter(k=>k.startsWith('igcse4ec1_')&&!k.endsWith('_backup')).forEach(k=>d[k]=localStorage.getItem(k));
  let bytes=new TextEncoder().encode(JSON.stringify(d)),tag='j';
  if(window.CompressionStream){try{const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(cs).arrayBuffer());tag='z';}catch(e){}}
  let b='';for(let i=0;i<bytes.length;i+=8192)b+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return tag+btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function unpackProgress(code){code=String(code).trim().replace(/^.*#import=/,'').replace(/\s+/g,'');const tag=code[0];let s=code.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
  let bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));if(tag==='z'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(ds).arrayBuffer());}else if(tag!=='j')throw new Error('bad code');
  const d=JSON.parse(new TextDecoder().decode(bytes));if(!d||typeof d!=='object'||!Object.keys(d).every(k=>k.startsWith('igcse4ec1_')))throw new Error('bad data');return d;}

<div class="tr-step"><b>1</b><div><span>Website address</span><input id="tr-url" placeholder="https://your-name.github.io/igcse-0607-hub/" value="${esc(base)}" oninput="prefs.siteUrl=this.value.trim();savePrefs()"></div></div>

async function trCopy(kind){let t=kind==='link'?trLink():window._trCode;if(!t){toast('Enter the website address first (or use “Copy code only”)','info');document.getElementById('tr-url').focus();return;}

  window._imp=d;
  showModal(`<h2>${ico('upload','neon')}Import progress?</h2><p class="rs-desc">This replaces the progress in <b>this</b> browser with the transferred copy: <b>${ticks}</b> checklist ticks and <b>${les}</b> finished lessons.</p><div class="qactions"><button class="btn" onclick="closeModal();history.replaceState(null,'','#home')">Cancel</button><span class="sp"></span><button class="btn pri" onclick="applyImport()">${ico('check')}Import</button></div>`);}

const FS_IN='<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',FS_OUT='<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>';
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function fsCan(el){el=el||document.documentElement;return!!(el.requestFullscreen||el.webkitRequestFullscreen);}
function fsToggle(el){el=el||document.documentElement;if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}if(!fsCan(el))return;try{const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function fsSync(){const on=!!fsEl();document.body.classList.toggle('is-fs',on);document.body.classList.toggle('no-fs',!fsCan());document.querySelectorAll('.fs-btn').forEach(b=>{b.innerHTML=`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${on?FS_OUT:FS_IN}</svg>`;b.title=on?'Exit fullscreen (F)':'Fullscreen (F)';b.setAttribute('aria-label',b.title);});}

/* ════════════════════════════════════════════════════════════

let VZ=null;

  const v=e.target.closest('svg.viz')||(e.target===box?box.querySelector(':scope>svg.viz'):null);if(!v)return;openViz(v,box);});
function openViz(v,box){const sl=box.closest('.slide,.n-card,.card'),h=sl&&sl.querySelector('.s-h,h3,.hd b');const vb=v.viewBox&&v.viewBox.baseVal,ratio=vb&&vb.width?vb.width/vb.height:1.6;
  const o=document.createElement('div');o.className='vzbox';o.innerHTML=`<div class="vz-top"><b>${esc(h?h.textContent.trim():'Diagram')}</b><div class="vz-z"><button data-z="-1" aria-label="Zoom out">−</button><button data-z="0" aria-label="Fit to screen">Fit</button><button data-z="1" aria-label="Zoom in">+</button></div><button class="iconbtn vz-x" aria-label="Close (Esc)">${ico('x')}</button></div><div class="vz-sc"><div class="vz-in"></div></div><div class="vz-hint">Double-tap or use + to zoom · drag to move around · Esc to close</div>`;
  const c=v.cloneNode(true);c.removeAttribute('style');c.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));o.querySelector('.vz-in').appendChild(c);document.body.appendChild(o);document.body.classList.add('vz-open');
  const sc=o.querySelector('.vz-sc'),inn=o.querySelector('.vz-in');let z=1;
  const fit=()=>{const W=sc.clientWidth-24,H=sc.clientHeight-24;return Math.max(200,Math.min(W,H*ratio));};
  const apply=(nz,cx,cy)=>{const old=z;z=Math.max(1,Math.min(4,nz));const f=fit();const px=cx??sc.clientWidth/2,py=cy??sc.clientHeight/2,ax=(sc.scrollLeft+px)/(old||1),ay=(sc.scrollTop+py)/(old||1);inn.style.width=Math.round(f*z)+'px';sc.classList.toggle('zoomed',z>1);sc.scrollLeft=ax*z-px;sc.scrollTop=ay*z-py;o.querySelector('[data-z="0"]').textContent=z>1?Math.round(z*100)+'%':'Fit';};
  apply(1);requestAnimationFrame(()=>o.classList.add('on'));
  o.querySelectorAll('.vz-z button').forEach(b=>b.onclick=()=>apply(+b.dataset.z===0?1:z*(+b.dataset.z>0?1.5:1/1.5)));
  sc.ondblclick=e=>{const r=sc.getBoundingClientRect();apply(z>1?1:2.2,e.clientX-r.left,e.clientY-r.top);};
  let d=null;sc.onpointerdown=e=>{if(z<=1||e.pointerType==='touch')return;d=[e.clientX,e.clientY,sc.scrollLeft,sc.scrollTop];sc.setPointerCapture(e.pointerId);};
  sc.onpointermove=e=>{if(!d)return;sc.scrollLeft=d[2]-(e.clientX-d[0]);sc.scrollTop=d[3]-(e.clientY-d[1]);};sc.onpointerup=sc.onpointercancel=()=>{d=null;};
  sc.onwheel=e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();const r=sc.getBoundingClientRect();apply(z*(e.deltaY<0?1.15:1/1.15),e.clientX-r.left,e.clientY-r.top);};
  const rs=()=>apply(z);addEventListener('resize',rs);
  const close=()=>{removeEventListener('resize',rs);document.removeEventListener('keydown',key,true);o.classList.remove('on');document.body.classList.remove('vz-open');setTimeout(()=>o.remove(),200);VZ=null;};
  const key=e=>{e.stopPropagation();if(e.key==='Escape')close();else if(e.key==='+'||e.key==='=')apply(z*1.5);else if(e.key==='-')apply(z/1.5);else if(e.key==='0')apply(1);};
  document.addEventListener('keydown',key,true);o.querySelector('.vz-x').onclick=close;o.onclick=e=>{if(e.target===o||e.target===sc)close();};VZ={close};}

function mdLite(t){const L=esc(String(t||'')).split('\n');let out='',ul=false;const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])_(\S(?:.*?\S)?)_(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>');
  L.forEach(l=>{const m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!ul){out+='<ul>';ul=true;}out+=`<li${/^\s{2,}/.test(l)?' class="sub"':''}>${inl(m[1])}</li>`;return;}if(ul){out+='</ul>';ul=false;}
    const hm=l.match(/^#{1,3}\s+(.*)/);if(hm){out+=`<h4>${inl(hm[1])}</h4>`;return;}if(l.trim())out+=`<p>${inl(l)}</p>`;});if(ul)out+='</ul>';return out;}

function noteAddSlide(){if(!PL)return;const s=PL.slides[PL.i];if(!s)return;const tx=x=>{const d=document.createElement('div');d.innerHTML=String(x??'');return d.textContent.replace(/\s+/g,' ').trim();};
  const L=['## '+(tx(s.h||s.q)||(s.t==='title'?PL.l.title:s.t==='sum'?'Summary — '+PL.l.title:PL.l.title))];
  (s.pts||[]).forEach(p=>L.push('- '+tx(p)));(s.cards||[]).forEach(c=>L.push('- **'+tx(c[0])+'**: '+tx(c[1])));
  if(s.t==='formula'){if(s.f)L.push('- **'+tx(s.f)+'**');(s.parts||[]).forEach(p=>L.push('  - '+tx(p[0])+' = '+tx(p[1])));if(s.note)L.push('- '+tx(s.note));}
  if(s.t==='mist')(s.rows||[]).forEach(r=>L.push('- ✗ '+tx(r[0])+' → ✓ '+tx(r[1])+(r[2]?' ('+tx(r[2])+')':'')));
  if(s.t==='ex'){L.push('- Q: '+tx(s.q));(s.steps||[]).forEach(st=>L.push('  - '+tx(st)));if(s.ans)L.push('- **Answer:** '+tx(s.ans));}
  if(s.t==='quiz'||s.t==='input'){const a=s.t==='quiz'?(s.opts||[])[s.a]:s.ans;if(a!=null)L.push('- **Answer:** '+tx(Array.isArray(a)?a[0]:typeof a==='object'?(a.txt||[])[0]||'':a));if(s.why)L.push('- '+tx(s.why));}
  if(s.txt){const d=document.createElement('div');d.innerHTML=s.txt;const li=[...d.querySelectorAll('li')];if(li.length)li.forEach(x=>L.push('- '+tx(x.innerHTML)));else L.push('- '+tx(s.txt));}
  if(s.cap)L.push('- '+tx(s.cap));
  if(L.length<2){toast('Nothing to copy on this slide — type your own note','info');return;}
  const ta=document.getElementById('pn-ta');if(!ta)return;ta.value=(ta.value.trim()?ta.value.replace(/\s+$/,'')+'\n\n':'')+L.join('\n')+'\n';noteInput(ta);ta.scrollTop=ta.scrollHeight;toast('Slide added to your notes','check');}

function chainStart(box,idx){const solved=wGet().c||{};const pool=CHAINS.map((c,i)=>i);const i=idx!=null?idx:(pool.find(j=>!solved[j])??Math.floor(Math.random()*CHAINS.length));const c=CHAINS[i];
  const order=c.s.map((_,j)=>j);for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  if(order.every((v,j)=>v===j))order.reverse();CH={i,c,order,picked:[]};const l=lessonByKey(c.k);
  box.innerHTML=`<div class="card qcard"><div class="qmeta"><span class="qtopic" style="--c:${colorOf(l.ti)}">${ico(TICON[l.ti])}${esc(l.T.name)}</span><span>Chain ${i+1} of ${CHAINS.length}</span>${solved[i]?'<span class="tag tag-g">SOLVED</span>':''}</div><div class="qtext"><b>${esc(c.t)}</b> — tap the steps in the right order, from cause to final effect.</div>
