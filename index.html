@media(max-width:980px){.gp-layout{grid-template-columns:1fr}.gp-side{position:static}.test-opts{grid-template-columns:1fr}}
@media(max-width:860px){.pl-notes{top:10px;right:10px;bottom:10px}.s-hi{width:34px;height:34px}.s-hi .ic{width:19px;height:19px}.test-res{flex-direction:column;text-align:center}}

/* ════════════════════════════════════════════════════════════
   LAYER 3 — premium finish, floating timer, progress & achievements
════════════════════════════════════════════════════════════ */
/* ambient background */
body{background:radial-gradient(1100px 600px at 85% -10%,color-mix(in srgb,var(--brand) 9%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 110%,color-mix(in srgb,var(--ext) 7%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
body{opacity:0;transition:opacity .45s ease}
html.no-motion body{opacity:1}
body.loaded{opacity:1}
::selection{background:color-mix(in srgb,var(--brand2) 35%,transparent)}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:8px}
h1,h2,h3,.tc-name,.n-title{text-wrap:balance}
.ph h1,.hero h1{letter-spacing:-.03em}

/* sidebar finish */
.sb{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 5%,var(--surface)) 0%,var(--surface) 30%);box-shadow:1px 0 0 var(--line),8px 0 30px -20px rgba(0,0,0,.25)}
.sb-icon{position:relative;animation:logoGlow 4s ease-in-out infinite}
@keyframes logoGlow{50%{box-shadow:0 6px 22px -4px rgba(124,58,237,.75)}}
.sb-ext{background:linear-gradient(90deg,var(--ext-soft),var(--brand-soft));border:1px solid color-mix(in srgb,var(--ext) 25%,transparent)}
.nav-ind{box-shadow:inset 3px 0 0 var(--nc,var(--brand)),0 0 22px -8px var(--nc,var(--brand))}

/* cards: spotlight that follows the cursor + crisper borders */
.card,.tile{background-image:radial-gradient(520px circle at var(--mx,-999px) var(--my,-999px),color-mix(in srgb,var(--c,var(--brand2)) 7%,transparent),transparent 42%)}
.card{border-color:color-mix(in srgb,var(--line) 85%,transparent)}
.card:hover,.tile:hover{border-color:color-mix(in srgb,var(--c,var(--brand2)) 30%,var(--line))}
.stat{overflow:hidden}
.stat::after{content:'';position:absolute;inset:auto -20% -60% auto;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c,var(--brand)) 10%,transparent),transparent 70%);pointer-events:none}

/* buttons: sheen + ripple */
.btn,.pr-mode,.qopt,.chip{position:relative;overflow:hidden;isolation:isolate}
.btn.pri,.btn.good{background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0));box-shadow:0 6px 16px -8px color-mix(in srgb,var(--brand) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.good{box-shadow:0 6px 16px -8px color-mix(in srgb,var(--good) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri::before{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .7s var(--ease);z-index:-1}
.btn.pri:hover::before{left:140%}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none;z-index:-1}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* scroll reveal */
.sec.rv{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.sec.rv.in{opacity:1;transform:none}
@media print{.sec.rv{opacity:1!important;transform:none!important}.ftm{display:none!important}}

/* checkbox pop */
.chk input:checked{animation:tick .35s var(--spring)}
@keyframes tick{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.chk{transition:background .2s}
.chk.done label{transition:color .3s}

/* lesson player: cinematic slide changes */
.slide.on{animation:slideIn .6s var(--ease)}
.slide.back.on{animation:slideBack .6s var(--ease)}
@keyframes slideIn{from{opacity:0;transform:translateX(48px) scale(.975);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-48px) scale(.975);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.build{transition:opacity .5s var(--ease),transform .5s var(--ease)}
.slide{box-shadow:0 30px 70px -35px rgba(20,20,60,.45),0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent)}
.pl-prog i{box-shadow:0 0 12px var(--brand2)}
.pl-dots i{transition:all .35s var(--spring)}

/* hero shine */
.hero{box-shadow:0 30px 60px -30px rgba(67,56,202,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.hero .ring svg{filter:drop-shadow(0 0 10px rgba(255,255,255,.35))}

/* toast as glass */
.toast{background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px 16px;bottom:96px}

/* ── floating focus timer ── */
.ftm{position:fixed;z-index:1600;width:262px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px -18px rgba(10,10,40,.45),0 0 0 1px rgba(255,255,255,.03) inset;transition:width .45s var(--spring),border-radius .45s var(--spring),box-shadow .3s,top .35s var(--ease),bottom .35s var(--ease),left .35s var(--ease),right .35s var(--ease);overflow:hidden}
.ftm[data-pos="br"]{right:20px;bottom:20px}.ftm[data-pos="bl"]{left:calc(var(--sidebar) + 20px);bottom:20px}.ftm[data-pos="tr"]{right:20px;top:20px}.ftm[data-pos="tl"]{left:calc(var(--sidebar) + 20px);top:20px}
body.in-player .ftm{top:11px!important;right:156px!important;bottom:auto!important;left:auto!important;width:132px;border-radius:999px}
body.in-player .ftm .ftm-full{display:none}
body.in-player .ftm .ftm-mini{display:flex;padding:4px 6px 4px 7px}
body.in-player .ftm .tm-ring{width:24px;height:24px}
body.in-player .ftm .tmr-drag{cursor:pointer}
@media(max-width:860px){body.in-player .ftm{display:none}}
body.printing .ftm{display:none}
.ftm.dragging{transition:none;cursor:grabbing;box-shadow:0 30px 70px -20px rgba(10,10,40,.6)}
.ftm.run{border-color:color-mix(in srgb,var(--brand2) 45%,var(--line));box-shadow:0 18px 50px -18px rgba(10,10,40,.45),0 0 0 3px color-mix(in srgb,var(--brand2) 14%,transparent),0 0 40px -12px var(--brand2)}
.ftm.brk.run{border-color:color-mix(in srgb,var(--good) 45%,var(--line));box-shadow:0 18px 50px -18px rgba(10,10,40,.45),0 0 40px -12px var(--good)}
.ftm-full{padding:12px 13px 12px}
.tmr-drag{cursor:grab;user-select:none;touch-action:none}
.ftm .tmr-top{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.ftm .tmr-top>.ic{width:15px;height:15px;color:var(--brand2);filter:var(--glow)}
.ftm.brk .tmr-top>.ic{color:var(--good)}
.ftm .tmr-mode{flex:1}
.iconbtn.xs{width:24px;height:24px;border-radius:7px;border:none;background:transparent}
.iconbtn.xs .ic{width:15px;height:15px}
.iconbtn.xs:hover{background:var(--surface3)}
.ftm .tmr-row{display:flex;align-items:center;gap:7px;margin-top:6px}
.ftm .tmr-time{flex:1;font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.ftm.run .tmr-time{color:var(--brand2);text-shadow:0 0 20px color-mix(in srgb,var(--brand2) 50%,transparent)}
.ftm.brk.run .tmr-time{color:var(--good);text-shadow:0 0 20px color-mix(in srgb,var(--good) 50%,transparent)}
.ftm .tmr-play{background:var(--brand);border-color:var(--brand);color:#fff;width:38px;height:38px;border-radius:12px;box-shadow:0 6px 16px -6px var(--brand)}
.ftm.brk .tmr-play{background:var(--good);border-color:var(--good);box-shadow:0 6px 16px -6px var(--good)}
.ftm .tmr-play:hover{color:#fff;filter:brightness(1.12)}
.ftm .tmr-bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.ftm .tmr-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ext));transition:width 1s linear;box-shadow:0 0 8px var(--brand2)}
.ftm.brk .tmr-bar i{background:var(--good)}
.tmr-xprow{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:11.5px;color:var(--ink3)}
.tmr-xprow span{white-space:nowrap}.tmr-xprow b{color:var(--ink)}
.tmr-xpbar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.tmr-xpbar i{display:block;height:100%;width:0;background:var(--good);transition:width .8s var(--ease)}
.ftm-mini{display:none;align-items:center;gap:8px;padding:7px 8px 7px 9px}
.ftm.min{width:156px;border-radius:999px}
.ftm.min .ftm-full{display:none}
.ftm.min .ftm-mini{display:flex;animation:openIn .35s var(--ease)}
.ftm-mini .tmr-time{font-family:var(--mono);font-size:15px;font-weight:700;flex:1;color:var(--ink);font-variant-numeric:tabular-nums}
.ftm.run .ftm-mini .tmr-time{color:var(--brand2)}
.tm-ring{width:30px;height:30px;transform:rotate(-90deg);flex-shrink:0}
.tm-ring-bg{fill:none;stroke:var(--line);stroke-width:3.5}
.tm-ring-fill{fill:none;stroke:var(--brand2);stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 3px var(--brand2))}
.ftm.brk .tm-ring-fill{stroke:var(--good)}
.ftm-mini .tmr-play{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;border:none}
.ftm-mini .tmr-play .ic{width:13px;height:13px}
@media(max-width:860px){.ftm[data-pos="bl"],.ftm[data-pos="tl"]{left:12px}.ftm[data-pos="br"],.ftm[data-pos="tr"]{right:12px}.ftm[data-pos^="b"]{bottom:12px}}

/* ── home: goal ring, achievements ── */
.goal .ring .lbl{flex-direction:column}

@keyframes shine{0%,70%{left:-60%}100%{left:140%}}

/* ── progress page ── */
.lvl{display:flex;align-items:center;gap:12px;margin-top:14px;max-width:460px}

.srow{display:grid;grid-template-columns:auto 1.1fr 2fr auto auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);transition:background .2s}

/* misc refinements */

::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink4) 40%,transparent);border:2px solid transparent;background-clip:padding-box}

.menu-btn{margin-left:auto}
.sb-logo{gap:10px}

.btn.full{width:100%;margin-top:14px}
.mn-foot{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--ink4);padding-top:14px;line-height:1.5}

/* ════════════════════════════════════════════════════════════
   STUDY HUB SYNC — keeps progress in step across devices.
   Every app and the dashboard include this file. It records when each
   progress key changes, and syncs with /api/sync (Vercel + Redis):
   pull → merge (never loses ticks, lessons, notes, cards…) → push.
   Config lives in localStorage 'hub_sync' = {url, code} on each device.
════════════════════════════════════════════════════════════ */
(function(){
  if(window.HUBSYNC)return;
  const LS=window.localStorage;if(!LS)return;
  const CFG='hub_sync',META='hub_sync_meta',STATE='hub_sync_state';
  const _set=Storage.prototype.setItem,_rm=Storage.prototype.removeItem;
  /* which keys travel between devices */
  const tracked=k=>/^(igcse|gcse)[0-9a-z]+_|^hub_/.test(k)&&!/(_backup|_splash|_vztip)$/.test(k)&&![CFG,META,STATE].includes(k);
  const J=s=>{try{return JSON.parse(s);}catch(e){return undefined;}};
  const cfg=()=>J(LS.getItem(CFG))||{};
  let meta=J(LS.getItem(META))||{};const saveMeta=()=>_set.call(LS,META,JSON.stringify(meta));
  const setState=o=>{const s=Object.assign(J(LS.getItem(STATE))||{},o);_set.call(LS,STATE,JSON.stringify(s));paint();};
  const state=()=>J(LS.getItem(STATE))||{};
  /* record local changes */
  Storage.prototype.setItem=function(k,v){_set.call(this,k,v);if(this===LS&&tracked(k)){meta[k]=Date.now();saveMeta();soon();}};
  Storage.prototype.removeItem=function(k){_rm.call(this,k);if(this===LS&&tracked(k)){meta[k]=Date.now();saveMeta();}};

  /* ── merge rules ── */
  const LOCAL_PREFS=['theme','fs','rm','tmin','sound','last','welcomed','fxFilter','hideDone','tmPos','big'];
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  function unionObj(a,b,pick){const o=Object.assign({},a);for(const k in b){o[k]=k in a?pick(a[k],b[k],k):b[k];}return o;}
  function merge(key,lv,rv,localNewer,first){
    if(lv==null)return rv;if(rv==null)return lv;if(lv===rv)return lv;
    const L=J(lv),R=J(rv);if(L===undefined||R===undefined)return localNewer&&!first?lv:rv;if(first)localNewer=false;
    const N=localNewer?L:R,O=localNewer?R:L;let m;const suf=key.replace(/^[a-z0-9]+_/,'');
    if(suf==='v4'&&isObj(L)&&isObj(R)){const NC=N.checked||{};m=Object.assign({},N,{checked:Object.assign({},O.checked||{},NC)});for(const k in (O.checked||{}))if(O.checked[k]&&NC[k]!==false)m.checked[k]=true;} /* an explicit false (unticked) on the newer copy wins */
    else if(suf==='lessons'&&isObj(L)&&isObj(R))m=unionObj(N,O,(a,b)=>{const o=Object.assign({},b,a,{s:Math.max(a.s||0,b.s||0),done:(a.done||b.done)?1:undefined});['ru','rd'].forEach(f=>{const v=Math.max(a[f]||0,b[f]||0);if(v)o[f]=v;else delete o[f];});return o;}); /* ru/rd = redo untick/re-tick counters */
    else if(suf==='practice'&&isObj(L)&&isObj(R))m=unionObj(N,O,(a,b)=>((b.n||0)>(a.n||0)||((b.n||0)===(a.n||0)&&(b.c||0)>(a.c||0)))?b:a);
    else if(suf==='cards'&&isObj(L)&&isObj(R))m=unionObj(N,O,(a,b)=>{const d=x=>isObj(x)?(x.d||0):0;return d(b)>d(a)?b:a;});
    else if(suf==='study'&&isObj(L)&&isObj(R)){m=Object.assign({},O,N);m.days=unionObj(N.days||{},O.days||{},(a,b)=>{const o=Object.assign({},a);for(const f in b)if(typeof b[f]==='number')o[f]=Math.max(a[f]||0,b[f]);else if(!(f in o))o[f]=b[f];return o;});
      m.best=Math.max(N.best||0,O.best||0);if(Array.isArray(N.ach)||Array.isArray(O.ach))m.ach=[...new Set([...(N.ach||[]),...(O.ach||[])])];}
    else if(suf==='lnotes'&&isObj(L)&&isObj(R))m=unionObj(N,O,(a,b)=>{if(a===b||!b)return a;if(!a)return b;if(a.includes(b))return a;if(b.includes(a))return b;return a.replace(/\s+$/,'')+'\n\n— also written on another device —\n'+b;});
    else if(suf==='seen'&&Array.isArray(L)&&Array.isArray(R))m=[...new Set([...O,...N])].slice(-3000);
    else if(suf==='prefs'&&isObj(L)&&isObj(R)){m=Object.assign({},O,N);for(const f in O)if((m[f]===''||m[f]==null)&&O[f]!==''&&O[f]!=null)m[f]=O[f];LOCAL_PREFS.forEach(f=>{if(f in L)m[f]=L[f];else delete m[f];});if(L.firstSeen||R.firstSeen)m.firstSeen=Math.min(L.firstSeen||Infinity,R.firstSeen||Infinity);}
    else if(suf==='tprep'&&isObj(L)&&isObj(R))m=unionObj(N,O,(a,b)=>isObj(a)&&isObj(b)?unionObj(a,b,x=>x):a); /* 26 Oct: test-prep packs, merged per item */
    else if(suf==='written'&&isObj(L)&&isObj(R))m=unionObj(N,O,(a,b)=>isObj(a)&&isObj(b)?unionObj(a,b,x=>x):a); /* 21 Oct: merge marks/drafts/blurts per question, not per device */
    else if(isObj(L)&&isObj(R)&&['papers','wa','wc','written'].includes(suf))m=unionObj(N,O,a=>a);
    else if(Array.isArray(L)&&Array.isArray(R)){ /* lists (mistakes, bookmarks, exams): newest wins — but a first sync or an empty list never wipes the other */
      if(first||!N.length){const seen=new Set();m=[...R,...L].filter(x=>{const k=JSON.stringify(x);if(seen.has(k))return false;seen.add(k);return true;});}else return localNewer?lv:rv;}
    else return localNewer?lv:rv; /* everything else: newest wins */
    return JSON.stringify(m);}

  /* ── network ── */
  function endpoint(){const c=cfg();let u=(c.url||'').trim().replace(/\/+$/,'');if(!u&&/^https?:/.test(location.protocol))u=location.origin;return u?u+'/api/sync':'';}
  async function api(method,body){const ep=endpoint(),c=cfg();if(!ep||!c.code)throw new Error('not set up');
    const r=await fetch(ep,{method,headers:{'content-type':'application/json','x-sync-code':c.code},body:body?JSON.stringify(body):undefined,cache:'no-store'});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;}
  let busy=false,again=false,timer=null,changedLocal=false;
  function soon(ms){if(!cfg().code)return;clearTimeout(timer);timer=setTimeout(run,ms??4000);}
  async function run(){if(busy){again=true;return;}if(!cfg().code){setState({status:'off'});return;}if(navigator.onLine===false){setState({status:'offline'});return;}
    busy=true;const first=!state().last;setState({status:'syncing'});
    try{const remote=(await api('GET')).keys||{};const push={};let pulled=0;
      const keys=new Set(Object.keys(remote));for(let i=0;i<LS.length;i++){const k=LS.key(i);if(tracked(k))keys.add(k);}
      keys.forEach(k=>{const lv=LS.getItem(k),r=remote[k]||null,rv=r?r.v:null,lt=meta[k]||0,rt=r?r.t||0:0;
        const m=merge(k,lv,rv,lt>=rt,first);const t=Math.max(lt,rt,m!==rv&&m!==lv?Date.now():0);
        if(m!=null&&m!==lv){_set.call(LS,k,m);meta[k]=t;pulled++;}
        if(m!=null&&m!==rv)push[k]={v:m,t:Math.max(t,lt)};});
      saveMeta();if(Object.keys(push).length)await api('POST',{set:push});
      setState({status:'ok',last:Date.now(),err:''});if(pulled){changedLocal=true;applyRemote();}}
    catch(e){setState({status:e.message==='not set up'?'off':'error',err:String(e.message||e)});}
    finally{busy=false;if(again){again=false;soon(1500);}}}
  /* new data arrived: refresh the page when it is safe (not mid-lesson / typing) */
  function safe(){const a=document.activeElement;return!/^#lesson\//.test(location.hash)&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&!document.querySelector('.vzbox,.m3d.pfs');}
  function applyRemote(){if(!changedLocal)return;if(typeof window.hubRender==='function'){changedLocal=false;window.hubRender();return;}
    if(!safe())return;const last=+sessionStorage.getItem('hub_sync_reload')||0;if(Date.now()-last<15000)return;
    changedLocal=false;sessionStorage.setItem('hub_sync_reload',String(Date.now()));location.reload();}
  addEventListener('hashchange',()=>setTimeout(applyRemote,300));document.addEventListener('focusout',()=>setTimeout(applyRemote,500));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')soon(300);else if(cfg().code){clearTimeout(timer);run();}});
  addEventListener('online',()=>soon(300));setInterval(()=>{if(document.visibilityState==='visible')soon(0);},120000);

  /* ── status pill in each app's sidebar + dashboard button ── */
  function ago(t){if(!t)return'';const s=Math.round((Date.now()-t)/1000);return s<60?'just now':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago';}
  function paint(){const st=state(),on=!!cfg().code;const txt=!on?'Progress saved in this browser':st.status==='syncing'?'Syncing…':st.status==='ok'?'Synced across devices · '+ago(st.last):st.status==='offline'?'Offline — will sync later':st.status==='error'?'Sync problem — tap to check':'Progress saved in this browser';
    const t=document.getElementById('save-txt');if(t){t.textContent=txt;const p=document.getElementById('save-pill');if(p){p.classList.toggle('sync-err',on&&st.status==='error');p.style.cursor=on?'pointer':'';p.onclick=on?()=>openSettings():null;}}
    document.querySelectorAll('.sync-btn').forEach(b=>{b.dataset.s=on?st.status||'':'off';b.title=on?'Sync: '+txt:'Set up sync between your devices';});}
  setInterval(paint,30000);

  /* ── settings dialog (used by the dashboard; apps open it from the status pill) ── */
  function openSettings(){const c=cfg(),st=state(),hosted=/^https?:/.test(location.protocol);
    const d=document.createElement('div');d.className='sync-dlg';d.innerHTML=`<div class="sync-box" role="dialog" aria-label="Sync settings"><div class="sync-hd"><b>Sync between devices</b><button class="sync-x" aria-label="Close">✕</button></div>
      <p class="sync-p">Your progress, notes and flashcards follow you between this computer and your phone. Use the <b>same sync code</b> on every device.</p>
      <label class="sync-l">Website address${hosted?' (leave empty on the website itself)':''}<input class="sync-i" id="sy-url" type="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://your-study-hub.vercel.app" value="${(c.url||'').replace(/"/g,'&quot;')}"></label>
      <label class="sync-l">Sync code<input class="sync-i" id="sy-code" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="the code you set in Vercel" value="${(c.code||'').replace(/"/g,'&quot;')}"></label>
      <div class="sync-st" id="sy-st">${c.code?(st.status==='ok'?'✓ Synced '+ago(st.last):st.status==='error'?'⚠ '+(st.err||'Sync problem'):st.status||''):'Not set up on this device yet.'}</div>
      <div class="sync-row">${c.code?'<button class="sync-b" id="sy-off">Turn off on this device</button>':''}<span style="flex:1"></span><button class="sync-b pri" id="sy-go">${c.code?'Save & sync now':'Connect'}</button></div></div>`;
    document.body.appendChild(d);const close=()=>d.remove();d.querySelector('.sync-x').onclick=close;d.onclick=e=>{if(e.target===d)close();};
    const stEl=d.querySelector('#sy-st');
    d.querySelector('#sy-go').onclick=async()=>{const url=d.querySelector('#sy-url').value.trim(),code=d.querySelector('#sy-code').value.trim();
      if(!code){stEl.textContent='Enter your sync code.';return;}if(!hosted&&!url){stEl.textContent='Enter the website address (your Vercel link).';return;}
      _set.call(LS,CFG,JSON.stringify({url,code}));stEl.textContent='Connecting…';
      try{await api('GET');stEl.textContent='Connected — syncing…';await run();const s2=state();stEl.textContent=s2.status==='ok'?'✓ Synced. You can close this.':'⚠ '+(s2.err||'Sync problem');}
      catch(e){stEl.textContent='⚠ '+(e.message==='Failed to fetch'?'Could not reach the website — check the address and your internet.':e.message==='wrong code'?'That sync code is not right.':e.message);}};
    const off=d.querySelector('#sy-off');if(off)off.onclick=()=>{_rm.call(LS,CFG);setState({status:'off'});close();};}

  const css=`.sync-dlg{position:fixed;inset:0;z-index:10060;background:rgba(5,8,20,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.sync-box{width:min(440px,100%);background:var(--surface,#151826);color:var(--ink,#e5e7eb);border:1px solid var(--line,rgba(255,255,255,.12));border-radius:20px;padding:18px 18px 16px;box-shadow:0 30px 80px rgba(0,0,0,.45);font:14px/1.5 inherit}
.sync-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.sync-hd b{font-size:17px}
.sync-x{border:0;background:transparent;color:inherit;font-size:16px;cursor:pointer;width:32px;height:32px;border-radius:9px}
.sync-p{color:var(--ink2,#b6bccb);font-size:13.5px;margin:0 0 12px}
.sync-l{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink2,#b6bccb);margin-bottom:10px}
.sync-i{height:40px;border-radius:11px;border:1px solid var(--line,rgba(255,255,255,.15));background:var(--surface2,rgba(255,255,255,.05));color:inherit;padding:0 12px;font:inherit;font-size:14px}
.sync-st{min-height:20px;font-size:13px;color:var(--ink2,#b6bccb);margin:2px 0 12px}
.sync-row{display:flex;gap:8px;align-items:center}
.sync-b{border:1px solid var(--line,rgba(255,255,255,.15));background:var(--surface2,rgba(255,255,255,.06));color:inherit;font:inherit;font-weight:700;font-size:13px;padding:9px 14px;border-radius:11px;cursor:pointer}
.sync-b.pri{background:#6366f1;border-color:#6366f1;color:#fff}
#save-pill.sync-err{color:#f87171}`;
  const st=document.createElement('style');st.textContent=css;(document.head||document.documentElement).appendChild(st);

  window.HUBSYNC={run,soon,openSettings,merge,tracked,status:state};
  const start=()=>{paint();if(cfg().code)soon(200);};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

/* 21 Oct 2026 — window title-bar colour: installed (standalone) windows paint their title bar with
   <meta name="theme-color">. Match it to the page background (light or dark) so no coloured strip shows. */
(function(){if(typeof document==='undefined')return;
  function bg(el){try{var c=getComputedStyle(el).backgroundColor;return(c&&c!=='transparent'&&!/rgba\(.*,\s*0\)$/.test(c))?c:'';}catch(e){return'';}}
  function upd(){var c=bg(document.body||document.documentElement)||bg(document.documentElement);if(!c)return;
    var ms=document.querySelectorAll('meta[name="theme-color"]');if(!ms.length){var m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m);ms=[m];}
    for(var i=0;i<ms.length;i++){ms[i].removeAttribute('media');ms[i].setAttribute('content',c);}}
  function start(){upd();setTimeout(upd,300);try{new MutationObserver(function(){setTimeout(upd,30);}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});
    if(document.body)new MutationObserver(function(){setTimeout(upd,30);}).observe(document.body,{attributes:true,attributeFilter:['data-theme','class']});}catch(e){}
    try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){setTimeout(upd,30);});}catch(e){}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();})();

const GLOSSARY=[
['ep:0','Scarcity','The situation where there are unlimited wants but finite (limited) resources to satisfy them.'],

['ep:0','Opportunity cost','The next best alternative given up (forgone) when a choice is made.'],
['ep:0','Economic agents','The decision makers in an economy: consumers, producers (firms) and the government.'],
['ep:0','Consumer','A person or organisation that buys and uses goods and services.'],
['ep:0','Producer','A person or business that makes goods or provides services to sell.'],
['ep:0','Needs','Goods and services essential for survival, such as food, water and shelter.'],
['ep:0','Wants','Goods and services people would like to have but do not need to survive.'],

['ep:1','Productive potential','The maximum output an economy can produce with its existing resources and technology.'],
['ep:1','Efficient point','A point on the PPC, where all resources are fully employed.'],
['ep:1','Inefficient point','A point inside the PPC, showing that some resources are unemployed or used wastefully.'],
['ep:1','Unobtainable point','A point outside the PPC that cannot be produced with current resources and technology.'],
['ep:2','Positive economic growth','An increase in the productive potential of an economy, shown by an outward shift of the PPC.'],

['ep:2','Investment','Spending on capital goods, such as machinery and buildings, to increase future production.'],
['ep:3','Utility','The satisfaction or benefit a consumer gets from consuming a good or service.'],
['ep:3','Profit maximisation','The objective of producing the output where the difference between total revenue and total cost is greatest.'],
['ep:3','Revenue maximisation','The objective of making total revenue (sales value) as large as possible, even if profit is lower.'],
['ep:3','Sales maximisation','The objective of selling the largest possible quantity of output, for example to gain market share.'],
['ep:3','Habitual behaviour','Buying the same products out of habit, without comparing all the alternatives.'],

['sd:0','Effective demand','A want for a good that is backed by the ability to pay.'],
['sd:0','Demand curve','A graph showing the quantity demanded at each price; it slopes downwards from left to right.'],

['sd:0','Demographic change','A change in the size or structure (e.g. age) of the population.'],
['sd:1','Supply','The quantity of a good or service that producers are willing and able to sell at a given price over a given period of time.'],

['mx:0','Market economy','An economy where resources are allocated by the price mechanism with little government intervention.'],
['mx:0','Planned economy','An economy where the government decides what, how and for whom to produce.'],
['mx:0','Merit good','A good that is under-consumed in a free market because people underestimate its benefits, e.g. education.'],
['mx:1','Market failure','When the free market leads to an inefficient allocation of resources.'],
['mx:1','Public good','A good that is non-excludable and non-rival, so the private sector will not provide it, e.g. street lighting.'],
['mx:1','Non-excludable','People cannot be prevented from using the good once it is provided, even if they have not paid.'],
['mx:1','Non-rival','One person using the good does not reduce the amount available for others.'],
['mx:1','Free rider problem','People use a good without paying for it, so firms cannot charge and will not provide it.'],
['mx:2','Privatisation','The transfer of ownership of a business from the public sector to the private sector.'],
['mx:2','Nationalisation','The transfer of ownership of a business from the private sector to the public sector.'],
['mx:2','Natural monopoly','An industry where one firm can supply the whole market at lower cost than several firms, e.g. water pipes.'],
['mx:3','Externality','A cost or benefit to a third party that is not reflected in the market price.'],
['mx:3','External cost','A cost suffered by a third party, not paid for by the producer or consumer who causes it, e.g. pollution.'],
['mx:3','External benefit','A benefit enjoyed by a third party who did not pay for it, e.g. less disease from vaccinations.'],
['mx:3','Private cost','The cost of an activity paid by the producer or consumer who carries it out.'],
['mx:3','Social cost','The total cost of an activity to society: private costs + external costs.'],
['mx:3','Private benefit','The benefit of an activity received by the person or firm who carries it out.'],
['mx:3','Social benefit','The total benefit of an activity to society: private benefits + external benefits.'],
['mx:3','Third party','A person or group not directly involved in an economic transaction who is affected by it.'],
['pc:0','Factors of production','The resources used to produce goods and services: land, labour, capital and enterprise.'],
['pc:0','Land','All natural resources, such as minerals, forests, water and the land itself. Its reward is rent.'],
['pc:0','Labour','The human effort, physical and mental, used in production. Its reward is wages.'],
['pc:0','Capital','Man-made resources used to produce other goods, such as machinery, tools and buildings. Its reward is interest.'],
['pc:0','Enterprise','The skill of organising the other factors of production and taking risks. Its reward is profit.'],
['pc:0','Primary sector','The part of the economy that extracts raw materials, e.g. farming, fishing, mining.'],
['pc:0','Secondary sector','The part of the economy that manufactures goods and constructs buildings.'],
['pc:0','Tertiary sector','The part of the economy that provides services, e.g. banking, retail, tourism, teaching.'],
['pc:0','Deindustrialisation','The decline in the importance of the secondary (manufacturing) sector in an economy.'],
['pc:1','Productivity','Output per unit of input per period of time, e.g. output per worker per hour.'],
['pc:1','Labour productivity','The output produced per worker (or per hour worked).'],
['pc:1','Human capital','The skills, knowledge and experience of the workforce.'],
['pc:1','Irrigation','Supplying water to farmland through channels or pipes to raise crop yields.'],
['pc:1','Land reclamation','Creating new usable land, e.g. by draining marshes or reclaiming land from the sea.'],
['pc:2','Division of labour','When production is split into separate tasks, with each worker specialising in one task.'],
['pc:2','Specialisation','Concentrating on producing a limited range of goods or tasks.'],
['pc:3','Total revenue (TR)','Price × quantity sold.'],
['pc:3','Fixed costs','Costs that do not change with output, e.g. rent, insurance, salaries.'],
['pc:3','Variable costs','Costs that change directly with output, e.g. raw materials, packaging, energy for machines.'],
['pc:3','Total cost (TC)','Total fixed costs + total variable costs.'],
['pc:3','Average cost (AC)','Total cost divided by output; the cost per unit.'],
['pc:3','Profit','Total revenue minus total cost.'],
['pc:3','Loss','When total cost is greater than total revenue.'],
['pc:4','Economies of scale','The fall in average costs as a business increases its scale of production.'],
['pc:4','Internal economies of scale','Falls in average cost that come from the growth of the business itself.'],
['pc:4','External economies of scale','Falls in average cost that come from the growth of the industry or the area the business is in.'],
['pc:4','Purchasing economies','Lower average costs from bulk buying raw materials at a discount.'],
['pc:4','Marketing economies','Lower average advertising cost per unit, because the cost is spread over more output.'],
['pc:4','Technical economies','Lower average costs from using larger, more advanced machinery and production methods.'],
['pc:4','Financial economies','Large firms can borrow more cheaply, at lower interest rates, because they are seen as less risky.'],
['pc:4','Managerial economies','Large firms can employ specialist managers, increasing efficiency.'],
['pc:4','Risk-bearing economies','Large firms can spread risk by selling many products in many markets.'],
['pc:5','Diseconomies of scale','The rise in average costs as a business becomes too large.'],
['pc:5','Bureaucracy','Too many layers of management and too much paperwork, slowing down decisions.'],
['pc:5','Long run average cost curve (LRAC)','A U-shaped curve showing how average cost changes as a firm changes its scale of production.'],
['pc:5','Optimum output','The level of output at which average cost is lowest — the most efficient scale.'],
['cl:0','Competition','Rivalry between firms selling similar products to the same customers.'],
['cl:0','Efficiency','Making the best use of scarce resources, producing at the lowest possible cost.'],
['cl:0','Innovation','Developing new products or new ways of producing.'],
['cl:0','Market share','The percentage of total sales in a market made by one business.'],
['cl:1','Takeover','When one company buys enough shares in another to gain control of it.'],
['cl:1','Merger','When two businesses agree to join together to form one larger business.'],
['cl:1','Niche market','A small, specialised segment of a larger market.'],
['cl:1','Access to finance','How easily a business can raise money, e.g. bank loans or selling shares.'],
['cl:2','Monopoly','A market dominated by one business.'],
['cl:2','Price-maker','A firm with enough market power to set its own price.'],
['cl:2','Barriers to entry','Obstacles that make it difficult for new firms to enter a market.'],
['cl:2','Patent','A legal right that stops other firms copying an invention for a number of years.'],
['cl:2','Legal barriers','Laws or licences that give one firm the sole right to supply a market.'],
['cl:3','Oligopoly','A market dominated by a few large firms.'],
['cl:3','Collusion','When firms agree to work together, e.g. to fix prices or share out the market.'],
['cl:3','Cartel','A formal agreement between firms to fix prices or limit output, e.g. OPEC.'],
['cl:3','Non-price competition','Competing through advertising, branding, quality or customer service rather than price.'],
['cl:3','Price war','When firms repeatedly cut prices to try to win customers from rivals.'],
['cl:3','Concentration ratio','The market share of the largest few firms in an industry.'],
['cl:4','Derived demand','When demand for a factor of production (e.g. labour) comes from the demand for the product it makes.'],
['cl:4','Demand for labour','The number of workers firms are willing and able to employ at a given wage rate.'],
['cl:4','Supply of labour','The number of workers willing and able to work at a given wage rate.'],
['cl:4','Labour force participation','The proportion of people of working age who are in work or looking for work.'],
['cl:4','Geographical mobility','The ability of workers to move to a different area to find work.'],
['cl:4','Occupational mobility','The ability of workers to move to a different type of job.'],
['cl:5','Wage rate','The price of labour — the payment per hour or per week for work.'],
['cl:5','Trade union','An organisation of workers that aims to improve pay and working conditions for its members.'],
['cl:5','Collective bargaining','Negotiation between a trade union and employers over pay and conditions for a group of workers.'],
['cl:5','Industrial action','Action taken by workers to put pressure on employers, e.g. strikes or overtime bans.'],
['gi:0','Regulation','Rules set by the government that limit what firms or consumers are allowed to do.'],
['gi:0','Fine','A financial penalty imposed on a firm or person for breaking the law.'],
['gi:0','Pollution permits','Permits that allow a firm to emit a set amount of pollution; they can be bought and sold.'],
['gi:0','Tradable permits','Permits to pollute that firms can sell to others if they pollute less than their allowance.'],
['gi:1','Competition authority','A government body that investigates monopolies, mergers and anti-competitive behaviour.'],
['gi:1','Consumer protection','Laws that protect consumers from unsafe products, false advertising and unfair prices.'],
['gi:2','Minimum wage','A legal minimum hourly wage that employers must pay workers.'],
['gi:2','National Minimum Wage','The lowest hourly rate of pay allowed by law in a country.'],
['mo:0','Economic growth','An increase in the output of goods and services (real GDP) of an economy over time.'],
['mo:0','Gross domestic product (GDP)','The total value of all goods and services produced in a country in a year.'],
['mo:0','Real GDP','GDP adjusted for inflation, so it shows changes in actual output.'],
['mo:0','GDP per capita','GDP divided by the population; used to compare average living standards.'],
['mo:0','Standard of living','The level of wealth, comfort and material goods available to people.'],
['mo:0','Hidden economy','Economic activity not declared to the government, so not included in GDP.'],
['mo:1','Economic cycle','The regular fluctuations of real GDP around its trend: boom, downturn, recession and recovery.'],
['mo:1','Boom','The peak of the cycle: fast growth, low unemployment and rising inflation.'],
['mo:1','Downturn','When growth slows down after a boom.'],
['mo:1','Recession','Negative economic growth (falling real GDP) for two consecutive quarters.'],
['mo:1','Recovery','When real GDP starts to rise again after a recession.'],
['mo:2','Inflation','A sustained rise in the general price level.'],
['mo:2','Deflation','A sustained fall in the general price level.'],
['mo:2','Disinflation','A fall in the rate of inflation — prices are still rising, but more slowly.'],
['mo:2','Consumer price index (CPI)','A weighted index measuring the average change in prices of a basket of goods and services bought by households.'],
['mo:2','Base year','The year with which other years are compared in an index; its index number is 100.'],
['mo:2','Weights','Numbers showing how important each item is in the CPI, based on the share of spending on it.'],
['mo:3','Demand-pull inflation','Inflation caused by total demand in the economy growing faster than the economy’s ability to supply.'],
['mo:3','Cost-push inflation','Inflation caused by rising costs of production, e.g. wages, raw materials or energy.'],
['mo:3','Menu costs','The costs to firms of changing prices, e.g. reprinting menus and price lists.'],
['mo:3','Shoe leather costs','The time and effort spent shopping around and managing money to avoid the effects of inflation.'],
['mo:3','Real income','Income adjusted for inflation; what money income can actually buy.'],
['mo:3','Interest rate','The cost of borrowing money and the reward for saving, expressed as a percentage.'],
['mo:4','Unemployment','When people of working age who are willing and able to work cannot find a job.'],
['mo:4','ILO measure','A survey measure of unemployment: people without a job who have looked for work in the last 4 weeks and can start within 2 weeks.'],
['mo:4','Labour force','Everyone of working age who is employed or unemployed (looking for work).'],
['mo:4','Unemployment rate','The number unemployed as a percentage of the labour force.'],
['mo:4','Cyclical unemployment','Unemployment caused by a lack of demand during a downturn or recession.'],
['mo:4','Structural unemployment','Unemployment caused by a long-term decline in an industry, leaving workers with the wrong skills or in the wrong place.'],
['mo:4','Seasonal unemployment','Unemployment caused by changes in demand at different times of the year, e.g. tourism, farming.'],
['mo:4','Frictional unemployment','Short-term unemployment while people move between jobs.'],
['mo:4','Voluntary unemployment','When people choose not to work at the current wage, e.g. because benefits are close to wages.'],
['mo:5','Consumer confidence','How optimistic households feel about the economy and their own finances.'],
['mo:5','Business confidence','How optimistic firms are about future sales and profits.'],
['mo:5','Welfare benefits','Payments from the government to people on low incomes, the unemployed, the sick or the elderly.'],
['mo:6','Balance of payments','A record of all financial transactions between one country and the rest of the world.'],
['mo:6','Current account','The part of the balance of payments recording trade in goods and services and income flows.'],
['mo:6','Visible trade','Trade in goods, e.g. cars, oil, food.'],
['mo:6','Invisible trade','Trade in services, e.g. tourism, banking, insurance, transport.'],
['mo:6','Current account deficit','When the value of imports of goods and services is greater than the value of exports.'],
['mo:6','Current account surplus','When the value of exports of goods and services is greater than the value of imports.'],
['mo:6','Exports','Goods and services produced in one country and sold to another; money flows in.'],
['mo:6','Imports','Goods and services bought from another country; money flows out.'],
['mo:6','Foreign currency reserves','Stocks of foreign currency held by a central bank, which can be used to pay for imports.'],
['mo:7','Visual pollution','Unattractive sights that spoil the environment, e.g. litter, billboards.'],
['mo:7','Noise pollution','Unwanted noise from activities such as factories, airports or roads.'],
['mo:7','Sustainability','Meeting the needs of the present without reducing the ability of future generations to meet their needs.'],
['mo:8','Income inequality','The unequal distribution of income between different people or households.'],
['mo:8','Absolute poverty','When people do not have enough income to meet their basic needs: food, water, shelter and clothing.'],
['mo:8','Relative poverty','When people have much less income than the average in their society (often below 60% of median income).'],
['mo:8','Progressive tax','A tax where people with higher incomes pay a larger percentage of their income in tax.'],
['mo:8','Regressive tax','A tax where people with lower incomes pay a larger percentage of their income in tax.'],
['mo:8','Redistribution of income','Transferring income from richer to poorer people through taxes and benefits.'],
['po:0','Fiscal policy','The use of government spending and taxation to influence the economy.'],
['po:0','Direct tax','A tax on income or wealth, paid directly to the government, e.g. income tax, corporation tax.'],
['po:0','Fiscal deficit (budget deficit)','When government spending is greater than tax revenue in a year.'],
['po:0','Fiscal surplus (budget surplus)','When tax revenue is greater than government spending in a year.'],
['po:0','National debt','The total amount the government owes from borrowing over many years.'],
['po:0','Expansionary fiscal policy','Increasing government spending and/or cutting taxes to increase demand and growth.'],
['po:0','Contractionary fiscal policy','Cutting government spending and/or raising taxes to reduce demand and inflation.'],
['po:1','Monetary policy','The use of interest rates (and the money supply) by the central bank to influence the economy.'],
['po:1','Central bank','The bank that sets interest rates and controls the money supply, e.g. the Bank of England.'],
['po:1','Quantitative easing (asset purchasing)','When the central bank creates money to buy assets such as government bonds, to lower long-term interest rates and boost spending.'],
['po:1','Inflation target','The rate of inflation the central bank aims for, e.g. 2% CPI.'],
['po:2','Supply-side policy','Policies that aim to increase the productivity and productive capacity (total output) of the economy.'],
['po:2','Deregulation','Removing rules and regulations to increase competition and efficiency.'],
['po:2','Infrastructure','The basic facilities a country needs: roads, railways, ports, energy and communications networks.'],
['po:2','Regional policy','Policies to boost areas with high unemployment, e.g. grants for firms that locate there.'],
['po:3','Legislation','Laws passed by the government, e.g. banning a product or setting safety standards.'],
['po:4','Trade-off','When achieving one objective makes another objective harder to achieve.'],
['po:4','Conflict of objectives','When a policy that helps one macroeconomic objective harms another.'],
['gl:0','Globalisation','The increased integration and interdependence of the world’s economies.'],
['gl:0','Interdependence','When countries depend on each other for goods, services, jobs and investment.'],
['gl:1','Multinational corporation (MNC)','A business with its headquarters in one country and production or operations in other countries.'],
['gl:1','Foreign direct investment (FDI)','Investment by a firm in one country in productive assets (e.g. factories) in another country.'],
['gl:1','Tax avoidance','Legally reducing tax paid, e.g. MNCs reporting profits in low-tax countries.'],
['gl:2','Free trade','International trade without barriers such as tariffs, quotas or subsidies.'],
['gl:2','Specialisation (countries)','When a country concentrates on producing the goods it is best at making and trades for the rest.'],
['gl:3','Protectionism','Government measures to protect domestic producers from foreign competition.'],
['gl:3','Tariff','A tax on imported goods.'],
['gl:3','Quota','A physical limit on the quantity of a good that can be imported.'],
['gl:3','Dumping','Selling exports in a foreign market at a price below the cost of production.'],
['gl:3','Infant industry','A new industry that is not yet big enough to compete with established foreign firms.'],
['gl:3','Retaliation','When a country imposes trade barriers in response to barriers imposed by another country.'],
['gl:4','Trading bloc','A group of countries that agree to reduce or remove trade barriers between themselves.'],
['gl:4','Free trade area','A trading bloc with no tariffs between members, but each member keeps its own tariffs on non-members.'],
['gl:4','Customs union','A trading bloc with free trade between members and a common external tariff on non-members.'],
['gl:4','World Trade Organization (WTO)','The international organisation that sets the rules of world trade, promotes free trade and settles trade disputes.'],
['gl:4','Trade diversion','When trade switches from a cheaper non-member to a more expensive member of a trading bloc.'],
['gl:5','Exchange rate','The price of one currency in terms of another currency.'],
['gl:5','Floating exchange rate','An exchange rate determined by the demand for and supply of the currency.'],
['gl:5','Fixed exchange rate','An exchange rate set by the government or central bank at a certain level against another currency.'],
['gl:5','Currency speculation','Buying or selling currencies to make a profit from expected changes in exchange rates.'],
['gl:6','Appreciation','A rise in the value of a currency in a floating exchange rate system.'],
['gl:6','Depreciation','A fall in the value of a currency in a floating exchange rate system.'],
['gl:6','Revaluation','A deliberate rise in the value of a currency in a fixed exchange rate system.'],
['gl:6','Devaluation','A deliberate fall in the value of a currency in a fixed exchange rate system.'],
['gl:6','SPICED','Strong Pound (currency): Imports Cheaper, Exports Dearer — the effect of an appreciation.'],
['gl:6','WPIDEC','Weak Pound (currency): Imports Dearer, Exports Cheaper — the effect of a depreciation.']];

function mountWidget(host,name){
  const W=WIDGETS[name];if(!W){host.textContent='Missing widget '+name;return;}
  const vals={};host.innerHTML=`<div class="wctrl"></div><div class="wview"></div>`;
  const ctrl=host.querySelector('.wctrl'),view=host.querySelector('.wview');
  W.c.forEach(([id,label,min,max,step,val,opts])=>{vals[id]=val;
    const row=document.createElement('label');row.className='wrow';
    if(opts){row.innerHTML=`<span>${label}</span><div class="seg">${opts.map((o,i)=>`<button type="button" data-i="${i}" class="${i===val?'on':''}">${o}</button>`).join('')}</div>`;
      row.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.preventDefault();vals[id]=+b.dataset.i;row.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw();});}
    else{row.innerHTML=`<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"><b>${fmt(val)}</b>`;
      const inp=row.querySelector('input'),out=row.querySelector('b');inp.oninput=()=>{vals[id]=+inp.value;out.textContent=fmt(+inp.value);draw();};}
    ctrl.appendChild(row);});
  function draw(){view.innerHTML=W.r(vals);}
  draw();
}

  ['Government','Choosing how to spend limited tax revenue — e.g. a new hospital or a new motorway.']]),
 FM('Opportunity cost','Opportunity cost = the NEXT BEST alternative given up',[['Next best','Only the single best option you didn’t choose — not everything you could have done'],['Given up','Also called “forgone”']],'“What is meant by opportunity cost?” is a 2-mark question: (1) the next best alternative (2) forgone when making a choice.'),
 C('Opportunity cost for each agent',[
  ['Consumer','Mia has $60. She buys a video game instead of football boots. The opportunity cost is the football boots.'],
  ['Producer','A farmer uses a field for wheat instead of potatoes. The opportunity cost is the potato crop.'],
  ['Government','The government spends $2bn on defence instead of building schools. The opportunity cost is the schools.'],
  ['Time','Revising economics for an hour instead of playing football. Time is a scarce resource too!']]),
 EX('Exam-style: explain (3 marks)','Casper has decided to buy a new television. Explain one possible opportunity cost for Casper of this decision.',
  ['Identify: the opportunity cost could be <b>a holiday</b> (the next best alternative). (1)','Develop: Casper has a <b>limited income</b>, so he cannot afford both. (1)','Develop: by spending the money on the TV, he <b>gives up</b> the holiday he would otherwise have chosen. (1)'],'One point, developed twice, in context = 3 marks'),
 MI([['“Opportunity cost is the price you paid.”','It is the next best ALTERNATIVE given up — not the money.'],['Listing every possible alternative','Only the single NEXT BEST alternative counts.'],['Thinking free things have no opportunity cost','A “free” concert still costs your time — the next best use of that evening.']]),
 Q('Ali has 2 hours free. He could revise (his first choice), go to the cinema (second choice) or sleep (third choice). He revises. What is the opportunity cost?',['Going to the cinema','Sleeping','Going to the cinema and sleeping','Nothing — revising is free'],0,'Opportunity cost is only the NEXT best alternative — the cinema.'),
 Q('Which best describes scarcity?',['Unlimited wants but finite resources','A shortage of a good in one shop','When prices are very high','When the government runs out of money'],0,'Scarcity is a permanent, universal problem: unlimited wants, finite resources.'),
 S('Scarcity = unlimited wants + finite resources → choices.','Opportunity cost = next best alternative forgone.','Consumers, producers and the government all face opportunity costs.','Use a named alternative and “because… so…” in explain answers.')],8);

LS('ep:1','1.1.1','⌒','The production possibility curve is the first diagram of the course — and it shows scarcity, choice and opportunity cost all at once.',[
 VS('What the PPC shows',ppcDiagram({}),`<ul class="blist"><li>A <b>production possibility curve (PPC)</b> shows the <b>maximum</b> combinations of two goods an economy can produce with all its resources fully and efficiently employed.</li><li>Axes: one good (or type of good) on each axis — here capital goods and consumer goods.</li><li>It is bowed out (concave) because resources are not equally good at producing both goods.</li></ul>`),
 I('Reading points on the PPC',[
  `${B('On the curve (B)')}: all resources fully employed — productively efficient. This is the maximum productive potential.`,
  `${B('Inside the curve (A)')}: some resources are <b>unemployed</b> or wasted, e.g. in a recession. Output could rise at no cost.`,
  `${B('Outside the curve (C)')}: <b>unobtainable</b> with current resources and technology.`,
  `Possible output = anywhere ON or INSIDE the curve.`],ppcDiagram({sA:1,sB:0,sC:2})),
 VS('Opportunity cost on a PPC',ppcDiagram({oc:1,points:false}),`<ul class="blist"><li>Moving along the curve from 3 to 5 units of consumer goods means capital goods fall from <b>7.2 to 5.7</b>.</li><li>The opportunity cost of the extra 2 consumer goods is <b>1.5 capital goods</b>.</li><li>Because the curve gets steeper, each extra unit costs more and more of the other good — increasing opportunity cost.</li></ul>`),
 EX('Calculating opportunity cost from a PPC','An economy can make 100 tractors and 400 tonnes of food, or 120 tractors and 340 tonnes of food. What is the opportunity cost of the extra 20 tractors?',
  ['Food given up = 400 − 340 = <b>60 tonnes</b>','So 20 extra tractors cost 60 tonnes of food','Per tractor: 60 ÷ 20 = <b>3 tonnes of food</b>'],'Opportunity cost = 60 tonnes of food (3 tonnes per tractor)'),
 N('A country moves along its PPC from 50 cars and 200 bikes to 60 cars and 170 bikes. What is the opportunity cost of ONE extra car, in bikes?',3,'30 bikes given up for 10 cars = 3 bikes per car.',null,'number of bikes'),
 Q('A point inside the PPC shows…',['Unemployed or inefficiently used resources','The maximum output of the economy','An output that cannot be reached','Economic growth'],0,'Inside the curve, resources are not fully employed.'),
 MI([['Labelling the axes “Price” and “Quantity”','A PPC has a GOOD on each axis, e.g. “Consumer goods” and “Capital goods”.'],['Saying a point outside the curve is “inefficient”','It is UNOBTAINABLE. Inside the curve is inefficient.']]),
 S('PPC = maximum combinations of two goods with full employment of resources.','On = efficient, inside = unemployed resources, outside = unobtainable.','A movement along the curve shows opportunity cost.','Opportunity cost = units of the other good given up.')],8);

LS('ep:2','1.1.1','↗','A PPC can move. Shifting it outwards is the picture of economic growth — and inwards is the picture of decline.',[
 I('Shifts of the PPC',[
  `${B('Positive economic growth')} = an increase in productive potential → the PPC shifts <b>outwards</b>.`,
  `${B('Negative economic growth')} = a fall in productive potential → the PPC shifts <b>inwards</b>.`,
  `A move from inside the curve to the curve is NOT a shift — it is using unemployed resources (e.g. recovering from recession).`],ppcDiagram({shift:1,points:false,s:1})),
 C('Causes of positive growth (outward shift)',[
  ['More resources','Discovery of oil or minerals; immigration increases the labour force.'],
  ['Better technology','Robots, AI and better machines raise output from the same inputs.'],
  ['Investment','More capital goods (factories, machinery) → more capacity in the future.'],
  ['Education & training','Better skilled workers (human capital) are more productive.'],
  ['Better infrastructure','Roads, ports and broadband make production easier.']]),
 C('Causes of negative growth (inward shift)',[
  ['Natural disasters','Earthquakes, floods or droughts destroy land, capital and lives.'],
  ['War & conflict','Factories, infrastructure and workers are lost.'],
  ['Emigration','Skilled workers leave the country (“brain drain”).'],
  ['Depletion of resources','Running out of oil, over-fishing, soil erosion.'],
  ['Lack of investment','Machinery wears out (depreciates) and is not replaced.']]),
 VS('Negative growth',ppcDiagram({shift:-1,points:false}),`<ul class="blist"><li>A tsunami destroys ports and farmland in a country.</li><li>The economy can now produce LESS of both goods → the PPC shifts <b>inwards</b>.</li><li>This is negative economic growth — a fall in productive potential.</li></ul>`),
 EX('Exam-style: analyse one cause (part of a 6-mark answer)','Analyse how investment in education could affect an economy’s PPC.',
  ['Investment in education improves the <b>skills of the labour force</b> (human capital).','Skilled workers are more <b>productive</b> — they produce more output per hour.','The same number of workers can now produce more of both goods.','So the <b>productive potential rises</b> and the PPC shifts <b>outwards</b> — positive economic growth.','However, it takes years for education to raise productivity, so the shift is long-term.'],'Chain: education → skills → productivity → capacity → PPC shifts out'),
 Q('Which would shift a country’s PPC inwards?',['A major earthquake destroying factories','Higher investment in machinery','The discovery of new gas reserves','Unemployed workers finding jobs'],0,'Destroyed capital reduces productive potential. (Unemployed finding jobs is a move from inside TO the curve.)'),
 S('Outward shift = positive economic growth (more productive potential).','Inward shift = negative economic growth.','Causes: quantity and quality of resources, technology, investment, education.','A move from inside to the curve ≠ a shift of the curve.')],7);

LS('ep:3','1.1.2','☺','Economists assume people and firms behave rationally — but real people are not robots. This lesson covers both.',[
 I('The two big assumptions',[
  `${B('Consumers aim to maximise their benefit')} (satisfaction / utility) from their limited income.`,
  `${B('Businesses aim to maximise their profit')} — the difference between total revenue and total cost.`,
  `These assumptions let us predict behaviour: if the price of a good falls, consumers buy more because they get more benefit per dollar.`]),
 C('Why consumers may NOT maximise benefit',[
  ['Bad at calculating benefits','It is hard to compare every option — e.g. choosing between hundreds of phone contracts. People make quick, “good enough” decisions.'],
  ['Habits','Habits are hard to give up — buying the same brand of cereal, or smoking, even when better or cheaper options exist.'],
  ['Copying others','Herd behaviour — buying trainers because friends have them or following social media trends.']]),
 C('Why producers may NOT maximise profit',[
  ['Revenue or sales maximisation','Managers may be rewarded for growth or market share, so they cut prices to sell more, even if profit falls.'],
  ['Caring for customers','Firms may keep prices low or offer better service to build loyalty and reputation.'],
  ['Charitable work','Firms may donate profits, pay above-market wages or source ethically (e.g. Fairtrade) — corporate social responsibility.']]),
 EX('Exam-style: explain (3 marks)','Hanan owns a shop and wants to maximise profits. Mostafa, the manager, wants to give customers a 10% discount for buying in bulk. Explain one reason why Mostafa may want to offer this discount rather than maximise profit.',
  ['Mostafa may aim to <b>maximise sales</b> (or revenue) rather than profit. (1)','A 10% discount makes bulk buying cheaper, so <b>customers buy more</b>. (1)','This could raise the shop’s market share and Mostafa’s performance, or build <b>customer loyalty</b>, even though profit per item falls. (1)'],'Identify the objective + develop with the 10% discount = 3 marks'),
 Q('Which is a reason why a consumer may not maximise their benefit?',['They copy the choices of their friends','They compare every product carefully','They buy the cheapest product of equal quality','They respond to a price fall by buying more'],0,'Herd behaviour (copying others) is one of the three reasons in the spec.'),
 Q('A manager whose bonus depends on market share is most likely to aim for…',['Sales maximisation','Profit maximisation','Cost maximisation','Charitable work'],0,'Market share rises when the firm sells more units.'),
 S('Assumption: consumers maximise benefit, firms maximise profit.','Consumers may not: miscalculation, habits, copying others.','Producers may not: sales/revenue maximising managers, caring for customers, charity.','Always link to the context in “explain” questions.')],6);

/* ════════════ 2 · DEMAND, SUPPLY & EQUILIBRIUM ════════════ */
LS('sd:0','1.1.3','D','Demand is not just “wanting” something. This lesson builds the demand curve and the six factors that shift it.',[
 FM('Definition of demand','Demand = quantity consumers are WILLING and ABLE to buy at a given price over a period of time',[['Willing','they want it'],['Able','they can afford it (effective demand)'],['Given price','each price has its own quantity'],['Period of time','per week, month, year']],'Leave out “able to” and you lose the mark.'),
 VS('The demand curve slopes down',sdMove('D'),`<ul class="blist"><li>When price falls, quantity demanded rises (and vice versa).</li><li>Lower price → the good is cheaper compared with substitutes, and consumers can afford more.</li><li>A change in the good’s <b>own price</b> causes a <b>movement along</b> the curve: an <b>extension</b> (price ↓) or a <b>contraction</b> (price ↑).</li></ul>`),
 I('Shifts of the demand curve',[
  `Any factor OTHER than the good’s own price <b>shifts</b> the whole curve.`,
  `${B('Increase in demand')}: shift to the <b>right</b> (D → D₁) — more is demanded at every price.`,
  `${B('Decrease in demand')}: shift to the <b>left</b> — less is demanded at every price.`],sdDiagram({dshift:2,step:1,step2:2})),
 C('Six factors that shift demand',[
  ['Advertising','Successful advertising increases demand (shift right).'],
  ['Income','Higher income → more demand for normal goods (less for inferior goods).'],
  ['Fashion & tastes','A product becoming fashionable shifts demand right; going out of fashion shifts it left.'],
  ['Price of substitutes','If the price of coffee rises, demand for tea (a substitute) increases.'],
  ['Price of complements','If the price of games consoles falls, demand for games (a complement) increases.'],
  ['Demographic changes','An ageing population increases demand for healthcare and care homes.']]),
 EX('Which way does it shift?','The price of petrol rises sharply. What happens to the demand for (a) petrol, (b) large cars, (c) bus travel?',
  ['(a) Petrol: its own price changed → <b>contraction</b> of demand (movement up the curve), NOT a shift.','(b) Large cars are a <b>complement</b> to petrol → demand <b>decreases</b> (shifts left).','(c) Bus travel is a <b>substitute</b> for driving → demand <b>increases</b> (shifts right).'],'Own price = movement; other factors = shift'),
 W('Demand & supply lab — shift the demand curve','market','Move the demand slider and watch the new equilibrium. Right = increase, left = decrease.'),
 Q('The price of tennis rackets falls. What happens to demand for tennis balls?',['It increases — they are complements','It decreases — they are substitutes','There is a movement along the demand curve for tennis balls','Nothing'],0,'Cheaper rackets → more people play → more demand for balls (shift right).'),
 MI([['“Price rises so demand falls” (shift left)','A change in own price causes a CONTRACTION along the curve, not a shift.'],['Shifting demand up/down','Describe demand shifts as LEFT or RIGHT.']]),
 S('Demand = willing AND able to buy at a given price over time.','Own price → movement along (extension / contraction).','Other factors → shift: advertising, income, tastes, substitutes, complements, demographics.','Right = increase, left = decrease.')],9);

LS('sd:1','1.1.3','S','Supply is the producers’ side of the market. Higher prices encourage firms to sell more — and costs, technology, taxes, subsidies and the weather shift the curve.',[
 FM('Definition of supply','Supply = quantity producers are WILLING and ABLE to sell at a given price over a period of time',[['Willing & able','firms want to sell and have the capacity to produce'],['Given price','each price has a quantity supplied']],'Same structure as the demand definition — learn them as a pair.'),
 VS('The supply curve slopes up',sdMove('S'),`<ul class="blist"><li>When price rises, quantity supplied rises.</li><li>A higher price means <b>more profit</b> per unit, so firms produce more and new firms join the market.</li><li>A change in the good’s own price causes an <b>extension</b> (price ↑) or <b>contraction</b> (price ↓) of supply.</li></ul>`),
 I('Shifts of supply',[
  `${B('Increase in supply')} → shift <b>right</b>: more supplied at every price.`,
  `${B('Decrease in supply')} → shift <b>left</b>: less supplied at every price.`,
  `Anything that changes the <b>cost</b> or <b>ability</b> to produce shifts supply.`],sdDiagram({sshift:-2,step:1,step2:2})),
 C('Five factors that shift supply',[
  ['Costs of production','Higher wages, raw material or energy costs → supply decreases (left).'],
  ['Technology','Better machines lower costs → supply increases (right).'],
  ['Indirect taxes','A tax on each unit (e.g. VAT, fuel duty) is like a cost → supply decreases (left).'],
  ['Subsidies','A government payment per unit lowers costs → supply increases (right).'],
  ['Natural factors','Bad weather, floods or disease reduce crop supply (left); a good harvest increases it (right).']]),
 VS('Supply shifting right',sdDiagram({sshift:2}),`<ul class="blist"><li>New technology lowers the cost of producing solar panels.</li><li>Supply shifts right S → S₁.</li><li>Price falls (P → P₁) and quantity rises (Q → Q₁).</li></ul>`),
 Q('A drought hits coffee farms in Brazil. What happens to the supply of coffee?',['It decreases — shifts left','It increases — shifts right','It contracts along the curve','Nothing — only demand changes'],0,'Natural factors (weather) reduce the ability to produce → supply shifts left.'),
 Q('The government gives a subsidy to electric car makers. The supply curve…',['Shifts right','Shifts left','Becomes vertical','Does not move'],0,'A subsidy lowers costs, so more can be supplied at every price.'),
 MI([['“Higher costs increase supply because price rises”','Higher costs DECREASE supply (shift left); the price rise is the RESULT.'],['Drawing an indirect tax as a demand shift','A tax on producers shifts SUPPLY left.']]),
 S('Supply = willing and able to sell at a given price over time.','Supply slopes up: higher price → more profit → more supplied.','Shifters: costs, technology, indirect taxes, subsidies, natural factors.','Tax → left, subsidy → right.')],8);

LS('sd:2','1.1.3','✕','Put demand and supply together and you get the market price. This is the most-used diagram in the whole exam.',[
 VS('Equilibrium',sdDiagram(),`<ul class="blist"><li><b>Equilibrium</b> is where quantity demanded = quantity supplied.</li><li>Pe is the <b>equilibrium (market-clearing) price</b>; Qe is the equilibrium quantity.</li><li>At Pe there is no shortage and no surplus, so there is no pressure for the price to change.</li></ul>`),
 C('The four shifts — learn these outcomes',[
  ['Demand increases (D right)','Price ↑, Quantity ↑'],['Demand decreases (D left)','Price ↓, Quantity ↓'],['Supply increases (S right)','Price ↓, Quantity ↑'],['Supply decreases (S left)','Price ↑, Quantity ↓']]),
 VS('Example: the cocoa market',sdDiagram({sshift:-2}),`<ul class="blist"><li>Disease and bad weather in Ghana and Côte d’Ivoire cut cocoa harvests.</li><li>Supply of cocoa shifts <b>left</b> (S → S₁).</li><li>Equilibrium price rises sharply (P → P₁) and quantity falls (Q → Q₁) — chocolate makers pay more.</li></ul>`),
 VS('Example: the housing market',sdDiagram({dshift:2}),`<ul class="blist"><li>Population growth and lower interest rates increase demand for houses.</li><li>Demand shifts <b>right</b> (D → D₁).</li><li>House prices rise (P₁) and more houses are sold (Q₁).</li></ul>`),
 EX('Exam-style: draw (3 marks)','Using a diagram, show the likely effect on the market for solar panels if the government removes an indirect tax on them.',
  ['Removing a tax lowers producers’ costs → <b>supply shifts right</b>, labelled S₁. (1)','The new equilibrium price is <b>lower</b> — mark P₁ on the price axis. (1)','The new equilibrium quantity is <b>higher</b> — mark Q₁ on the quantity axis. (1)'],'Shift labelled + new price + new quantity = 3 marks',sdDiagram({sshift:2})),
 W('Demand & supply lab','market','Try both shifts at once. When both curves shift, one of price or quantity is certain and the other depends on which shift is bigger.'),
 Q('A successful advertising campaign for oat milk. Equilibrium price and quantity will…',['Both rise','Both fall','Price rises, quantity falls','Price falls, quantity rises'],0,'Demand shifts right → price and quantity both rise.'),
 Q('New machinery cuts the cost of making bicycles. The equilibrium price and quantity…',['Price falls, quantity rises','Price rises, quantity rises','Price falls, quantity falls','Price rises, quantity falls'],0,'Supply shifts right → lower price, higher quantity.'),
 S('Equilibrium: Qd = Qs at Pe.','D right: P↑ Q↑ · D left: P↓ Q↓.','S right: P↓ Q↑ · S left: P↑ Q↓.','Draw: shift + label S₁/D₁ + P₁ + Q₁ (3 marks).')],9);

LS('sd:3','1.1.3','⇅','If the price is not at equilibrium, the market has a shortage or a surplus — and market forces push the price back.',[
 VS('Excess demand (shortage)',sdExcess('ED'),`<ul class="blist"><li>At a price <b>below</b> equilibrium (P₁), quantity demanded (Qd) is greater than quantity supplied (Qs).</li><li><b>Excess demand = Qd − Qs</b>.</li><li>Queues and empty shelves appear; some consumers go without.</li></ul>`),
 VS('Excess supply (surplus)',sdExcess('ES'),`<ul class="blist"><li>At a price <b>above</b> equilibrium, quantity supplied is greater than quantity demanded.</li><li><b>Excess supply = Qs − Qd</b>.</li><li>Unsold stock builds up in warehouses.</li></ul>`),
 I('Market forces restore equilibrium',[
  `${B('Excess demand')} → sellers see queues and can raise the price → quantity demanded contracts and quantity supplied extends → until Qd = Qs.`,
  `${B('Excess supply')} → sellers cut prices to clear unsold stock → demand extends and supply contracts → back to equilibrium.`,
  `This is the <b>price mechanism</b> — no government needed.`],chain(['Price below Pe','Excess|demand','Price|rises','Qd ↓ Qs ↑','Back to|equilibrium'],{steps:1})),
 EX('Calculate excess demand from a schedule','Price $4: Qd = 900, Qs = 500 · Price $6: Qd = 700, Qs = 700 · Price $8: Qd = 500, Qs = 900. (a) Equilibrium? (b) Situation at $4? (c) At $8?',
  ['(a) Qd = Qs = 700 at <b>$6</b> — equilibrium price $6, quantity 700.','(b) At $4: Qd − Qs = 900 − 500 = <b>400 excess demand</b>.','(c) At $8: Qs − Qd = 900 − 500 = <b>400 excess supply</b>.'],'Excess demand 400 at $4; excess supply 400 at $8'),
 N('At a price of $3, quantity demanded is 1,250 and quantity supplied is 800. Calculate the excess demand.',450,'1,250 − 800 = 450 units.',null,'units'),
 Q('Concert tickets are priced below equilibrium. What is the most likely result?',['Excess demand — tickets sell out and resale prices rise','Excess supply — empty seats','The supply curve shifts right','Equilibrium'],0,'Below equilibrium Qd > Qs.'),
 S('Excess demand: price below Pe, Qd > Qs (shortage).','Excess supply: price above Pe, Qs > Qd (surplus).','Calculate: the gap between Qd and Qs at that price.','Market forces (price changes) remove the excess.')],8);

/* ════════════ 3 · ELASTICITY ════════════ */
LS('el:0','1.1.4','%','How much does quantity demanded react when price changes? PED puts a number on it — and it is a guaranteed calculation question.',[
 FM('Price elasticity of demand','PED = % change in quantity demanded ÷ % change in price',[['Q on top','Quantity always goes on top'],['Negative','PED is normally negative (price and Qd move in opposite directions)'],['No units','It is just a number']],'Define PED: “the responsiveness of quantity demanded to a change in price”.'),
 EX('Calculating PED','The price of a cinema ticket rises by 10% and quantity demanded falls by 25%. Calculate PED.',
  ['PED = %ΔQd ÷ %ΔP','= −25 ÷ +10','= <b>−2.5</b>','The value is beyond −1, so demand is <b>price elastic</b>.'],'PED = −2.5 (elastic)'),
 EX('Rearranging: find the change in quantity','The PED for a product is −1.9 and the price falls by 10%. Calculate the % change in quantity demanded.',
  ['%ΔQd = PED × %ΔP','= −1.9 × −10','= <b>+19%</b>'],'Quantity demanded rises by 19%'),
 C('Interpreting PED values',[
  ['PED = 0','Perfectly price inelastic — quantity does not change at all.'],
  ['0 to −1 (e.g. −0.4)','Price inelastic — %ΔQd smaller than %ΔP.'],
  ['PED = −1','Unitary elasticity — same % change.'],
  ['Beyond −1 (e.g. −2.5)','Price elastic — %ΔQd bigger than %ΔP.'],
  ['PED = ∞','Perfectly price elastic — any price rise makes Qd fall to zero.']]),
 VS('Elastic vs inelastic demand',pedDiagram('elastic'),`<ul class="blist"><li>A <b>flatter</b> demand curve shows <b>elastic</b> demand — a small price cut causes a big rise in quantity.</li><li>Compare this with the steep curve on the next slide.</li></ul>`),
 VS('Inelastic demand',pedDiagram('inelastic'),`<ul class="blist"><li>A <b>steeper</b> curve shows <b>inelastic</b> demand — even a big price change hardly changes quantity.</li><li>Examples: petrol, cigarettes, salt, insulin.</li></ul>`),
 VS('The extremes',pedDiagram('pi'),`<ul class="blist"><li>Vertical demand = <b>perfectly inelastic</b> (PED = 0).</li><li>Horizontal demand = <b>perfectly elastic</b> (PED = ∞).</li><li>MCQ favourite: “Which value shows perfectly price elastic demand?” → <b>Infinity</b>.</li></ul>`),
 W('PED explorer','ped','Change the price and the steepness of the demand curve and watch PED and total revenue.'),
 N('Price falls by 5% and quantity demanded rises by 2%. Calculate PED (to 1 d.p.).',-0.4,'PED = +2 ÷ −5 = −0.4 → inelastic.',null,'e.g. −0.4'),
 Q('Which value shows perfectly price elastic demand?',['∞ (infinite)','−1','−0.5','Zero'],0,'Perfectly elastic: PED = ∞. Zero is perfectly inelastic.'),
 S('PED = %ΔQd ÷ %ΔP (Q on top).','Inelastic: 0 to −1 · unitary −1 · elastic beyond −1.','Steep curve ≈ inelastic, flat curve ≈ elastic.','Rearrange: %ΔQd = PED × %ΔP.')],10);

LS('el:1','1.1.4','TR','Why is demand for petrol inelastic but demand for one brand of crisps elastic? And what happens to a firm’s revenue when it changes its price?',[
 C('Four factors affecting PED',[
  ['Substitutes','More close substitutes → more elastic. One brand of cola has many substitutes (elastic); petrol has few (inelastic).'],
  ['Degree of necessity','Necessities (bread, medicine) → inelastic. Luxuries (designer bags) → elastic.'],
  ['% of income spent','A big share of income (cars, holidays) → elastic. A tiny share (salt, matches) → inelastic.'],
  ['Time','Over a longer time consumers find substitutes, so demand becomes more elastic.']]),
 FM('Total revenue','TR = price × quantity sold',[['Elastic demand','price ↑ → TR ↓ · price ↓ → TR ↑'],['Inelastic demand','price ↑ → TR ↑ · price ↓ → TR ↓'],['Unitary','TR does not change']],'This is how firms use PED to set prices.'),
 VS('Elastic: a price cut RAISES revenue',trBoxes(true),`<ul class="blist"><li>TR is the area of the rectangle price × quantity.</li><li>With elastic demand, the gain from the extra quantity (pink) is bigger than the loss from the lower price.</li><li>So a price cut increases total revenue.</li></ul>`),
 VS('Inelastic: a price cut LOWERS revenue',trBoxes(false),`<ul class="blist"><li>With inelastic demand, quantity hardly rises, so the lower price reduces revenue.</li><li>So firms selling goods with inelastic demand (e.g. petrol) RAISE prices to increase revenue.</li></ul>`),
 EX('Using TR to find whether demand is elastic','A café raises the price of coffee from $3.00 to $3.30. Weekly sales fall from 1,000 to 950 cups. Is demand elastic or inelastic?',
  ['TR before = $3.00 × 1,000 = <b>$3,000</b>','TR after = $3.30 × 950 = <b>$3,135</b>','Price rose AND total revenue rose','So demand is <b>price inelastic</b> (check: PED = −5% ÷ 10% = −0.5)'],'Inelastic — TR rose after the price rise'),
 N('A shop sells 400 bags at $25. It cuts the price to $20 and sells 600. Calculate the CHANGE in total revenue in $.',2000,'TR: $10,000 → $12,000, a rise of $2,000 — demand is elastic.',null,'$'),
 Q('Demand for a product is price inelastic. To increase total revenue the firm should…',['Raise its price','Cut its price','Keep price the same','Increase advertising only'],0,'Inelastic: price ↑ → small fall in Qd → TR ↑.'),
 S('PED factors: substitutes, necessity, % of income, time.','TR = P × Q.','Inelastic: raise price to raise TR. Elastic: cut price to raise TR.','Use the TR test to identify elasticity.')],8);

LS('el:2','1.1.4','PES','How quickly can producers respond when price rises? PES measures it — and explains why oil and cocoa prices swing so much.',[
 FM('Price elasticity of supply','PES = % change in quantity supplied ÷ % change in price',[['Positive','Supply curves slope upwards, so PES is positive'],['Q on top','as with PED']],'Define PES: “the responsiveness of quantity supplied to a change in price”.'),
 C('Interpreting PES values',[
  ['PES = 0','Perfectly inelastic — supply is fixed (e.g. seats in a stadium on match day).'],
  ['0 to 1','Inelastic — %ΔQs smaller than %ΔP.'],
  ['PES = 1','Unitary elasticity.'],
  ['Above 1','Elastic — %ΔQs bigger than %ΔP.'],
  ['PES = ∞','Perfectly elastic — any quantity at this price.']]),
 EX('Calculating PES','The price of wheat rises by 20% and the quantity supplied rises by 5%. Calculate PES and interpret it.',
  ['PES = %ΔQs ÷ %ΔP = 5 ÷ 20','= <b>0.25</b>','Between 0 and 1 → supply is <b>price inelastic</b>','Farmers cannot grow more wheat quickly — they must wait for the next harvest.'],'PES = 0.25 (inelastic)'),
 VS('Elastic vs inelastic supply',pesDiagram('elastic'),`<ul class="blist"><li>A <b>flatter</b> supply curve shows elastic supply — a small price rise brings a large rise in output.</li><li>Typical of manufactured goods with spare capacity.</li></ul>`),
 VS('Inelastic supply',pesDiagram('inelastic'),`<ul class="blist"><li>A <b>steeper</b> supply curve shows inelastic supply.</li><li>Typical of primary products in the short run — coffee, cocoa, oil.</li></ul>`),
 C('Factors affecting PES',[
  ['Factors of production','If extra labour, machines and raw materials are easy to get, supply is elastic.'],
  ['Availability of stocks','Firms with stock in warehouses can increase supply quickly → elastic.'],
  ['Spare capacity','Factories working below full capacity can raise output easily → elastic.'],
  ['Time','Supply is more elastic in the long run, when firms can build new factories or plant crops.']]),
 C('Manufactured vs primary products',[
  ['Manufactured (e.g. T-shirts, phones)','Usually price ELASTIC: factories can add shifts, use stock and buy more materials quickly.'],
  ['Primary (e.g. coffee, cocoa, rubber)','Usually price INELASTIC: trees take years to grow, harvests are seasonal, mines take years to open.'],
  ['Why it matters','Inelastic supply + changing demand → big price swings for commodities.']]),
 N('Price rises by 8% and quantity supplied rises by 12%. Calculate PES.',1.5,'12 ÷ 8 = 1.5 → elastic supply.',null,'number'),
