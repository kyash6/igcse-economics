   function declarations replace the basic ones. Shared by every app that
   has a WRITTEN bank (sciences, PE, geography, CS, English, German, econ).
   • auto-spots which mark-scheme points the answer covers (student confirms)
   • suggested mark, command-word advice, Also accept / No credit / Examiner tip
   • filters: New / To redo; Blurt mode (free recall of a whole topic)
   Storage: same wGet()/wSet() object as before (q, draft, c) + new field bl.
   WRITTEN is append-only: saved marks are keyed by question index.
════════════════════════════════════════════════════════════ */
const MS_STOP=new Set('about above after again also because been before being below between both but by can cannot could does doing down during each from have having here into just more most much must only other over same should since some such than that their them then there these they this those through under very what when where which while will with would your yours make makes made used uses using give gives given show shows shown answer answers mark marks point points eg e.g. etc'.split(' '));
const MS_CMD={describe:'Say what happens or what something is like — step by step, no reasons needed unless asked.',explain:'Give reasons: use “because…”, “so…”, “which means…”. Each link in the chain can earn a mark.',compare:'Make points about BOTH things, using comparison words (“whereas”, “both”, “higher than”).',evaluate:'Weigh up both sides, then reach a justified judgement — “overall… because…”.',suggest:'Apply what you know to an unfamiliar situation; any sensible, justified idea scores.',state:'A short, precise answer — no explanation needed.',name:'One or two words are enough.',give:'A short answer; no explanation needed.',calculate:'Show the formula, the substitution and the answer with units — method marks are available.',analyse:'Break it down: identify the point, develop it with a chain of reasoning, link to the context.',assess:'Analyse, then judge how important / how far — finish with a supported conclusion.',discuss:'Present different sides with developed points, then a conclusion.',justify:'Support your choice with evidence or reasons from the question.',outline:'Set out the main points briefly, in a logical order.',identify:'Pick out the answer — usually one word or phrase.',explore:'Range across the text: methods, effects, context — support each idea with a reference.',extended:'Plan first. Write in a logical order, use key terms, and cover the whole question.'};
function msStem(w){w=w.toLowerCase().replace(/[^a-z0-9äöüß.]/g,'');return /^\d/.test(w)?w:w.slice(0,Math.min(w.length,6));}
function msWords(t){return String(t).replace(/<[^>]+>/g,' ').replace(/\([^)]*\)/g,m=>' '+m.slice(1,-1)+' ').split(/[^A-Za-zÄÖÜäöüß0-9.]+/).map(x=>x.replace(/\.+$/,'')).filter(w=>w&&(/^\d/.test(w)||(w.length>=4&&!MS_STOP.has(w.toLowerCase()))));}
function msCovers(point,ans){const A=new Set(msWords(ans).map(msStem));if(!A.size)return false;
  return String(point).split(/\s\/\s|\bor\b|;/).some(alt=>{const k=[...new Set(msWords(alt).map(msStem))];if(!k.length)return false;
    const hit=k.filter(s=>A.has(s)||[...A].some(a=>a.length>=5&&s.length>=5&&(a.startsWith(s.slice(0,5))))).length;return hit>=Math.min(k.length,Math.max(1,Math.ceil(k.length*.5)));});}
function msLevelMode(w){const lv=LEVELS[w.m];return !!(lv&&w.m>=6&&/\d\s*[–-]\s*\d/.test(lv[0][0]));}
function msCmdTip(w){const c=String(w.c||'').toLowerCase();for(const k of Object.keys(MS_CMD))if(c.includes(k))return[k,MS_CMD[k]];
  return w.m>=6?['extended',MS_CMD.extended]:['explain',MS_CMD.explain];}

function writtenList(box){const wd=wGet().q||{};const f=window._wf||'all';
  const marks=[...new Set(WRITTEN.map(w=>w.m))].sort((a,b)=>a-b);
  const qs=WRITTEN.map((w,i)=>({...w,i})).filter(w=>f==='all'||(f==='new'?wd[w.i]==null:f==='redo'?(wd[w.i]!=null&&wd[w.i]/w.m<.7):String(w.m)===f));
  const nNew=WRITTEN.filter((w,i)=>wd[i]==null).length,nRedo=WRITTEN.filter((w,i)=>wd[i]!=null&&wd[i]/w.m<.7).length;
  const chips=[['all','All'],['new','New · '+nNew],['redo','To redo · '+nRedo],...marks.map(m=>[String(m),m+' marks'])];
  box.innerHTML=`<div class="toolbar"><div class="seg2 sm" style="flex-wrap:wrap">${chips.map(([k,n])=>`<button class="${f===k?'on':''}" onclick="window._wf='${k}';writtenList(document.getElementById('wr-main'))">${n}</button>`).join('')}</div><span class="sp"></span>${window.MS_NOAUTO?'':`<button class="btn sm" onclick="blurtStart(document.getElementById('wr-main'))">${ico('brain')}Blurt a topic</button>`}<button class="btn sm pri" onclick="writtenOpen(${qs.length?qs[Math.floor(Math.random()*qs.length)].i:0})">${ico('shuffle')}Random question</button></div>
${qs.length?'':`<div class="info">${ico('bulb')}<span>${f==='redo'?'Nothing to redo — every answer you marked scored 70% or more.':'No questions here yet.'}</span></div>`}
<div class="list">${qs.map(w=>{const l=lessonByKey(w.k);const d=wd[w.i];const isNew=w.i>=(window.MS_NEW_FROM||1e9);return`<div class="card wr-row" onclick="writtenOpen(${w.i})" style="--c:${colorOf(l.ti)}"><span class="wr-m">${w.m}</span><div><b>${esc(w.q.length>140?w.q.slice(0,140)+'…':w.q)}</b><span>${esc(l.T.name)} · ${esc(l.title)}</span></div>${isNew&&d==null?'<span class="tag tag-g">NEW</span>':''}${d!=null?`<span class="tag ${d/w.m>=.7?'tag-g':'tag-k'}">${d}/${w.m}</span>`:''}${ico('right')}</div>`;}).join('')}</div>`;}

function writtenReveal(){const w=WR.w,ms=document.getElementById('wr-ms');if(!ms)return;const lv=LEVELS[w.m]||LEVELS.def||LEVELS[3]||[];const lvl=msLevelMode(w);
  const ta=document.getElementById('wr-ta'),ans=ta?ta.value:'';const hit=w.pts.map(p=>!window.MS_NOAUTO&&!!ans.trim()&&msCovers(p,ans));const auto=hit.filter(Boolean).length;const [ck,tip]=msCmdTip(w);
  const rl=r=>/^\d/.test(r[0])?(lvl?'Level · '+r[0]:r[0]+' mark'+(r[0]==='1'?'':'s')):r[0];
  ms.innerHTML=`<div class="wr-ms anim"><div class="eb-lbl">Mark scheme — tick what you included</div><div class="ms-note">${ans.trim()&&!window.MS_NOAUTO?`${ico('sparkle')}<span>${auto} point${auto===1?'':'s'} look covered in your answer (ticked, marked ✓). Check each one honestly — a point only counts if it is clearly and correctly made.</span>`:`${ico('bulb')}<span>Write an answer first and the mark scheme will spot the points you made.</span>`}</div>
${w.pts.map((p,j)=>`<label class="chk${hit[j]?' ms-auto':''}"><input type="checkbox" onchange="wrCount()"${hit[j]?' checked':''}><label>${esc(p)}</label></label>`).join('')}
<div class="ms-help"><div class="ms-cmd"><b>${esc(ck[0].toUpperCase()+ck.slice(1))}</b> · ${esc(tip)}</div>
${w.acc?`<div class="ms-box ms-acc"><b>Also accept</b><ul>${[].concat(w.acc).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
${w.rej?`<div class="ms-box ms-rej"><b>No credit for</b><ul>${[].concat(w.rej).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
${w.tip?`<div class="ms-box ms-tip"><b>Examiner tip</b><p>${esc(w.tip)}</p></div>`:''}</div>
<div class="eb-lbl" style="margin-top:14px">${lvl?'Level descriptors':'How it is marked'}</div><table class="ptable">${lv.map(r=>`<tr><td><b>${esc(rl(r))}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</table>
<details class="wr-model"><summary>${ico('star')}Show the model answer</summary>${w.code?`<pre class="pcode">${esc(w.model)}</pre>`:(/^\s*</.test(String(w.model))?`<div class="wr-mhtml">${w.model}</div>`:`<div>${esc(w.model).replace(/\n\n/g,'<br><br>')}</div>`)}</details>
<div class="ms-sug" id="ms-sug"></div><div class="wr-score"><span>Your mark:</span>${[...Array(w.m+1)].map((_,k)=>`<button class="chip" onclick="wrScore(${k})">${k}</button>`).join('')}</div></div>`;
  window._msLvl=lvl;polish(ms);wrCount();}
function wrCount(){const w=WR&&WR.w,el=document.getElementById('ms-sug');if(!w||!el)return;const n=document.querySelectorAll('#wr-ms .chk input:checked').length;
  let s;if(window._msLvl){const need=Math.max(2,Math.round(w.pts.length*.6));s=Math.min(w.m,Math.round(w.m*Math.min(1,n/need)));}else s=Math.min(w.m,n);
  el.innerHTML=`${ico('target')}<span>Suggested mark: <b>${s} / ${w.m}</b>${window._msLvl?' (level-marked — judge the quality of your reasoning too)':''}. Tap your final mark below to save it.</span>`;
  document.querySelectorAll('.wr-score .chip').forEach((c,j)=>c.classList.toggle('sug',j===s));}

/* ── Blurt mode: free recall of a whole topic, checked against every mark-scheme point in it ── */
let MSBL=null;
function blurtTopics(){const m=new Map();WRITTEN.forEach(w=>{const l=lessonByKey(w.k);if(!l)return;const t=m.get(l.ti)||{ti:l.ti,name:l.T.name,pts:[]};w.pts.forEach(p=>{if(!t.pts.includes(p))t.pts.push(p);});m.set(l.ti,t);});return[...m.values()];}
function blurtStart(box,ti){const T=blurtTopics();const bl=wGet().bl||{};const t=T.find(x=>x.ti===ti)||null;
  if(!t){box.innerHTML=`<div class="card qcard"><div class="qtext"><b>Blurting</b> — pick a topic, write down <i>everything</i> you can remember in 5 minutes without notes, then check it against every mark-scheme point for that topic. It is one of the most effective ways to revise because it forces you to recall, not just re-read.</div>
<div class="bl-grid">${T.map(x=>{const b=bl[x.ti];return`<button class="card bl-t" style="--c:${colorOf(x.ti)}" onclick="blurtStart(document.getElementById('wr-main'),${JSON.stringify(x.ti)})">${ico(TICON[x.ti]||'brain')}<b>${esc(x.name)}</b><span>${x.pts.length} points${b?` · best ${b.p}%`:''}</span></button>`;}).join('')}</div>
<div class="qactions"><button class="btn" onclick="writtenList(document.getElementById('wr-main'))">${ico('left')}All questions</button></div></div>`;return;}
  clearInterval(MSBL&&MSBL.tm);MSBL={t,end:Date.now()+300000};
  box.innerHTML=`<div class="card qcard"><div class="qmeta"><span class="qtopic" style="--c:${colorOf(t.ti)}">${ico(TICON[t.ti]||'brain')}${esc(t.name)}</span><span>Blurt</span><span class="muted" id="bl-tm">5:00</span></div><div class="qtext">Write everything you know about <b>${esc(t.name)}</b> — key words, processes, examples, numbers. Don't look anything up.</div>
<textarea id="bl-ta" class="wr-ta" placeholder="Start typing… bullet points are fine."></textarea><div class="qactions"><button class="btn pri" onclick="blurtCheck()">${ico('checkc')}Check what I remembered</button><button class="btn" onclick="clearInterval(MSBL.tm);blurtStart(document.getElementById('wr-main'))">${ico('left')}Topics</button></div><div id="bl-res"></div></div>`;
  const ta=document.getElementById('bl-ta');ta&&ta.focus();
  MSBL.tm=setInterval(()=>{const e=document.getElementById('bl-tm');if(!e){clearInterval(MSBL.tm);return;}const s=Math.max(0,Math.round((MSBL.end-Date.now())/1000));e.textContent=s?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:"Time's up";if(!s){clearInterval(MSBL.tm);toast("Time's up — check what you remembered",'timer');}},1000);}
function blurtCheck(){if(!MSBL)return;clearInterval(MSBL.tm);const ans=document.getElementById('bl-ta').value;const t=MSBL.t;
  const got=t.pts.map(p=>msCovers(p,ans));const n=got.filter(Boolean).length;const pct=Math.round(100*n/Math.max(1,t.pts.length));
  const d=wGet();d.bl=d.bl||{};const prev=d.bl[t.ti];if(!prev||pct>=prev.p)d.bl[t.ti]={p:pct,t:Date.now()};wSet(d);if(ans.trim())logM('q',2);
  document.getElementById('bl-res').innerHTML=`<div class="wr-ms anim"><div class="ms-sug">${ico('target')}<span>You recalled about <b>${n} of ${t.pts.length}</b> mark-scheme points (${pct}%)${prev?` · previous best ${prev.p}%`:''}. Learn the ones you missed, then blurt again in a few days.</span></div>
<div class="eb-lbl">Remembered</div>${t.pts.filter((p,j)=>got[j]).map(p=>`<div class="bl-p ok">${ico('checkc')}<span>${esc(p)}</span></div>`).join('')||'<p class="muted">None spotted yet.</p>'}
<div class="eb-lbl" style="margin-top:12px">Missed — learn these</div>${t.pts.filter((p,j)=>!got[j]).map(p=>`<div class="bl-p no">${ico('xc')}<span>${esc(p)}</span></div>`).join('')||'<p class="muted">Nothing — brilliant!</p>'}</div>`;
  if(pct>=80)confetti(60);}

.ms-help{margin:14px 0 6px;display:grid;gap:8px}.ms-cmd{font-size:.9em;padding:9px 12px;border-radius:10px;background:color-mix(in srgb,var(--v4,#7c3aed) 10%,transparent)}
.ms-box{padding:9px 12px;border-radius:10px;font-size:.9em;border-left:3px solid}.ms-box ul{margin:4px 0 0 18px;padding:0}.ms-box p{margin:4px 0 0}

.bl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:14px 0}.bl-t{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;cursor:pointer;border-left:3px solid var(--c);font:inherit;color:inherit}.bl-t span{font-size:.82em;opacity:.7}
.bl-p{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:.92em}.bl-p.ok .ic{color:#16a34a}.bl-p.no .ic{color:#dc2626}.bl-p .ic{flex:none;margin-top:2px}`;document.head.appendChild(s);})();

/* ════════════════════════════════════════════════════════════
   TEST PREP (26 Oct 2026) — a tab for each upcoming class test.
   Curated packs come from src/tests.js (TPACKS); every test in the
   hub calendar for this subject also gets an automatic pack built
   from its topics. A pack shows until the end of its test day.
   Everything done here logs XP / study minutes to this subject.
   Storage <prefix>_tprep = {d:{pack:date}, k:{pack:i:bool}, kx:{..:1},
   w:{pack:wid:{n,best,max,last,at}}, a:{pack:wid:qi:text},
   s:{pack:wid:qi:mark}, pd:{pack:pi:{done,score,at}}}
════════════════════════════════════════════════════════════ */
/* NB: doRender below runs during app.js init, before this file's top-level code — so no const/let here that it needs */
function tpK(){return SUB.key+'_tprep';}
function tpGet(){try{const d=JSON.parse(localStorage.getItem(tpK())||'{}');return d&&typeof d==='object'&&!Array.isArray(d)?d:{};}catch(e){return{};}}
function tpSet(d){try{localStorage.setItem(tpK(),JSON.stringify(d));}catch(e){}}
function tpSub(d,k){d[k]=d[k]&&typeof d[k]==='object'?d[k]:{};return d[k];}
function tpHub(){try{const a=JSON.parse(localStorage.getItem('hub_exams')||'[]');return Array.isArray(a)?a.filter(e=>e&&e.sub===SUB.hub&&(e.type==='test'||e.type==='mock')&&e.date):[];}catch(e){return[];}}
function tpNorm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function tpTopicIds(names){const ids=[];(names||[]).forEach(n=>{const t=tpNorm(n);const T=CL.find(x=>tpNorm(x.name)===t)||CL.find(x=>t&&(tpNorm(x.name).includes(t)||t.includes(tpNorm(x.name))));if(T&&!ids.includes(T.id))ids.push(T.id);});return ids;}
/* all packs (curated + automatic) with their resolved date */
function tpAll(){const d=tpGet(),dd=d.d||{},hub=tpHub(),used=new Set(),out=[];
  (typeof TPACKS!=='undefined'?TPACKS:[]).forEach(p=>{let date=dd[p.id]||'';const h=hub.filter(e=>!used.has(e.id)&&tpTopicIds(e.topics).some(t=>p.topics.includes(t))).sort((a,b)=>a.date.localeCompare(b.date)).find(e=>e.date>=todayStr());
    if(h){used.add(h.id);if(!date)date=h.date;}out.push(Object.assign({},p,{date:date||p.date||'',hubId:h&&h.id}));});
  hub.forEach(e=>{if(used.has(e.id))return;const ids=tpTopicIds(e.topics);out.push({id:'hub-'+e.id,auto:1,title:(e.type==='mock'?'Mock':'Test')+(e.topics&&e.topics.length?': '+e.topics.join(', '):''),topics:ids.length?ids:CL.map(x=>x.id),date:e.date,hubId:e.id,intro:e.note||''});});
  return out;}
function tpActive(p){return !p.off&&(!p.date||p.date>=todayStr());}
function tpLive(){return tpAll().filter(tpActive).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));}
function tpDays(p){if(!p.date)return null;return Math.round((new Date(p.date+'T00:00')-new Date(todayStr()+'T00:00'))/864e5);}
function tpWhen(p){const n=tpDays(p);return n==null?'date not set':n<=0?'today':n===1?'tomorrow':'in '+n+' days';}
/* pack contents (auto packs are built from the checklist) */
function tpLessons(p){return p.lessons||ALL_LESSONS.filter(l=>!l.xs&&p.topics.includes(l.T.id)).map(l=>l.key);}
function tpKnow(p){if(p.know)return p.know;return p.topics.map(id=>CL.find(T=>T.id===id)).filter(Boolean).map(T=>({h:T.name,cl:T.id}));}
function tpWritten(p){if(p.written)return p.written;return WRITTEN.map((w,i)=>({w,i})).filter(x=>p.topics.includes(String(x.w.k).split(':')[0])).map(x=>x.i).slice(0,12);}
function tpTasks(p){const d=tpGet(),k=d.k||{},w=d.w||{},pd=d.pd||{},wd=(typeof wGet==='function'?wGet().q:{})||{};const t=[];
  tpKnow(p).forEach((g,gi)=>{if(g.cl){const T=CL.find(x=>x.id===g.cl);T.subs.forEach((s,si)=>s.pts.forEach((_,ii)=>t.push(!!checked[ik(T.id,si,ii)])));}else g.pts.forEach((_,i)=>t.push(!!k[p.id+':'+gi+':'+i]));});
  tpLessons(p).forEach(lk=>t.push(isTicked(lk)));(p.worksheets||[]).forEach(x=>t.push(!!w[p.id+':'+x.id]));(p.papers||[]).forEach((_,i)=>t.push(!!(pd[p.id+':'+i]&&pd[p.id+':'+i].done)));tpWritten(p).forEach(i=>t.push(wd[i]!=null));
  return{d:t.filter(Boolean).length,n:t.length};}
/* actions */
function tpSetDate(id,v){const d=tpGet();tpSub(d,'d')[id]=v;tpSet(d);
  const p=tpAll().find(x=>x.id===id);if(v&&p&&!p.auto&&!p.hubId){try{const a=JSON.parse(localStorage.getItem('hub_exams')||'[]');if(!a.some(e=>e.sub===SUB.hub&&e.date===v)){a.push({id:'tp'+Date.now().toString(36),type:'test',sub:SUB.hub,topics:p.topics.map(t=>(CL.find(x=>x.id===t)||{}).name).filter(Boolean),date:v,time:'09:00',note:p.title});localStorage.setItem('hub_exams',JSON.stringify(a));}}catch(e){}}
  toast(v?'Test date saved — it is on your Study Hub calendar too':'Date cleared','calendar');tpNav();render();}
function tpKnowTick(pid,gi,i,v){const d=tpGet(),id=pid+':'+gi+':'+i;tpSub(d,'k')[id]=v;if(v&&!tpSub(d,'kx')[id]){d.kx[id]=1;logM('t');}tpSet(d);render();}
function tpPaperDone(pid,i){const d=tpGet(),id=pid+':'+i,r=tpSub(d,'pd')[id]||{};const p=tpAll().find(x=>x.id===pid);const pp=p.papers[i];
  const mi=document.getElementById('tpm-'+i),sc=document.getElementById('tps-'+i);const mins=Math.max(0,Math.min(240,Math.round(+((mi&&mi.value)||pp.mins||0))));
  if(r.done){r.done=0;d.pd[id]=r;tpSet(d);toast('Unticked — the XP and minutes you logged are kept','checkc');render();return;}
  r.done=1;r.at=Date.now();if(sc&&sc.value!=='')r.score=+sc.value;d.pd[id]=r;tpSet(d);logM('p');if(mins)logFocus(mins);
  toast(`Past paper logged · +15 XP${mins?' · '+mins+' min of study':''}`,'trophy');confetti(60);render();}
function tpOpenWritten(i){go('written');setTimeout(()=>{if(document.getElementById('wr-main'))writtenOpen(i);},120);}
function tpFocus(){tmSet(25);tmToggle();toast('25-minute focus session started — the minutes count towards '+SUB.name,'timer');}

/* ── page ── */
function pageTest(el){const live=tpLive(),all=tpAll();const id=route[1];
  if(id){const p=all.find(x=>x.id===id);if(!p){el.innerHTML=`<div class="card empty">${ico('flag')}<p>That test pack has finished.</p><a class="btn pri" href="#test">See your tests</a></div>`;return;}
    if(route[2]==='cards'&&p.paper){tpCards(el,p);return;}
    if(route[2]==='paper'&&p.paper){tpPaper(el,p);return;}
    if(route[2]==='ws'){tpWorksheet(el,p,(p.worksheets||[]).find(w=>w.id===route[3]));return;}tpPack(el,p);return;}
  if(live.length===1){tpPack(el,live[0]);return;}
  const past=all.filter(p=>!tpActive(p));
