 Q('Which product is most likely to have price inelastic supply in the short run?',['Coffee beans','Plastic water bottles','Paper clips','T-shirts'],0,'Coffee plants take years to grow — supply can’t respond quickly.'),
 S('PES = %ΔQs ÷ %ΔP (positive).','> 1 elastic, < 1 inelastic, 0 perfectly inelastic, ∞ perfectly elastic.','Factors: factors of production, stocks, spare capacity, time.','Manufactured → elastic; primary → inelastic.')],9);

LS('el:3','1.1.4','Y','When people get richer, do they buy more or less of a good? Income elasticity of demand sorts goods into luxury, normal and inferior.',[
 FM('Income elasticity of demand','YED = % change in quantity demanded ÷ % change in income',[['Sign matters','positive = normal good, negative = inferior good'],['Size matters','above +1 = luxury']],'Define YED: “the responsiveness of quantity demanded to a change in income”.'),
 C('Interpreting YED',[
  ['YED above +1','Luxury good — demand rises faster than income, e.g. foreign holidays, sports cars.'],
  ['YED between 0 and +1','Normal necessity — demand rises, but more slowly than income, e.g. bread, toothpaste.'],
  ['YED positive (any)','Normal good — demand rises with income.'],
  ['YED negative','Inferior good — demand FALLS as income rises, e.g. supermarket value ranges, bus travel in some countries.']]),
 EX('Exam-style: calculate (2 marks)','Calculate, to two decimal places, the YED for a good if income increases by 7% and quantity demanded increases by 11%.',
  ['YED = %ΔQd ÷ %ΔY','= 11 ÷ 7','= 1.5714…','= <b>1.57</b> (to 2 d.p.) → a luxury (income elastic) good'],'YED = 1.57'),
 N('Incomes rise by 4% and the quantity demanded of value-brand pasta falls by 2%. Calculate YED.',-0.5,'−2 ÷ 4 = −0.5 → an inferior good.',null,'e.g. −0.5'),
 Q('YED for a good is −0.8. The good is…',['An inferior good','A luxury good','A normal necessity','Price inelastic'],0,'A negative YED means demand falls as income rises.'),
 Q('Incomes fall in a recession. Demand will fall most for goods with…',['A high positive YED (luxuries)','A negative YED','YED of zero','A low positive YED'],0,'Luxuries are most income-elastic — they are cut first.'),
 S('YED = %ΔQd ÷ %ΔY.','Positive = normal; above +1 = luxury; negative = inferior.','Recessions hurt sellers of luxuries; inferior goods may sell more.','Give answers to the decimal places asked.')],7);

LS('el:4','1.1.4','!','Elasticity is not just maths: businesses use it to set prices and the government uses it to choose what to tax and what to subsidise.',[
 C('Why businesses care',[
  ['Pricing','Inelastic demand → raise price to raise revenue. Elastic demand → cut price (e.g. sales, discounts).'],
  ['Passing on costs','With inelastic demand a firm can pass cost increases on to consumers without losing many sales.'],
  ['Planning for income changes (YED)','In a recession, luxury sellers (high YED) expect sales to fall; discount stores (inferior goods) may grow.'],
  ['Production planning (PES)','Firms with elastic supply can respond to sudden rises in demand and gain sales.']]),
 VS('Indirect taxes and PED',sdTax('tax'),`<ul class="blist"><li>An indirect tax shifts supply left by the amount of the tax.</li><li>Governments tax goods with <b>inelastic demand</b> (petrol, tobacco, alcohol):</li><li>— quantity falls only a little, so <b>tax revenue is high</b>;</li><li>— consumers pay most of the tax through higher prices.</li><li>BUT if the aim is to <b>cut consumption</b> (e.g. sugary drinks), a tax works better when demand is elastic.</li></ul>`),
 VS('Subsidies and elasticity',sdTax('subsidy'),`<ul class="blist"><li>A subsidy shifts supply right → lower price, higher quantity.</li><li>If demand is <b>elastic</b>, the lower price leads to a big rise in consumption — e.g. subsidised public transport or solar panels.</li><li>If demand is inelastic, the subsidy mostly just lowers the price and costs the government a lot for little change.</li></ul>`),
 EX('Exam-style: assess (outline answer)','Assess whether a tax on sugary drinks will reduce their consumption.',
  ['For: the tax shifts supply left → price rises → quantity demanded contracts → consumption falls.','Against: demand for sugary drinks may be <b>price inelastic</b> (habit, brand loyalty), so consumption falls only slightly.','Against: consumers may switch to untaxed sugary foods — a substitute effect.','Judgement: it depends on PED. It is most effective if demand is elastic AND there are cheap healthy substitutes, e.g. water or diet drinks.'],'Use PED as your “it depends on” factor'),
 Q('Why do governments often tax tobacco?',['Demand is price inelastic, so the tax raises a lot of revenue','Demand is price elastic, so smoking will stop completely','Supply is perfectly elastic','It is an inferior good'],0,'Inelastic demand → quantity falls only slightly → large tax revenue.'),
 S('Firms use PED for pricing and passing on costs; YED for planning around income changes.','Taxes raise most revenue on goods with inelastic demand.','Taxes cut consumption most when demand is elastic.','Subsidies boost consumption most when demand is elastic.')],7);

/* ════════════ 4 · MIXED ECONOMY & EXTERNALITIES ════════════ */
LS('mx:0','1.1.5','⚙','Who decides what gets produced — the market or the government? In a mixed economy, it is both.',[
 FM('Mixed economy','Mixed economy = resources allocated by BOTH the private sector AND the public sector',[['Private sector','owned and controlled by individuals and businesses — aims for profit'],['Public sector','owned and controlled by the government — aims to provide services for everyone']],'“What is meant by the term mixed economy?” (2): both sectors (1) + allocation of resources / market forces and government (1).'),
 C('Public v private sector',[
  ['Ownership','Private: individuals, shareholders. Public: the government (on behalf of citizens).'],
  ['Control','Private: owners and managers. Public: government ministers and public bodies.'],
  ['Aims','Private: profit, growth, market share. Public: provide essential services, welfare, fairness, low prices.'],
  ['Examples','Private: supermarkets, Apple, local cafés. Public: state schools, the army, the police, public hospitals.']]),
 C('The three economic questions',[
  ['What to produce?','Private sector: what consumers will pay for (demand). Public sector: essential services the market under-provides (defence, education).'],
  ['How to produce?','Private firms choose the cheapest method; the government sets rules (safety, minimum wage, pollution).'],
  ['For whom?','Private: those who can afford it. Public: free or subsidised services for everyone, funded by taxes.']]),
 I('Different economies, different mixes',[
  `The size of the public sector varies: in France or Sweden government spending is over 50% of GDP; in Singapore or Hong Kong it is much lower.`,
  `Countries with large public sectors provide more free healthcare, education and benefits — but need higher taxes.`,
  `Most countries today are mixed economies; none is purely market or purely planned.`]),
 Q('Which is the best definition of a mixed economy?',['Resources are allocated by both the private and public sectors','All businesses are owned by the government','Only private firms produce goods','The economy has both primary and secondary sectors'],0,'Mixed = private sector + public sector both allocate resources.'),
 Q('Which organisation is most likely to be in the public sector?',['A state hospital','A family-owned restaurant','A listed car company','A bank owned by shareholders'],0,'The public sector is owned and controlled by the government.'),
 S('Mixed economy = private + public sector allocate resources.','Compare sectors by ownership, control and aims.','What, how and for whom are answered by both markets and government.','The balance between sectors differs between countries.')],7);

LS('mx:1','1.1.5','✗','Markets are great at many things — but sometimes they get it wrong. That’s market failure, and it’s why governments step in.',[
 FM('Market failure','Market failure = when the free market leads to an inefficient allocation of resources',[['Inefficient','too much or too little of a good is produced compared with what is best for society']],'The spec links market failure to an inefficient allocation of resources — use that phrase.'),
 C('Examples of market failure',[
  ['External costs','Too much of goods that pollute, e.g. cars, plastic bags.'],
  ['External benefits','Too little of goods that benefit others, e.g. education, vaccinations.'],
  ['Public goods','Not provided at all by the market, e.g. street lighting.'],
  ['Monopoly power','A dominant firm restricts output and charges high prices.']]),
 FM('Public goods','Public good = NON-EXCLUDABLE + NON-RIVAL',[['Non-excludable','you can’t stop people who haven’t paid from using it'],['Non-rival','one person using it doesn’t reduce what’s left for others']],'Examples: street lighting, national defence, lighthouses, flood defences.'),
 I('The free rider problem',[
  `Because a public good is non-excludable, people can ${B('use it without paying')} — they “free ride”.`,
  `So private firms cannot make people pay → they cannot make a profit → <b>the market will not provide it</b>.`,
  `This is why governments provide public goods, paid for through ${B('taxation')}.`],chain(['Non-|excludable','People don’t|pay','No profit|for firms','Market|fails','Government|provides'],{steps:1})),
 Q('Street lighting is a public good because…',['It is non-excludable and non-rival','It is provided by the government','It is very expensive','It has external costs'],0,'Being provided by the government does not make something a public good — the two characteristics do.'),
 Q('The free rider problem means…',['People can benefit without paying, so firms won’t supply the good','People pay twice for a good','Firms charge too high a price','Consumers buy too much of a good'],0,'Free riders use the good without paying.'),
 S('Market failure = inefficient allocation of resources.','Causes include externalities, public goods and monopoly.','Public goods are non-excludable and non-rival.','Free rider problem → market won’t provide → government must.')],7);

LS('mx:2','1.1.5','⇄','Should the government run the railways, or sell them to private firms? Privatisation has winners and losers.',[
 FM('Privatisation','Privatisation = transferring ownership of a business from the public sector to the private sector',[['Opposite','nationalisation — private to public']],'Examples: UK telecoms, energy and rail; many airports and airlines worldwide (e.g. Lagos Airport concession).'),
 C('Effects on consumers',[
  ['✔ Lower prices / better quality','Competition and the profit motive push firms to be efficient and innovate.'],
  ['✔ More choice','New firms may enter the market.'],
  ['✘ Higher prices','A private monopoly may raise prices to maximise profit (e.g. water bills).'],
  ['✘ Loss of unprofitable services','Rural bus routes or post offices may be cut.']]),
 C('Effects on workers',[
  ['✘ Job losses','Private owners cut costs — often by reducing staff.'],
  ['✘ Worse conditions','Pressure to cut wages, pensions and job security.'],
  ['✔ Training & incentives','Some firms invest in staff and offer performance bonuses.']]),
 C('Effects on businesses and government',[
  ['Businesses ✔','New profit opportunities; access to finance from shareholders for investment.'],
  ['Government ✔','One-off revenue from the sale; no longer has to fund losses; can spend on other services.'],
  ['Government ✘','Loses future profits and control over an essential industry; may need to set up regulators.']]),
 EX('Exam-style: evaluate outline (12 marks)','Evaluate the likely impact on consumers of privatising a country’s main airport.',
  ['For: private owners aim for profit → <b>efficiency</b> rises, waiting times fall and facilities improve to attract airlines and passengers.','For: investment from private finance can expand terminals → more routes and choice.','Against: the airport is a <b>local monopoly</b> → it may raise landing fees and parking charges, which are passed on to passengers.','Against: cost cutting (fewer staff) could lower service quality and safety.','Judgement: depends on <b>regulation</b> (price caps, service standards), competition from other airports, and whether profits are reinvested.'],'Two sides + “it depends on regulation and competition”'),
 Q('Privatisation is…',['The transfer of a business from the public to the private sector','The government buying a private business','A firm becoming a monopoly','Removing rules from an industry'],0,'Public → private.'),
 S('Privatisation: public → private ownership.','Consumers: efficiency and choice v monopoly prices and lost services.','Workers: job losses and worse conditions v incentives.','Government: sale revenue v loss of control and future profits.')],7);

LS('mx:3','1.1.6','±','Some costs and benefits spill over onto people who aren’t buying or selling. These externalities are a major cause of market failure.',[
 I('What is an externality?',[
  `An ${B('externality')} is a cost or benefit that affects a ${B('third party')} — someone not directly involved in the transaction.`,
  `It is not included in the market price, so the market produces <b>too much</b> (external costs) or <b>too little</b> (external benefits).`]),
 C('External costs (negative externalities)',[
  ['Definition','A cost suffered by a third party that is not paid for by the producer or consumer.'],
  ['Pollution','Factory smoke harms local residents’ health; a chemical spill kills fish downstream.'],
  ['Congestion','Each extra car on the road slows down everyone else.'],
  ['Environmental damage','Deforestation, plastic waste in oceans, loss of wildlife.']]),
 C('External benefits (positive externalities)',[
  ['Definition','A benefit enjoyed by a third party who did not pay for it.'],
  ['Education','A better-educated workforce raises productivity for firms and tax revenue for the government.'],
  ['Healthcare','Healthy workers are more productive; fewer days lost to illness.'],
  ['Vaccinations','Vaccinating one person reduces the chance that others catch the disease (herd immunity).']]),
 VS('Social cost = private cost + external cost',socialBars({pc:60,ec:25}),`<ul class="blist"><li><b>Social costs = private costs + external costs</b>.</li><li>E.g. a factory’s private cost of a tonne of steel is $60; the pollution costs local people $25.</li><li>Social cost = $60 + $25 = <b>$85</b>.</li></ul>`),
 VS('Social benefit = private benefit + external benefit',socialBars({pc:40,ec:30,benefit:1}),`<ul class="blist"><li><b>Social benefits = private benefits + external benefits</b>.</li><li>E.g. a vaccination gives the patient a $40 benefit and protects others worth $30.</li><li>Social benefit = <b>$70</b>.</li></ul>`),
 N('A factory’s private costs are $2.4m a year. The external costs of its pollution are $0.9m. Calculate the social cost in $m.',3.3,'Social cost = 2.4 + 0.9 = $3.3m.',null,'$m'),
 Q('Which is an example of an external benefit?',['A neighbour’s beautiful garden that you enjoy','Your own wages from a job','Noise from a nightclub','Traffic congestion'],0,'You benefit without paying — a positive externality.'),
 S('Externality = effect on a third party, not in the price.','External costs: pollution, congestion, environmental damage.','External benefits: education, healthcare, vaccinations.','Social = private + external (for both costs and benefits).')],8);

/* ════════════ 5 · PRODUCTION, PRODUCTIVITY & COSTS ════════════ */
LS('pc:0','1.2.1','⚒','Every product needs land, labour, capital and enterprise — and every economy moves through primary, secondary and tertiary sectors as it develops.',[
 C('The four factors of production',[
  ['Land','All natural resources: soil, water, forests, oil, minerals, fish. Reward: rent.'],
  ['Labour','Human effort — physical and mental — used in production. Reward: wages.'],
  ['Capital','Man-made goods used to produce other goods: machinery, tools, factories, delivery vans. Reward: interest.'],
  ['Enterprise','The entrepreneur who organises the other factors and takes the risk. Reward: profit.']]),
 EX('Spot the factor','A bakery uses: (a) an oven (b) flour (c) bakers (d) the owner who started the business. Classify each.',
  ['(a) The oven is <b>capital</b> — a man-made good used to produce bread.','(b) Flour comes from wheat grown on land — a <b>natural resource (land)</b>.','(c) Bakers are <b>labour</b>.','(d) The owner who organises and takes risks is <b>enterprise</b>.'],'Capital · land · labour · enterprise'),
 VS('Sectors of the economy',sectorsFlow(),`<ul class="blist"><li><b>Primary</b>: extracting raw materials — farming, fishing, mining, forestry, oil drilling.</li><li><b>Secondary</b>: manufacturing and construction — car factories, food processing, building houses.</li><li><b>Tertiary</b>: services — banking, retail, tourism, teaching, healthcare, transport.</li></ul>`),
 I('How sectors change as countries develop',[
  `${B('Developing economies')}: most jobs and output are in the <b>primary</b> sector (e.g. agriculture in Ethiopia or Malawi).`,
  `As they industrialise, the <b>secondary</b> sector grows — factories attract workers from farms (e.g. China, Vietnam, Bangladesh).`,
  `${B('Developed economies')} (UK, USA, Singapore): the <b>tertiary</b> sector dominates — often 75–80% of employment and output.`,
  `Reasons: rising incomes increase demand for services (high YED); technology replaces farm and factory workers; manufacturing moves to lower-cost countries (deindustrialisation).`],bars({data:[['Primary',3,'v2'],['Secondary',18,'v1'],['Tertiary',79,'v4']],vals:1,max:90,w:380,h:220,mw:380}),'Typical developed economy: % of employment'),
 Q('A teacher works in which sector?',['Tertiary','Primary','Secondary','Public goods'],0,'Teaching is a service → tertiary.'),
 Q('The reward for capital is…',['Interest','Rent','Wages','Profit'],0,'Land → rent, labour → wages, capital → interest, enterprise → profit.'),
 S('Land, labour, capital, enterprise (rent, wages, interest, profit).','Primary = extract · secondary = make · tertiary = services.','Developing → primary-heavy; developed → tertiary-heavy.','Rising incomes and technology drive the shift to services.')],7);

LS('pc:1','1.2.2','⚡','Productivity is the secret to higher wages and living standards. Here’s how to measure it and how to raise it.',[
 FM('Productivity','Labour productivity = output ÷ number of workers (or hours worked)',[['Productivity','output per unit of input per period of time']],'Higher productivity → lower cost per unit → more competitive firms and higher wages.'),
 EX('Calculating labour productivity','A factory has 40 workers who make 12,000 shirts a week. After training, 40 workers make 13,800 shirts. Calculate productivity before and after, and the % increase.',
  ['Before: 12,000 ÷ 40 = <b>300 shirts per worker</b>','After: 13,800 ÷ 40 = <b>345 shirts per worker</b>','% change = (345 − 300) ÷ 300 × 100 = <b>15%</b>'],'Productivity rose by 15%'),
 C('Raising the productivity of land',[
  ['Fertiliser','Adds nutrients so each hectare yields more crops.'],
  ['Drainage','Removes excess water so waterlogged land can be farmed.'],
  ['Irrigation','Brings water to dry land, allowing more harvests per year.'],
  ['Reclamation','Creates new usable land, e.g. from the sea (Singapore, the Netherlands) or deserts.']]),
 C('Raising the productivity of labour',[
  ['Education','Better literacy, numeracy and skills → workers produce more and make fewer mistakes.'],
  ['Training','On-the-job training raises human capital and efficiency.'],
  ['Migration','Skilled migrants can fill skill shortages and raise output (emigration of skilled workers lowers it).'],
  ['Motivation','Better pay and conditions can increase effort.']]),
 C('Raising the productivity of capital',[
  ['More capital','More machines per worker → each worker produces more.'],
  ['Technological advances','Robots, AI, automation and faster computers produce more with the same inputs.']]),
 N('A call centre with 25 staff handles 6,000 calls a day. Calculate calls per worker.',240,'6,000 ÷ 25 = 240 calls per worker.',null,'calls'),
 Q('Which would most likely increase labour productivity?',['Training workers to use new software','Hiring more workers to do the same work','Increasing the price of the product','Reducing the length of the working day'],0,'Training raises human capital → more output per worker.'),
 S('Productivity = output per unit of input.','Land: fertiliser, drainage, irrigation, reclamation.','Labour: education, training, migration.','Capital: more capital and new technology.')],7);

LS('pc:2','1.2.2','⇶','Splitting a job into small tasks can multiply output — but it can also make work boring and risky.',[
 FM('Division of labour','Division of labour = production split into separate tasks, each done by a different worker',[['Specialisation','each worker concentrates on one task']],'Classic example: Adam Smith’s pin factory — 10 workers each doing one step made 48,000 pins a day.'),
 C('Advantages',[
  ['To businesses','Higher productivity and output; lower average costs; easier to use specialist machinery; less time lost switching tasks.'],
  ['To workers','Become very skilled and quick at their task; training is quicker; can earn more through productivity bonuses.']]),
 C('Disadvantages',[
  ['To workers','Boring, repetitive work → low motivation; skills are narrow, so harder to find another job (occupational immobility); risk of repetitive strain injuries.'],
  ['To businesses','Lower quality from bored workers; higher absence and staff turnover; if one stage breaks down or one worker is absent, the whole production line stops.']]),
 EX('Exam-style: explain one disadvantage to workers (3 marks)','A car factory has divided production into 200 separate tasks. Explain one disadvantage of the division of labour to its workers.',
  ['Workers do the same small task all day, so the work becomes <b>repetitive and boring</b>. (1)','This lowers motivation and job satisfaction. (1)','In a car factory, a worker who only fits wheels has narrow skills, so if the factory closes they may struggle to find a new job. (1)'],'Point → development → context'),
 Q('Which is an advantage of the division of labour for a business?',['Higher output per worker','Workers have a wider range of skills','Production cannot be stopped by absence','Work is more varied'],0,'Specialisation raises productivity.'),
 S('Division of labour = splitting production into tasks.','Business ✔ productivity, lower costs ✘ boredom, quality, breakdowns.','Workers ✔ skill, speed ✘ monotony, narrow skills, injury.','Always link to the context given.')],6);

LS('pc:3','1.2.3','$','Costs, revenue and profit: the numbers every business lives by — and a guaranteed calculation in Paper 1.',[
 C('The key terms',[
  ['Total revenue (TR)','Price × quantity sold.'],
  ['Fixed costs (FC)','Costs that do NOT change with output: rent, insurance, salaries, loan repayments.'],
  ['Variable costs (VC)','Costs that change directly with output: raw materials, packaging, hourly wages, energy for machines.'],
  ['Total cost (TC)','TFC + TVC.'],
  ['Average cost (AC)','TC ÷ output — the cost per unit.'],
  ['Profit','TR − TC (negative = a loss).']]),
 FM('The formulas','TR = P × Q · TC = TFC + TVC · AC = TC ÷ Q · Profit = TR − TC',[['TVC','variable cost per unit × quantity'],['Profit','can be negative (a loss)']],'Learn all five — none are given in the exam.'),
 EX('A full costs calculation','A bakery sells 2,000 loaves a week at $3 each. Rent and salaries cost $2,500 a week. Ingredients and packaging cost $1.20 per loaf. Calculate TR, TC, AC and profit.',
  ['TR = $3 × 2,000 = <b>$6,000</b>','TVC = $1.20 × 2,000 = $2,400 · TFC = $2,500','TC = 2,500 + 2,400 = <b>$4,900</b>','AC = 4,900 ÷ 2,000 = <b>$2.45 per loaf</b>','Profit = 6,000 − 4,900 = <b>$1,100</b>'],'Profit = $1,100 per week'),
 EX('Exam-style (2 marks)','A transport firm has fixed costs of $450 a day and variable costs of $3.50 per km. It drives 300 km a day. Calculate the daily total costs.',
  ['TVC = $3.50 × 300 = $1,050','TC = $450 + $1,050 = <b>$1,500</b>'],'TC = $1,500 per day'),
 N('A firm sells 500 units at $14 each. Its total costs are $5,200. Calculate its profit in $.',1800,'TR = $7,000; profit = 7,000 − 5,200 = $1,800.',null,'$'),
 N('Total costs are $18,000 for 1,200 units. Calculate the average cost per unit in $.',15,'18,000 ÷ 1,200 = $15.',null,'$'),
 Q('Which is a fixed cost for a restaurant?',['Monthly rent','Food ingredients','Napkins','Electricity for cookers per meal'],0,'Rent does not change with the number of meals.'),
 S('TR = P × Q.','TC = TFC + TVC; AC = TC ÷ Q.','Profit = TR − TC.','Fixed costs don’t change with output; variable costs do.')],8);

LS('pc:4','1.2.3','▼','Bigger firms can often produce more cheaply per unit. These are economies of scale — six internal types and four external types.',[
 FM('Economies of scale','Economies of scale = the fall in AVERAGE costs as a business increases its scale of production',[['Average cost','cost per unit, not total cost — total cost rises as output rises']],'Mention AVERAGE cost in every definition — “costs fall” is not enough.'),
 C('Six internal economies of scale',[
  ['Purchasing (bulk buying)','Large orders of raw materials get discounts → lower cost per unit.'],
  ['Marketing','An advertising campaign costs the same however much is sold → lower cost per unit sold.'],
  ['Technical','Large firms afford advanced machinery and production lines (e.g. robots in car plants).'],
  ['Financial','Banks see large firms as less risky → cheaper loans with lower interest rates.'],
  ['Managerial','Large firms employ specialist managers (finance, HR, marketing) → better decisions.'],
  ['Risk-bearing','Selling many products in many countries spreads risk — a fall in one market is offset by others.']]),
 C('External economies of scale',[
  ['Skilled labour','When an industry concentrates in one area, local colleges train the workers it needs.'],
  ['Infrastructure','Governments build roads, ports and broadband in industrial areas.'],
  ['Access to suppliers','Specialist suppliers set up nearby, cutting transport costs and delays.'],
  ['Similar businesses in the area','Firms share ideas, research and services — e.g. tech firms in Silicon Valley or Bangalore.']]),
 I('Internal v external',[
  `${B('Internal')}: come from the growth of the <b>firm itself</b>.`,
  `${B('External')}: come from the growth of the <b>industry or area</b> — every firm in the area benefits.`],lracDiagram({s2:9})),
 Q('A supermarket chain gets a 20% discount by buying 1 million cans. This is…',['A purchasing economy of scale','A technical economy of scale','An external economy of scale','A diseconomy of scale'],0,'Bulk buying = purchasing economy.'),
 Q('A university near a cluster of software firms trains programmers. For the firms this is…',['An external economy of scale (skilled labour)','A financial economy','A managerial economy','A diseconomy'],0,'It comes from the area/industry, not the firm itself.'),
 S('Economies of scale = AVERAGE costs fall as scale rises.','Internal: purchasing, marketing, technical, financial, managerial, risk-bearing.','External: skilled labour, infrastructure, suppliers, similar firms nearby.','Internal = firm grows; external = industry/area grows.')],8);

LS('pc:5','1.2.3','▲','Grow too big and costs start rising again. Diseconomies of scale explain why the LRAC curve is U-shaped.',[
 FM('Diseconomies of scale','Diseconomies of scale = the RISE in average costs as a business becomes too large',[['Cause','the firm becomes harder to manage and coordinate']],'They are the reason firms don’t grow forever.'),
 C('Causes of diseconomies of scale',[
  ['Bureaucracy','Too many layers of management and paperwork → slow decisions.'],
  ['Communication problems','Messages pass through many people, get distorted or arrive late.'],
  ['Lack of control','Managers cannot monitor everyone → waste and inefficiency.'],
  ['Distance between top and bottom','Workers feel unimportant and unmotivated; managers lose touch with customers.']]),
 VS('The LRAC curve',lracDiagram({}),`<ul class="blist"><li>Left part: <b>economies of scale</b> — AC falls as output rises.</li><li>Bottom: the <b>most efficient</b> (optimum) output Q* — lowest average cost.</li><li>Right part: <b>diseconomies of scale</b> — AC rises as the firm gets too big.</li><li>Exam tip: annotate all three on the curve and label the axes “Average cost” and “Output”.</li></ul>`),
 W('LRAC explorer','lrac','Slide the output to see which part of the curve the firm is on.'),
 EX('Exam-style: explain (3 marks)','A global retailer has grown to 9,000 stores. Explain one diseconomy of scale it may suffer.',
  ['With 9,000 stores there are many layers of management → <b>communication problems</b>. (1)','Instructions from head office take a long time to reach store staff or get misunderstood. (1)','This causes mistakes and slow responses to local customers, raising <b>average costs</b>. (1)'],'Name it → explain → link to average cost'),
 Q('On an LRAC curve, the most efficient output is…',['Where average cost is lowest','Where output is highest','Where total cost is lowest','Where diseconomies begin to fall'],0,'The minimum point of LRAC.'),
 S('Diseconomies = average costs RISE as the firm grows too large.','Causes: bureaucracy, communication, control, distance.','LRAC is U-shaped: economies → optimum → diseconomies.','Annotate all three on the diagram.')],7);

/* ════════════ 6 · COMPETITION & THE LABOUR MARKET ════════════ */
LS('cl:0','1.2.4','⚔','Competition keeps firms on their toes — but it can also hurt them. Learn the five headings examiners use.',[
 C('Advantages of competition',[
  ['Price','Firms cut prices to win customers → consumers pay less.'],
  ['Efficiency','Firms must keep costs low or lose out to rivals → fewer wasted resources.'],
  ['Choice','More firms → more products, styles and brands for consumers.'],
  ['Quality','Firms improve quality and service to keep customers.'],
  ['Innovation','Firms develop new products and methods to stay ahead (e.g. smartphones).']]),
 C('Disadvantages of competition',[
  ['For firms','Lower prices squeeze profit margins; weaker firms may close; less money for research.'],
  ['For workers','Pressure to cut costs may mean job losses or lower wages.'],
  ['For consumers','Firms may cut corners on quality to cut costs; fewer economies of scale if each firm is small.'],
  ['For the economy','Duplication of resources (e.g. several firms building similar networks).']]),
 EX('Exam-style: analyse (6 marks)','Analyse two benefits to consumers of increased competition in the mobile phone network market.',
  ['<b>Lower prices</b>: with more networks, each one cuts prices or offers more data to attract customers…','…so consumers pay less per GB, increasing their real income and allowing them to spend more elsewhere.','<b>Innovation and quality</b>: networks compete by investing in faster 5G coverage and better customer service…','…so consumers get faster speeds and better reliability, improving their benefit from the service.'],'Two points, each with a chain and context'),
 Q('Which is most likely a benefit of competition to consumers?',['Lower prices','Higher profits for firms','Fewer products','More collusion'],0,'Rivalry pushes prices down.'),
 S('Five headings: efficiency, choice, quality, innovation, price.','Benefits to consumers and the economy.','Costs to firms: lower profits, possible closure.','Use chains of reasoning in analyse answers.')],6);

LS('cl:1','1.2.4','◐','Why do some firms grow into giants while others stay small on purpose?',[
 C('Large firms',[
  ['✔ Economies of scale','Lower average costs → lower prices or higher profits.'],
  ['✔ Finance & risk','Easier to borrow; can spread risk across products and countries.'],
  ['✔ Research','Can afford research and development (R&D) → innovation.'],
  ['✘ Diseconomies of scale','Bureaucracy, slow decisions, poor communication.'],
  ['✘ Less personal','Lose touch with customers; may abuse market power.']]),
 C('Small firms',[
  ['✔ Flexible','Quick decisions; can adapt to changing tastes.'],
  ['✔ Personal service','Know their customers; serve niche markets.'],
  ['✘ Higher costs','No economies of scale → higher average costs and prices.'],
  ['✘ Finance & risk','Harder to raise finance; depend on one product or area.']]),
 C('Why firms grow',[
  ['Government regulation','Supportive rules or grants can help firms expand (strict rules on mergers can stop them).'],
  ['Access to finance','Loans or selling shares fund expansion.'],
  ['Economies of scale','Growing lowers average costs.'],
  ['Spreading risk','Selling more products or in more countries reduces risk.'],
  ['Taking over competitors','Buying rivals increases market share and reduces competition.']]),
 C('Why firms stay small',[
  ['Size of market','A small local market can only support a small firm (e.g. a village shop).'],
  ['Niche market','Specialist products have few customers (e.g. hand-made guitars).'],
  ['Lack of finance','Banks may refuse loans to small, risky firms.'],
  ['Aims of the entrepreneur','The owner may want control, a work-life balance or personal service.']]),
 EX('Exam-style: analyse (6 marks)','Anastasia runs a martial arts club in Budapest and is considering opening a second club. Analyse two factors influencing her decision.',
  ['<b>Access to finance</b>: a second club needs premises and equipment. If Anastasia can get a bank loan or use profits from her “successful few years”, expansion is possible…','…without finance she cannot pay the start-up costs, so she would stay small.','<b>Size of the market</b>: demand from children and adults in another district must be big enough…','…if there are already rival clubs there, the new club may not attract enough members to cover its costs.'],'Two factors, each developed, using the context'),
 Q('Which is a reason a firm might stay small?',['It serves a niche market','It wants economies of scale','It wants to spread risk','It wants to take over competitors'],0,'Niche markets have limited demand.'),
 S('Large firms: economies of scale, finance, risk-spreading v diseconomies.','Small firms: flexible and personal v higher costs and finance problems.','Growth: regulation, finance, economies of scale, risk, takeovers.','Stay small: market size, niche, finance, owner’s aims.')],8);

LS('cl:2','1.2.4','①','When one firm dominates a market it becomes a price-maker. Is monopoly always bad?',[
 FM('Monopoly','Monopoly = a market dominated by ONE business',[['Price-maker','it can set the price because consumers have no close substitutes']],'Examples: national water or rail companies, patented medicines, Google in search.'),
 C('Features of monopoly',[
  ['One business dominates','Very high market share.'],
  ['Unique product','No close substitutes.'],
  ['Price-maker','Sets its own price (but can’t control demand).'],
  ['Barriers to entry','Stop new firms competing.']]),
 C('Barriers to entry',[
  ['Legal barriers','Licences or laws allow only one supplier (e.g. a state postal service).'],
  ['Patents','Stop rivals copying an invention for up to 20 years (e.g. new medicines).'],
  ['Marketing budgets','Huge advertising spending and brand loyalty make it hard for newcomers.'],
  ['Technology','The monopolist owns technology others can’t match.'],
  ['High start-up costs','Building a railway network or a mobile network costs billions.']]),
 C('Evaluating monopoly',[
  ['✘ Price','Can charge higher prices and restrict output.'],
  ['✘ Choice & quality','Consumers have no alternative; little pressure to improve quality.'],
  ['✘ Efficiency','No competition → may become lazy and wasteful.'],
  ['✔ Economies of scale','A single large firm can have much lower average costs (natural monopoly).'],
  ['✔ Innovation','High profits fund research — patents reward invention.']]),
 Q('Which is a feature of a monopoly?',['The firm is a price-maker','Consumers have a choice of firms','There are many firms competing','There are low barriers to entry'],0,'June 2024 Paper 1 MCQ — monopolists are price-makers.'),
 Q('A pharmaceutical firm is the only one allowed to sell a new drug for 20 years. The barrier to entry is…',['A patent','A marketing budget','High start-up costs','Collusion'],0,'Patents legally protect inventions.'),
 S('Monopoly: one dominant firm, unique product, price-maker, barriers to entry.','Barriers: legal, patents, marketing, technology, start-up costs.','Bad: high prices, little choice, inefficiency.','Good: economies of scale, profits fund innovation.')],7);

LS('cl:3','1.2.4','③','Supermarkets, airlines, phone networks: many markets are run by a few giants. Oligopolies compete — and sometimes collude.',[
 FM('Oligopoly','Oligopoly = a market dominated by a FEW large firms',[['Interdependent','each firm watches and reacts to its rivals’ prices and actions']],'Examples: supermarkets, mobile networks, car makers, airlines, banks, soft drinks.'),
 C('Features of oligopoly',[
  ['Few firms, large firms dominate','e.g. the four largest supermarkets have most of the market.'],
  ['Different (branded) products','Coca-Cola v Pepsi.'],
  ['Barriers to entry','High start-up and marketing costs.'],
  ['Non-price competition','Advertising, loyalty cards, quality, service, brand image.'],
  ['Price competition','Occasional price wars.'],
  ['Collusion','Firms may secretly agree to fix prices or share markets (illegal in most countries).']]),
 C('Evaluating oligopoly',[
  ['✔ Choice & quality','Firms compete with branding and quality — lots of product variety.'],
  ['✔ Innovation','Big profits fund research; firms innovate to beat rivals.'],
  ['✔ Price wars','Consumers benefit from very low prices for a time.'],
  ['✘ Collusion & cartels','Firms fix high prices, e.g. OPEC restricting oil output.'],
  ['✘ Price wars (for firms)','Profits fall; weaker firms may be forced out, reducing competition later.']]),
 Q('Which is a feature of an oligopoly?',['A few large firms dominate the market','One firm supplies the whole market','There are thousands of small firms','There are no barriers to entry'],0,'Few large firms.'),
 Q('Supermarkets competing with loyalty cards and adverts is an example of…',['Non-price competition','Collusion','A price war','A cartel'],0,'Competing without changing price.'),
 S('Oligopoly: a few large firms dominate.','Features: barriers, branded products, non-price competition, collusion, price wars.','Pros: choice, quality, innovation. Cons: collusion and cartels fixing high prices.','“Describe one feature” = feature + development (2 marks).')],6);

LS('cl:4','1.2.5','👥','Wages are prices too — the price of labour. The labour market has its own demand and supply.',[
 C('Demand for labour',[
  ['Derived demand','Demand for labour comes from demand for the final product — more demand for cars → more car workers needed.'],
  ['Substitutes (incl. machines)','If machines or cheaper workers abroad can do the job, demand for labour falls.'],
  ['Productivity','More productive workers are worth more to employers → higher demand.']]),
 C('Supply of labour',[
  ['Population size','More people of working age → more supply.'],
  ['Migration','Immigration increases supply; emigration reduces it.'],
  ['Age distribution','An ageing population reduces the share of working-age people.'],
  ['Retirement age','A higher retirement age increases supply.'],
  ['School-leaving age','A higher school-leaving age reduces supply (young people stay in education).'],
  ['Female participation','More women working increases supply (childcare, equal pay, flexible work).'],
  ['Skills & qualifications','Supply of workers for skilled jobs (doctors) is limited.'],
  ['Mobility','Geographical and occupational mobility let workers move to where jobs are.']]),
 I('Why quantity and quality of labour matter to a business',[
  `${B('Quantity')}: enough workers to meet demand — shortages lead to unfilled orders or higher wages.`,
  `${B('Quality')}: skilled, productive workers lower average costs, raise quality and support innovation.`]),
 Q('An increase in which is most likely to DECREASE the supply of labour?',['The school-leaving age','The retirement age','The population','The demand for the final product'],0,'June 2024 Paper 1 MCQ — staying in education longer reduces the number of workers.'),
 Q('Demand for labour is a derived demand because…',['It depends on demand for the goods the labour produces','Workers derive satisfaction from work','It comes from the government','It is fixed by trade unions'],0,'Derived from demand for the final product.'),
 S('Demand for labour: derived demand, substitutes (machines), productivity.','Supply: population, migration, age structure, retirement & school-leaving ages, female participation, skills, mobility.','Quantity and quality of labour both matter to firms.')],6);

LS('cl:5','1.2.5','W','Put demand and supply for labour together to get the wage. Education, training and trade unions all push wages up.',[
 VS('The labour market',labourDiagram({}),`<ul class="blist"><li>Axes: <b>wage rate</b> and <b>quantity of labour</b> (employment).</li><li>DL slopes down: at lower wages, firms employ more workers.</li><li>SL slopes up: higher wages attract more people to work.</li><li>Equilibrium wage We and employment Qe where DL = SL.</li></ul>`),
 VS('Shifts in the labour market',labourDiagram({d:2}),`<ul class="blist"><li><b>Demand for labour increases</b> (e.g. a boom in demand for the product) → DL shifts right → wage ↑, employment ↑.</li><li><b>Supply increases</b> (e.g. immigration) → SL shifts right → wage ↓, employment ↑.</li><li><b>Supply decreases</b> (e.g. stricter training requirements) → wage ↑, employment ↓.</li></ul>`),
 W('Labour market lab','labour','Shift demand and supply for labour and watch the wage and employment.'),
 I('Education, training & human capital',[
  `Education and training increase ${B('human capital')} — skills and knowledge.`,
  `Workers become more productive → firms’ demand for them rises → <b>higher wages</b>.`,
  `It also improves occupational mobility: workers can move into new, growing industries.`]),
 C('Trade unions',[
  ['What they are','Organisations of workers that bargain with employers (collective bargaining).'],
  ['Aims','Higher wages, better working conditions, job security, health and safety, fair treatment.'],
  ['Methods','Negotiation; industrial action — strikes, overtime bans, working to rule.'],
  ['Impact','Can raise wages above equilibrium — but may reduce employment if firms cut jobs or switch to machines.']]),
 Q('Large-scale immigration of nurses into a country will most likely…',['Lower nurses’ wages and increase employment','Raise nurses’ wages and reduce employment','Shift demand for nurses left','Have no effect'],0,'Supply of labour shifts right → wage falls, employment rises.'),
 S('Labour market diagram: wage rate v quantity of labour.','DL right → W↑ Q↑; SL right → W↓ Q↑.','Education & training → human capital → productivity → higher wages.','Trade unions: collective bargaining for pay and conditions.')],8);

/* ════════════ 7 · GOVERNMENT INTERVENTION ════════════ */
LS('gi:0','1.2.6','⛨','The government has five tools to tackle externalities. Each one has strengths and weaknesses — perfect material for 9 and 12-mark questions.',[
 C('Five policies',[
  ['Taxation','An indirect tax on harmful goods (e.g. carbon tax, fuel duty) raises the price → consumption falls; revenue can fund clean-up.'],
  ['Subsidies','Payments to producers of beneficial goods (e.g. electric cars, public transport, vaccines) → lower price → more consumption.'],
  ['Fines','Penalties for polluting or breaking rules (e.g. fly-tipping, illegal dumping).'],
  ['Regulation','Laws that limit or ban activities: emission limits, bans on single-use plastic bags, compulsory vaccinations.'],
  ['Pollution permits','Firms get permits for a set amount of pollution; firms that pollute less can sell permits.']]),
 VS('Tax on a good with external costs',sdTax('tax'),`<ul class="blist"><li>The tax shifts supply left → price rises → quantity falls from Q to Q₁.</li><li>Less pollution; the government gains tax revenue.</li><li>BUT if demand is <b>inelastic</b>, quantity hardly falls.</li></ul>`),
 VS('Subsidy for a good with external benefits',sdTax('subsidy'),`<ul class="blist"><li>The subsidy shifts supply right → price falls → quantity rises.</li><li>More consumption of e.g. public transport or vaccinations.</li><li>BUT it has an opportunity cost — the money could be spent elsewhere.</li></ul>`),
 C('Evaluation of each policy',[
  ['Tax','✔ raises revenue, uses the price mechanism ✘ regressive, hard to set the right rate, weak if demand is inelastic.'],
  ['Subsidy','✔ encourages good behaviour ✘ costly to taxpayers; opportunity cost; firms may become dependent.'],
  ['Fine','✔ deters bad behaviour ✘ needs enforcement; may be too small to matter to large firms.'],
  ['Regulation','✔ simple and clear, can ban the worst harm ✘ costly to monitor; firms may break rules; no revenue.'],
  ['Pollution permits','✔ caps total pollution; rewards clean firms ✘ hard to set the right number; big firms may just buy permits.']]),
 EX('Exam-style: assess (9 marks) — Kenya’s plastic bag ban','Assess the effectiveness of government regulation when dealing with externalities such as pollution.',
  ['For: a ban (regulation) directly <b>removes</b> the source of the external cost — Kenya’s streets became cleaner and fewer livestock died from eating bags.','For: it is simple to understand and doesn’t rely on price elasticity.','Against: regulation must be <b>enforced</b>; the extract says the ban “has not been effective in totally removing the problem” — illegal bags are smuggled in.','Against: monitoring is costly and raises no revenue, unlike a tax.','Judgement: effective if enforcement is strong and alternatives (cloth bags) are cheap — otherwise combine regulation with fines or a tax.'],'Both sides + judgement with an “it depends” factor'),
 Q('Which policy would raise revenue for the government while reducing pollution?',['A tax on polluting goods','A subsidy for electric cars','A ban on plastic bags','Free public transport'],0,'Taxes raise revenue AND raise the price of the harmful good.'),
 S('Five tools: tax, subsidy, fine, regulation, pollution permits.','Tax shifts S left; subsidy shifts S right.','Evaluate: enforcement, cost, revenue, PED, opportunity cost.','“Assess” = both sides + judgement.')],9);

LS('gi:1','1.2.6','⚖','Monopolies and cartels can harm consumers. Governments use competition policy to keep markets fair.',[
 C('Why regulate competition?',[
  ['Promote competition','More firms → lower prices, more choice and innovation.'],
  ['Limit monopoly power','Stop dominant firms charging excessive prices or blocking rivals.'],
  ['Protect consumers','Ban false advertising, unsafe products and unfair contracts.'],
  ['Control mergers and takeovers','Block mergers that would create a firm with too much market share.']]),
 C('How governments do it',[
  ['Competition authorities','e.g. the UK Competition and Markets Authority (CMA), the European Commission — investigate and fine firms.'],
  ['Fines for collusion','Cartels can be fined up to 10% of global turnover.'],
  ['Blocking or conditions on mergers','A merger may be allowed only if the firms sell some stores or brands.'],
  ['Price caps','Regulators cap prices in privatised monopolies (e.g. water, energy).'],
  ['Breaking up firms','Splitting a monopoly into competing firms.'],
  ['Consumer protection laws','Product safety standards, refund rights, honest labelling.']]),
 C('Evaluation',[
  ['✔','Lower prices, more choice and innovation for consumers.'],
  ['✘','Investigations are slow and expensive; firms find ways around rules.'],
  ['✘','Blocking mergers may prevent economies of scale that would lower prices.'],
  ['Depends on','Size of fines, resources of the regulator, how global the market is.']]),
 Q('A government blocks a merger between the two largest supermarkets. The main aim is to…',['Promote competition and protect consumers','Increase economies of scale','Raise tax revenue','Reduce the supply of labour'],0,'Merger control limits monopoly power.'),
 S('Aims: promote competition, limit monopoly power, protect consumers, control mergers.','Tools: competition authorities, fines, merger control, price caps, consumer laws.','Evaluate: cost, speed, lost economies of scale.')],6);

LS('gi:2','1.2.6','₥','A minimum wage protects low-paid workers — but set it too high and it could cost jobs. Learn the diagram and both sides.',[
 FM('Minimum wage','Minimum wage = the lowest hourly wage employers are allowed to pay by law',[['Set above equilibrium','to have any effect it must be above the market wage']],'Weekly pay = hourly wage × hours (MCQ: €6.04 × 35 = €211.40).'),
 VS('Introducing a minimum wage',labourDiagram({mw_:1}),`<ul class="blist"><li>The minimum wage (Wmin) is set <b>above</b> the equilibrium wage We.</li><li>At Wmin, firms demand fewer workers (QD) but more people want to work (QS).</li><li>The gap QS − QD is <b>excess supply of labour = unemployment</b>.</li><li>Raising the minimum wage further makes the gap wider.</li></ul>`),
 C('Reasons for a minimum wage',[
  ['Reduce poverty','Raises the incomes of the lowest paid.'],
  ['Fairness','Prevents exploitation of workers with little bargaining power.'],
  ['Incentive to work','Makes work pay more than benefits.'],
  ['Productivity','Better-paid workers may be more motivated.']]),
 C('Advantages v disadvantages',[
  ['✔ Higher incomes','Low-paid workers earn more → more spending in the economy.'],
  ['✔ Less government spending','Fewer in-work benefits needed.'],
  ['✘ Unemployment','Higher labour costs → firms employ fewer workers or use machines.'],
  ['✘ Higher prices','Firms pass on higher costs to consumers (cost-push inflation).'],
  ['✘ Competitiveness','Exporters face higher costs than foreign rivals.']]),
 W('Minimum wage lab','minwage','Raise the minimum wage and watch the unemployment gap.'),
 N('The minimum wage is $11.40 an hour. Calculate the weekly pay for a worker who works 38 hours.',433.2,'11.40 × 38 = $433.20.',null,'$'),
 Q('A minimum wage set ABOVE the equilibrium wage is most likely to cause…',['An excess supply of labour','An excess demand for labour','No change in employment','A fall in wages'],0,'More people want to work than firms want to hire.'),
 S('Minimum wage: legal lowest hourly pay, set above equilibrium.','Diagram: Wmin above We → excess supply of labour (unemployment).','Pros: incomes, fairness, incentives. Cons: jobs, prices, competitiveness.','Effect depends on how far above equilibrium it is set and on PED for labour.')],8);

/* ════════════ 8 · MACROECONOMIC OBJECTIVES ════════════ */
LS('mo:0','2.1.1','GDP','Governments want the economy to grow. GDP measures that growth — but it doesn’t tell the whole story.',[
 C('The six macroeconomic objectives',[
  ['Economic growth','A rising real GDP.'],['Low and stable inflation','Often a 2% target.'],['Low unemployment','Jobs for those who want them.'],['Current account balance or surplus','Exports at least matching imports.'],['Protecting the environment','Sustainable growth.'],['Redistribution of income','Less inequality and poverty.']]),
 FM('Economic growth','Economic growth = an increase in real GDP (output of goods and services) over time',[['GDP','the total value of all goods and services produced in a country in a year'],['Real','adjusted for inflation']],'Growth rate = (GDP this year − GDP last year) ÷ GDP last year × 100'),
 EX('Calculating the growth rate','Real GDP rises from $480bn to $498bn. Calculate the growth rate.',['Change = 498 − 480 = $18bn','Growth = 18 ÷ 480 × 100','= <b>3.75%</b>'],'Economic growth = 3.75%'),
 C('Limitations of GDP',[
  ['Inflation','Nominal GDP can rise just because prices rise — use REAL GDP.'],
  ['Population','GDP may grow but GDP per person may fall if population grows faster.'],
  ['Hidden economy','Cash-in-hand work and illegal activity are not recorded.'],
  ['Non-market activity','Housework, caring and volunteering add value but are not counted.'],
  ['Inequality','Average figures hide whether the gains go to a few rich people.'],
  ['Quality of life','GDP ignores pollution, working hours, health, happiness and leisure.']]),
 C('Impact of economic growth',[
  ['Employment','Firms produce more → hire more workers → unemployment falls.'],
  ['Living standards','Higher incomes → more goods and services per person.'],
  ['Poverty','More jobs and higher tax revenue to fund benefits → poverty falls (if growth is shared).'],
  ['Productive potential','Investment during growth raises future capacity.'],
  ['Inflation','Fast growth can push demand above capacity → demand-pull inflation.'],
  ['Environment','More production → more pollution, resource depletion and waste.']]),
 N('GDP was $2.0 trillion and is now $2.07 trillion. Calculate the growth rate in %.',3.5,'0.07 ÷ 2.0 × 100 = 3.5%.',null,'%'),
 Q('Which is a limitation of using GDP to compare living standards?',['It does not include the hidden economy','It measures output','It is measured in money','It is published every year'],0,'Unrecorded activity means GDP underestimates true output.'),
 S('Growth = rise in real GDP over time.','Growth rate = change ÷ old × 100.','GDP limitations: inflation, population, hidden economy, inequality, quality of life.','Impacts: jobs, living standards, poverty, capacity — but inflation and environment.')],8);

LS('mo:1','2.1.1','∿','Economies don’t grow smoothly — they go through booms and recessions. The economic cycle shows how.',[
 VS('The economic cycle',cycleDiagram({steps:1}),`<ul class="blist"><li>Real GDP fluctuates around its long-run <b>trend</b>.</li><li>Four stages: <b>boom → downturn → recession → recovery</b>.</li><li>A recession is negative growth for two consecutive quarters.</li></ul>`),
 C('What happens in each stage',[
  ['Boom','Growth fast · unemployment LOW · inflation RISING (demand exceeds capacity) · confidence high.'],
  ['Downturn','Growth slows · unemployment starts to rise · inflation eases.'],
  ['Recession','Growth NEGATIVE · unemployment HIGH (cyclical) · inflation low, maybe deflation · confidence low.'],
  ['Recovery','Growth returns · unemployment starts to fall · inflation starts to rise.']]),
 W('Economic cycle explorer','cycle','Slide through time to see the stage and what happens to growth, inflation and unemployment.'),
 EX('Exam-style: draw (3 marks)','Draw and label the economic cycle.',['Axes: real GDP (y) and time (x).','A wave around an upward-sloping trend line.','Label boom (peak), downturn, recession (trough) and recovery.'],'Labelled axes + wave + four stages'),
 Q('During a recession, which is most likely?',['Rising unemployment and low inflation','Falling unemployment and rising inflation','Rapid growth','A rise in business confidence'],0,'Output falls → firms cut jobs → cyclical unemployment.'),
 Q('Which stage follows a boom?',['Downturn','Recovery','Recession','Trend'],0,'Boom → downturn → recession → recovery.'),
 S('Cycle: boom, downturn, recession, recovery around a trend.','Boom: low unemployment, rising inflation.','Recession: negative growth, high unemployment, low inflation.','Know the effect of each stage on growth, inflation and unemployment.')],7);

LS('mo:2','2.1.1','CPI','Inflation is a sustained rise in the general price level. Here’s how it’s measured with the consumer price index.',[
 C('Key definitions',[
  ['Inflation','A SUSTAINED rise in the GENERAL price level.'],
  ['Deflation','A sustained fall in the general price level (negative inflation).'],
  ['Disinflation','The inflation rate falls but is still positive — prices rise more slowly.'],
  ['Hyperinflation','Extremely high inflation, e.g. Zimbabwe 2008, Venezuela 2018.']]),
 I('Measuring inflation: the CPI',[
  `A ${B('basket')} of ~700 goods and services that typical households buy is priced every month.`,
  `Each item has a ${B('weight')} showing its share of household spending (e.g. food 11%, transport 15%).`,
  `Prices are compared with a ${B('base year')} where the index = 100.`,
  `The <b>inflation rate</b> is the % change in the CPI over 12 months.`],lineChart({data:[['2019',1.8],['2020',0.9],['2021',2.6],['2022',9.1],['2023',7.3],['2024',2.5],['2025',3.4]],unit:'%',vals:1,yl:'UK CPI inflation (annual %)',min:0,max:10}),'UK inflation peaked in 2022 after energy prices soared'),
 FM('Inflation rate from index numbers','Inflation = (CPI this year − CPI last year) ÷ CPI last year × 100',[['Index of 100','the base year'],['Index of 112','prices are 12% higher than in the base year']],'An index rising from 125 to 130 is NOT 5% inflation — it is 5 ÷ 125 × 100 = 4%.'),
 EX('Calculate inflation','The CPI was 125.0 last year and is 130.0 this year. Calculate the inflation rate.',['Change = 130.0 − 125.0 = 5.0','Inflation = 5.0 ÷ 125.0 × 100','= <b>4%</b>'],'Inflation = 4%'),
 N('The CPI rises from 108 to 113.4. Calculate the rate of inflation in %.',5,'5.4 ÷ 108 × 100 = 5%.',null,'%'),
 Q('Inflation falls from 6% to 3%. This means prices are…',['Still rising, but more slowly','Falling','Constant','Rising faster'],0,'Disinflation — prices still rise.'),
 S('Inflation = sustained rise in the general price level.','Deflation = sustained fall; disinflation = slower rise.','CPI: weighted basket, base year 100.','Inflation % = change in index ÷ old index × 100.')],7);

LS('mo:3','2.1.1','↑£','Why do prices rise, and why does it matter? Demand-pull, cost-push, and the many costs of inflation.',[
 C('Two types of inflation',[
  ['Demand-pull','Total demand grows faster than the economy can produce: “too much money chasing too few goods”. Causes: booms, tax cuts, low interest rates, high government spending, rising exports.'],
  ['Cost-push','Rising costs of production push prices up: higher wages, oil and energy prices, raw materials, a depreciation making imports dearer, higher indirect taxes.']]),
 VS('Cost-push inflation',chain(['Oil price ↑','Firms’ costs ↑','Supply ↓','Prices ↑|across the economy'],{steps:1}),`<ul class="blist"><li>Energy is an input into almost everything — transport, heating, manufacturing.</li><li>When oil prices rose in 2022, firms passed their higher costs on to consumers.</li></ul>`),
 I('Inflation and interest rates',[
  `Central banks ${B('raise interest rates')} to reduce inflation: borrowing becomes dearer and saving more rewarding → spending falls → demand-pull pressure eases.`,
  `When inflation is low, they ${B('cut interest rates')} to encourage spending.`,
  `Savers want interest rates ABOVE inflation, otherwise their savings lose real value.`]),
 C('Impacts of inflation',[
  ['Prices','The cost of living rises; people on fixed incomes (pensioners, students) lose purchasing power.'],
  ['Wages','Workers demand pay rises → a wage-price spiral; real wages fall if pay rises less than prices.'],
  ['Exports','Domestic goods become dearer than foreign goods → exports fall, imports rise → current account worsens.'],
  ['Unemployment','Falling exports and investment may lead to job losses.'],
  ['Menu costs','Firms pay to change price lists, menus, websites and labels.'],
  ['Shoe leather costs','Time and effort spent shopping around and moving money to protect its value.'],
  ['Uncertainty & confidence','Firms can’t plan ahead → business and consumer confidence fall.'],
  ['Investment','Uncertainty and higher interest rates discourage investment → lower future growth.']]),
 EX('Exam-style: explain (3 marks)','Explain one impact of high inflation on a country’s exporters.',['High inflation makes the country’s goods <b>more expensive</b> than foreign competitors’ goods. (1)','Foreign buyers switch to cheaper substitutes from other countries. (1)','So exporters sell less abroad, their revenue falls and they may cut jobs. (1)'],'Point → chain → consequence'),
 Q('Inflation caused by a rise in wages and raw material prices is…',['Cost-push inflation','Demand-pull inflation','Deflation','Hyperinflation'],0,'Higher costs push prices up.'),
 Q('“Menu costs” of inflation refer to…',['The cost to firms of changing their prices','Higher food prices in restaurants','Time spent shopping around','Loss of savings value'],0,'Reprinting menus, price lists and labels.'),
 S('Demand-pull: demand exceeds capacity. Cost-push: costs rise.','Higher interest rates reduce inflation.','Impacts: prices, wages, exports, unemployment.','Also menu costs, shoe leather costs, uncertainty, confidence, investment.')],8);

LS('mo:4','2.1.1','ILO','Who counts as unemployed, how do we measure it, and why do people lose their jobs?',[
 FM('Unemployment','Unemployed = willing and able to work, actively seeking work, but without a job',[['ILO measure','a survey: no job, looked for work in the last 4 weeks, able to start within 2 weeks'],['Labour force','employed + unemployed']],'Unemployment rate = unemployed ÷ labour force × 100'),
 EX('Calculating the unemployment rate','A country has a labour force of 34 million and 1.53 million people are unemployed. Calculate the unemployment rate.',['Rate = unemployed ÷ labour force × 100','= 1.53 ÷ 34 × 100','= <b>4.5%</b>'],'Unemployment rate = 4.5%'),
 C('Five types of unemployment',[
  ['Cyclical','Caused by a lack of demand in a downturn or recession — firms cut output and jobs.'],
  ['Structural','Long-term decline of an industry (e.g. coal mining, textiles) — workers have the wrong skills or live in the wrong place.'],
  ['Seasonal','Demand changes with the seasons — ski instructors in summer, fruit pickers in winter.'],
  ['Frictional','Short-term, while people move between jobs (e.g. graduates searching).'],
  ['Voluntary','People choose not to work at current wages, e.g. because benefits are close to wages.']]),
 N('Labour force = 5.2 million, unemployed = 338,000. Calculate the unemployment rate (%).',6.5,'0.338 ÷ 5.2 × 100 = 6.5%.',null,'%'),
 Q('A steelworker loses their job when the steelworks closes because of cheap imports. This is…',['Structural unemployment','Seasonal unemployment','Frictional unemployment','Voluntary unemployment'],0,'Long-term decline of an industry.'),
 Q('Unemployment that rises during a recession is…',['Cyclical','Structural','Seasonal','Frictional'],0,'Caused by the economic cycle.'),
 S('Unemployed: willing, able, looking, but no job.','ILO survey measure; rate = unemployed ÷ labour force × 100.','Types: cyclical, structural, seasonal, frictional, voluntary.')],7);

LS('mo:5','2.1.1','☹','Unemployment hurts individuals, firms, the government and society. This lesson builds the chains of reasoning examiners want.',[
 C('Impacts of unemployment',[
  ['Output','Fewer people working → less is produced → lower GDP (the economy is inside its PPC).'],
  ['Scarce resources','Labour is a scarce resource being wasted — an opportunity cost for society.'],
  ['Poverty','Unemployed people lose income → more households in poverty.'],
  ['Government spending','More spent on unemployment benefits → less for schools, hospitals.'],
  ['Tax revenue','Less income tax and less VAT (people spend less) → a bigger budget deficit.'],
  ['Consumer confidence','People fear losing their jobs → save more, spend less.'],
  ['Business confidence','Falling sales → firms invest less → even fewer jobs.'],
  ['Society','Crime, health problems, homelessness, loss of skills, family stress.']]),
 VS('The double hit on government finances',chain(['Unemployment ↑','Benefits|spending ↑','Tax revenue ↓','Budget|deficit ↑'],{steps:1}),`<ul class="blist"><li>Unemployment raises spending AND cuts revenue at the same time.</li><li>This is a common “analyse” chain in Paper 2.</li></ul>`),
 EX('Exam-style: analyse (6 marks)','Analyse two possible effects of rising unemployment on the government.',['<b>Higher government spending</b>: more people claim unemployment benefits…','…so spending on welfare rises, creating an opportunity cost — less money for education or healthcare.','<b>Lower tax revenue</b>: unemployed people pay no income tax and spend less, so VAT revenue falls…','…so the government may have a larger fiscal deficit and need to borrow more.'],'Two developed effects'),
 Q('Which is an effect of higher unemployment on the government?',['Lower income tax revenue','Higher income tax revenue','Lower spending on benefits','A current account surplus'],0,'Fewer people earning → less income tax.'),
 S('Output falls and scarce labour is wasted.','Poverty rises; benefits spending ↑, tax revenue ↓.','Confidence falls → less spending and investment.','Social costs: crime, health, lost skills.')],6);

LS('mo:6','2.1.1','⇋','The current account records a country’s trade with the rest of the world. Deficits and surpluses tell you how competitive it is.',[
 FM('The current account','Current account = trade in goods + trade in services + income flows',[['Visibles','trade in goods (cars, oil, food)'],['Invisibles','trade in services (tourism, banking, insurance)']],'Balance = exports − imports. Negative = deficit, positive = surplus.'),
 EX('Calculating the balance','Exports of goods $320bn, imports of goods $410bn, exports of services $190bn, imports of services $95bn. Calculate the trade in goods balance and the current account balance (ignoring income flows).',['Goods: 320 − 410 = <b>−$90bn</b> (visible deficit)','Services: 190 − 95 = +$95bn (invisible surplus)','Current account = −90 + 95 = <b>+$5bn surplus</b>'],'Current account surplus of $5bn'),
 C('Reasons for a deficit',[
  ['Quality of domestic goods','Poor quality → consumers buy imports instead.'],
  ['Quality of foreign goods','Better foreign products (e.g. German cars) attract buyers.'],
  ['Price of domestic goods','High costs or inflation make exports uncompetitive.'],
  ['Price of foreign goods','Cheap imports (low-wage countries) increase imports.'],
  ['Exchange rates','A strong currency makes exports dearer and imports cheaper.']]),
 C('Impact of a current account deficit',[
  ['Leakage','Money flows out of the economy to pay for imports → less demand for domestic firms → fewer jobs.'],
  ['Imported inflation','If prices rise abroad, the country imports that inflation.'],
  ['Low demand for exports','A sign domestic firms are not competitive.'],
  ['Financing the deficit','The country must use foreign currency reserves or borrow from abroad.']]),
 I('Current account and exchange rates',[
  `A ${B('fall')} in the exchange rate (depreciation) makes exports cheaper and imports dearer → the current account should improve.`,
  `A ${B('rise')} (appreciation) does the opposite.`,
  `Real-world examples: the UK has run a current account deficit for decades; Germany and China run large surpluses.`]),
 N('Exports are $45bn and imports are $52bn. Calculate the current account balance in $bn (use a minus sign for a deficit).',-7,'45 − 52 = −$7bn (a deficit).',null,'$bn'),
 Q('Tourism spending by foreign visitors in a country is recorded as…',['An export of services (invisible)','An import of goods','An import of services','A visible export'],0,'Foreign tourists spending here = money flowing in from a service.'),
 S('Current account: goods (visibles) + services (invisibles) + income.','Balance = exports − imports.','Deficit causes: quality, price, exchange rates.','Deficit impacts: leakage, imported inflation, financing with reserves.')],8);

LS('mo:7','2.1.1','♣','Protecting the environment is a macroeconomic objective too. Know how firms damage it and how governments respond.',[
 C('How business activity damages the environment',[
  ['Visual pollution','Litter, fly-tipping, billboards, derelict buildings.'],
  ['Noise pollution','Airports, factories, construction, traffic.'],
  ['Air pollution','Factory and vehicle emissions → health problems and climate change.'],
  ['Water pollution','Chemicals, sewage and plastic in rivers and seas.']]),
 C('Government intervention',[
  ['Taxation','Carbon taxes, fuel duty, landfill taxes → raise the cost of polluting.'],
  ['Subsidy','Grants for renewable energy, electric cars, insulation.'],
  ['Regulation','Emission limits, bans on single-use plastics, planning rules.'],
  ['Fines','Penalties for illegal dumping or breaking emission rules.'],
  ['Pollution permits','A cap on total emissions; clean firms can sell permits (e.g. EU Emissions Trading System).'],
  ['Government provision of parks','Protects green space for public benefit — a public good.']]),
 I('The growth v environment trade-off',[
  `More output usually means more pollution and resource use.`,
  `But green growth is possible: renewable energy, recycling and green technology can raise GDP AND cut emissions.`,
  `Evaluation: depends on technology, how strictly rules are enforced, and whether countries cooperate.`]),
 Q('A government gives grants to households that install solar panels. This is…',['A subsidy','A tax','A fine','A pollution permit'],0,'A payment to encourage a beneficial activity.'),
 S('Damage: visual, noise, air, water pollution.','Tools: tax, subsidy, regulation, fines, permits, parks.','Trade-off between growth and the environment — but green growth is possible.')],6);

LS('mo:8','2.1.1','≠','Should the government make incomes more equal? Learn the definitions of poverty and the tools for redistribution.',[
 C('Key definitions',[
  ['Income inequality','The unequal distribution of income between people or households.'],
  ['Absolute poverty','Not having enough income for basic needs — food, water, shelter, clothing (World Bank: under about $3 a day).'],
  ['Relative poverty','Having much less income than the average in your society (often below 60% of median income).']]),
 C('Reasons to reduce poverty and inequality',[
  ['Meet basic needs','Everyone should have food, shelter, healthcare and education.'],
  ['Raise living standards','Higher incomes for the poorest → better health and opportunities.'],
  ['Ethical reasons','Fairness and social justice; extreme inequality can cause social unrest.']]),
 C('Government intervention',[
  ['Progressive taxation','Higher earners pay a larger % of their income in tax (e.g. income tax bands of 20%, 40%, 45%).'],
  ['Benefit payments','Unemployment benefit, child benefit, pensions, housing support transfer income to the poor.'],
  ['Education','Free schools and training give everyone the chance to gain skills and higher-paid jobs.'],
  ['Healthcare','Free or subsidised healthcare means illness does not push people into poverty.']]),
 C('Evaluation',[
  ['✔','Reduces poverty; increases spending power of low-income households.'],
  ['✘','High taxes may reduce the incentive to work or invest; skilled workers may emigrate.'],
  ['✘','Benefits may create a disincentive to work (voluntary unemployment).'],
  ['Depends on','How well benefits are targeted; whether education leads to better jobs.']]),
 Q('A tax where higher earners pay a larger percentage of their income is…',['Progressive','Regressive','Indirect','Proportional'],0,'Progressive taxes redistribute income.'),
 Q('Relative poverty means…',['Having much less income than the average in society','Not having enough food to survive','Earning the minimum wage','Being unemployed'],0,'It is relative to others in the same society.'),
 S('Inequality, absolute poverty, relative poverty — know all three.','Reasons: basic needs, living standards, ethics.','Tools: progressive tax, benefits, education, healthcare.','Evaluate incentives and targeting.')],6);

/* ════════════ 9 · GOVERNMENT POLICIES ════════════ */
LS('po:0','2.1.2','⚖','Fiscal policy uses government spending and taxation to steer the economy.',[
 FM('Fiscal policy','Fiscal policy = the use of government spending and taxation to influence the economy',[['Expansionary','spend more / tax less → boost growth and jobs'],['Contractionary','spend less / tax more → reduce inflation']],'Government revenue mainly comes from taxes.'),
 C('Direct v indirect taxes',[
  ['Direct taxes','Taxes on income and wealth, paid directly to the government: income tax, corporation tax (on profits), inheritance tax.'],
  ['Indirect taxes','Taxes on spending: VAT (sales tax), excise duties on fuel, alcohol, tobacco.']]),
 C('Main areas of government spending',[['Healthcare','hospitals, doctors, medicines'],['Education','schools, universities, training'],['Welfare','pensions, benefits'],['Defence','armed forces'],['Infrastructure','roads, railways, energy'],['Debt interest','interest on government borrowing']]),
 C('Fiscal deficit v surplus',[
  ['Fiscal (budget) deficit','Government spending > tax revenue → the government must borrow → national debt rises; future interest payments.'],
  ['Fiscal (budget) surplus','Tax revenue > government spending → can repay debt; but may mean high taxes or low spending slow growth.']]),
 EX('Calculating the budget balance','Tax revenue is $820bn and government spending is $905bn. Calculate the budget balance.',['Balance = revenue − spending = 820 − 905','= <b>−$85bn</b>','A fiscal deficit of $85bn'],'Fiscal deficit of $85bn'),
 C('Fiscal policy and the objectives',[
  ['Growth & jobs','Expansionary policy raises demand → firms produce more → more jobs.'],
  ['Inflation','Contractionary policy reduces demand → less inflationary pressure.'],
  ['Current account','Higher incomes → more imports → the current account may worsen.'],
  ['Redistribution','Progressive taxes and benefits reduce inequality.'],
  ['Environment','Green taxes and subsidies protect the environment.']]),
 Q('VAT is an example of…',['An indirect tax','A direct tax','Monetary policy','A subsidy'],0,'VAT is a tax on spending.'),
 N('Government spending is $640bn and tax revenue is $612bn. Calculate the budget balance in $bn (minus for a deficit).',-28,'612 − 640 = −$28bn.',null,'$bn'),
 S('Fiscal policy = government spending + taxation.','Direct taxes (income) v indirect taxes (spending).','Deficit: spending > revenue → borrowing.','Expansionary → growth and jobs; contractionary → lower inflation.')],8);

LS('po:1','2.1.2','%↕','The central bank changes interest rates to control inflation. Here’s the chain of effects.',[
 FM('Monetary policy','Monetary policy = the central bank’s use of interest rates (and the money supply) to influence the economy',[['Interest rate','the cost of borrowing and the reward for saving'],['Central bank','e.g. Bank of England, European Central Bank, US Federal Reserve']],'Most central banks are independent and target inflation of around 2%.'),
 VS('How a rise in interest rates works',chain(['Interest|rates ↑','Borrowing dearer,|saving rewarded','Spending &|investment ↓','Demand ↓','Inflation ↓'],{steps:1}),`<ul class="blist"><li><b>Consumers</b>: higher mortgage and loan repayments → less disposable income → spend less, save more.</li><li><b>Businesses</b>: dearer loans → postpone investment in machinery and expansion.</li><li>The exchange rate may rise (hot money inflows) → exports dearer.</li></ul>`),
 C('Interest rate rise: effects on the objectives',[
  ['Inflation','↓ — demand falls (the main aim).'],
  ['Growth','↓ — less spending and investment.'],
  ['Unemployment','↑ — firms produce less.'],
  ['Current account','Imports fall (less spending) but a stronger currency hurts exports — uncertain.']]),
 I('Asset purchasing (quantitative easing)',[
  `When interest rates are already near zero, central banks can ${B('create money to buy assets')} such as government bonds.`,
  `This lowers long-term interest rates and increases the money supply → encourages borrowing and spending.`,
  `Used after 2008 and in 2020 (COVID). Risk: it can fuel inflation and asset (house) price bubbles.`]),
 W('Interest rate simulator','rates','Move the interest rate and see the likely effects.'),
 Q('An increase in interest rates is most likely to…',['Reduce consumer spending','Increase borrowing','Increase inflation','Weaken the currency'],0,'Borrowing becomes more expensive.'),
 S('Monetary policy = interest rates set by the central bank.','Rates ↑ → borrowing ↓ spending ↓ → inflation ↓ (but growth ↓, unemployment ↑).','Rates ↓ → the opposite.','Asset purchasing (QE) when rates are near zero.')],7);

LS('po:2','2.1.2','⚙↑','Supply-side policies try to grow the economy’s capacity — shifting the PPC outwards.',[
 FM('Supply-side policy','Supply-side policy = policies that increase the productivity and productive capacity (total output) of the economy',[['Goal','shift the PPC outwards — long-term growth without inflation']],'They take time to work, but can help all objectives at once.'),
 C('The seven supply-side policies in the spec',[
  ['Privatisation','Private ownership → profit motive → efficiency.'],
  ['Deregulation','Remove unnecessary rules → more competition and lower costs.'],
  ['Education and training','Raise human capital → productivity.'],
  ['Policies for high-unemployment regions','Grants and tax breaks to attract firms to depressed areas.'],
  ['Infrastructure spending','Better transport, energy and broadband → lower business costs.'],
  ['Lower business taxes','Higher post-tax profits → more investment.'],
  ['Lower income tax','Bigger reward for working → more people work and work longer.']]),
 VS('Supply-side policy shifts the PPC outwards',ppcDiagram({shift:1,points:false,xl:'Good X',yl:'Good Y'}),`<ul class="blist"><li>Higher productivity and more resources → greater productive potential.</li><li>The economy can grow <b>without</b> demand-pull inflation.</li></ul>`),
 C('Impact on the objectives',[
  ['Growth','✔ higher productive capacity.'],['Unemployment','✔ better skills reduce structural unemployment.'],['Inflation','✔ more capacity eases inflationary pressure.'],['Current account','✔ more competitive exports.'],['Drawbacks','Slow to work (education takes years); costly; tax cuts may increase inequality; deregulation may harm the environment.']]),
 Q('Which is a supply-side policy?',['Spending on training for unemployed workers','Raising interest rates','Increasing unemployment benefits','A tariff on imports'],0,'Training improves labour productivity.'),
 S('Supply-side = raise productivity and capacity.','Policies: privatisation, deregulation, education, regional policy, infrastructure, lower taxes.','Can help growth, jobs, inflation AND the current account.','But slow, costly and may increase inequality.')],7);

LS('po:3','2.1.2','§','Sometimes the government just makes rules. Regulation, legislation, fines and permits each have pros and cons.',[
 C('Regulation & legislation',[
  ['What','Laws and rules: emission limits, safety standards, age limits, bans.'],
  ['✔','Clear and direct; can ban the most harmful activities; quick to understand.'],
  ['✘','Costly to monitor and enforce; firms may break rules; no revenue; may raise firms’ costs and prices; can be too rigid.']]),
 C('Fines',[
  ['What','A financial penalty for breaking a law.'],
  ['✔','Deters harmful behaviour; raises some revenue; “polluter pays”.'],
  ['✘','Needs enforcement; if fines are small, large firms just pay them; damage may already be done.']]),
 C('Pollution permits',[
  ['What','A cap on total pollution; permits can be traded.'],
  ['✔','Total pollution is controlled; firms that cut pollution can sell permits — an incentive to go green.'],
  ['✘','Hard to set the right cap; too many permits = little effect; monitoring is costly; rich firms can buy the right to pollute.']]),
